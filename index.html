<style>
:root{
  --blue:#1927A1; --red:#E4003D; --teal:#2FB5B8; --yellow:#FABC1D; --navy:#2D245B;
  --ink:#1b2030; --muted:#5d6577; --line:#e2e6ee; --bg:#f4f6fa; --card:#fff;
  --deep:#10507a; --accent:#15757a;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,50,.06),0 8px 24px rgba(20,25,50,.06);
  --side:286px; --head:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:calc(var(--head) + 14px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
code{font-family:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;font-size:.88em;
  background:#eef3f7;color:#0f4a5c;padding:.06em .28em;border-radius:5px;white-space:nowrap}
b{font-weight:650}
a{color:var(--blue)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:60;height:var(--head);background:var(--navy);
  display:flex;align-items:center;gap:16px;padding:0 20px;color:#fff;
  box-shadow:0 2px 14px rgba(20,25,50,.18)}
.top img{height:30px;display:block}
.top .ttl{font-weight:700;font-size:15.5px;letter-spacing:.1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-weight:400;font-size:11.5px;opacity:.72;margin-top:-2px}
.top .sp{flex:1}
.btn{border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;
  border-radius:9px;padding:7px 13px;font:inherit;font-size:13.5px;cursor:pointer;
  transition:background .15s,border-color .15s}
.btn:hover{background:rgba(255,255,255,.2)}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:9px;overflow:hidden}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-size:13.5px;
  font-weight:600;padding:7px 14px;cursor:pointer;opacity:.6}
.lang button.on{background:var(--teal);color:#06282c;opacity:1}
.burger{display:none}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:26px;
  max-width:1360px;margin:0 auto;padding:22px 20px 70px}
aside{position:sticky;top:calc(var(--head) + 22px);align-self:start;
  max-height:calc(100vh - var(--head) - 44px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px}
aside h3{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted)}
.find{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:10px;
  padding:9px 11px;font:inherit;font-size:14px;margin-bottom:12px}
.find:focus{outline:2px solid var(--teal);outline-offset:-1px;background:#fff}
.prog{margin-bottom:12px}
.prog .bar{height:7px;background:#e7ecf3;border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#1b8f93);
  border-radius:99px;transition:width .3s}
.prog .lbl{font-size:12px;color:var(--muted);margin-top:6px}
nav a{display:flex;gap:9px;align-items:baseline;padding:6px 9px;border-radius:9px;
  color:var(--ink);text-decoration:none;font-size:14px;line-height:1.38;transition:background .12s}
nav a:hover{background:#eef3f8}
nav a.on{background:#e6f5f5;color:#0d5457;font-weight:600}
nav a .num{flex:0 0 22px;font-size:11.5px;font-weight:700;color:var(--teal);
  font-variant-numeric:tabular-nums}
nav a.done .num::after{content:" ✓";color:#1b8f93}
nav a.hide{display:none}
nav hr{border:0;border-top:1px solid var(--line);margin:9px 2px}

/* ---------- cards ---------- */
main{min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:26px 30px;margin-bottom:20px;scroll-margin-top:calc(var(--head)+14px)}
section.hide{display:none}
.hero{background:linear-gradient(135deg,#1b1f6b,#10507a 58%,#15757a);color:#fff;border:0}
.hero h1{margin:0 0 6px;font-size:27px;line-height:1.22;letter-spacing:-.2px}
.hero .sub{font-size:16px;opacity:.9}
.hero .tag{font-size:13px;opacity:.72;margin-top:8px;border-top:1px solid rgba(255,255,255,.22);
  padding-top:10px}
.hero p{font-size:14.6px;opacity:.93}
.hero code{background:rgba(255,255,255,.16);color:#eafaff}
.hero .tw{border-color:rgba(255,255,255,.2)}
.hero th{background:rgba(255,255,255,.14);color:#dff4f7;border-bottom-color:rgba(255,255,255,.2)}
.hero td{border-bottom-color:rgba(255,255,255,.14)}
.hero tbody tr:hover{background:rgba(255,255,255,.07)}
.hdr{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid #e9edf4;
  padding-bottom:12px;margin-bottom:16px}
.hdr .n{flex:0 0 42px;height:42px;border-radius:12px;background:#e6f5f5;color:#0d5457;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.hdr h2{margin:0;font-size:21px;line-height:1.25;letter-spacing:-.2px}
.hdr .obj{font-size:12.5px;color:var(--muted);margin-top:3px}
.hdr .sp{flex:1}
.mark{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:6px 11px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.mark:hover{border-color:var(--teal);color:#0d5457}
.mark.on{background:#e6f5f5;border-color:#9fd9da;color:#0d5457;font-weight:600}
h3.sec{font-size:16.5px;margin:22px 0 7px;color:var(--deep);letter-spacing:-.1px}
section p{margin:0 0 10px}
ul.b{margin:0 0 12px;padding-left:20px}
ul.b li{margin-bottom:5px}
.lead{margin:0 0 11px}
.lead b{color:var(--deep)}

/* ---------- code ---------- */
.code{position:relative;background:#0f1b24;color:#d8e8ef;border-radius:11px;
  padding:14px 48px 14px 16px;margin:8px 0 14px;overflow-x:auto;
  font-family:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;font-size:13.2px;line-height:1.62;
  white-space:pre;border-left:4px solid var(--teal)}
.code .cp{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#cfe6ee;border-radius:7px;padding:4px 8px;
  font:inherit;font-size:11px;font-family:inherit;cursor:pointer;opacity:0;transition:opacity .15s}
.code:hover .cp,.code .cp:focus{opacity:1}
.code .kw{color:#7fd4ff;font-weight:600}
.code .cm{color:#7f9aa8;font-style:italic}
.code .st{color:#ffd48a}

/* ---------- tables ---------- */
.tw{overflow-x:auto;margin:8px 0 16px;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:14.3px}
th{background:#eef4f6;color:#0d5457;text-align:left;font-size:12.4px;letter-spacing:.02em;
  padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid #eef1f6;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fbfc}

/* ---------- exam + qa ---------- */
.exam{background:#fff9e8;border:1px solid #f6e3b0;border-left:5px solid var(--yellow);
  border-radius:11px;padding:14px 17px;margin:6px 0 4px;font-size:15px}
.exam code{background:#f6ecd2;color:#6b4a06}
.cap{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 9px}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.cap .sp{flex:1}
.cap button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;
  font:inherit;font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer}
.cap button:hover{border-color:var(--teal);color:#0d5457}
.qa{border:1px solid var(--line);border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fcfdfe}
.qa>button{width:100%;display:flex;align-items:flex-start;gap:11px;text-align:left;border:0;
  background:transparent;font:inherit;font-size:15px;padding:12px 15px;cursor:pointer;color:var(--ink)}
.qa>button:hover{background:#f3f7fa}
.qa .ar{flex:0 0 16px;color:var(--teal);font-weight:700;transition:transform .2s;margin-top:1px}
.qa.open .ar{transform:rotate(90deg)}
.qa .ans{display:none;padding:0 15px 13px 42px;color:#0d5457;font-weight:600;font-size:15px}
.qa.open .ans{display:block}

/* ---------- glossary ---------- */
.gl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0 18px;
  border-top:1px solid var(--line);padding:11px 2px}
.gl:first-of-type{border-top:0}
.gl.hide{display:none}
.gl .t{font-weight:700;color:var(--deep);font-size:15px}
.gl .en{font-size:14.4px}
.gl .xx{font-size:13.6px;color:var(--muted);margin-top:3px}
.empty{color:var(--muted);padding:18px 2px;font-size:14.5px}
mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}

/* ---------- misc ---------- */
.up{position:fixed;right:20px;bottom:20px;z-index:50;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:#fff;color:var(--deep);font-size:17px;cursor:pointer;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.up.on{opacity:1;pointer-events:auto}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:6px 0 0}

@media (max-width:1000px){
  :root{--head:58px}
  .wrap{grid-template-columns:1fr;padding:16px 14px 60px}
  aside{position:fixed;left:0;top:var(--head);bottom:0;width:290px;z-index:55;border-radius:0;
    max-height:none;transform:translateX(-102%);transition:transform .22s;box-shadow:6px 0 24px rgba(20,25,50,.14)}
  body.nav aside{transform:none}
  .burger{display:block}
  .top .ttl span{display:none}
  section{padding:20px 17px}
  .hdr h2{font-size:18.5px}
  .gl{grid-template-columns:1fr;gap:2px}
  .mark{padding:6px 9px;font-size:0}
  .mark::before{content:"✓";font-size:14px}
  .mark.on::before{color:#0d5457}
}
@media (max-width:700px){
  .top{gap:10px;padding:0 12px}
  .top img{height:26px}
  .top .ttl{display:none}
  #print{display:none}
}
@media print{
  .top,aside,.up,.mark,.cap button,.code .cp{display:none!important}
  body{background:#fff}
  .wrap{display:block;max-width:none;padding:0}
  section{box-shadow:none;border:0;padding:0;margin:0 0 18px;break-inside:avoid}
  .qa .ans{display:block!important}
  .hero{background:#10507a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    padding:18px!important}
  .code,.exam,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>const DATA={"ru":{"subtitle":"Рабочий конспект для студентов","tagline":"Блоки 1–17 · все пять доменов · объективы в редакции мая 2025 года","intro":["Этот конспект охватывает весь экзамен IT Specialist Databases. Материал разбит на семнадцать блоков, каждый из которых закрывает одну цель экзамена. Внутри блока сначала идёт разбор понятий, затем сводная таблица, затем два обязательных раздела: «Для экзамена» с формулировками, которые надо знать дословно, и «Проверь себя» с короткими вопросами для самопроверки. В конце — словарь всех терминов: сверху английское определение в той формулировке, в какой термин встретится на экзамене, снизу серым — то же самое по-русски.","Экзамен сдаётся на английском языке, а синтаксис в вопросах приводится в ANSI SQL. Поэтому все ключевые слова, названия команд и определения в конспекте оставлены по-английски: именно в этом виде они появятся на экране во время экзамена."],"mapRows":[["1","Таблицы, строки и столбцы","1.1 Design tables for storing data"],["2","Первичный ключ","1.2 Identify the appropriate primary key"],["3","Типы данных","1.3 Choose data types to meet requirements"],["4","Связи между таблицами и ERD","1.4 Design relationships between tables"],["5","Нормализация","1.5 Normalize a database"],["6","Защита данных","1.6 Identify data protection measures"],["7","CREATE, ALTER и DROP: таблицы","2.1 Create, alter, and drop tables"],["8","Представления (views)","2.2 Create, alter, and drop views"],["9","Хранимые процедуры и функции","2.3 Stored procedures and functions"],["10","Индексы","2.4 Clustered vs. non-clustered indexes"],["11","Соединение таблиц: JOIN","3.1 Queries that select data (часть 1)"],["12","UNION, DISTINCT, алиасы, вычисления","3.1 Queries that select data (часть 2)"],["13","Сортировка и фильтрация","3.2 Queries that sort and filter data (часть 1)"],["14","TOP, IN, ANY, ALL и NULL","3.2 Queries that sort and filter data (часть 2)"],["15","Агрегация данных","3.3 Queries that aggregate data"],["16","INSERT, UPDATE, DELETE","4.1 · 4.2 · 4.3 Data manipulation"],["17","Поиск ошибок в запросах","5.1 · 5.2 · 5.3 Troubleshooting"]],"blocks":[{"n":1,"title":"Таблицы, строки и столбцы","plain":"Таблицы, строки и столбцы","obj":"Domain 1 · цель экзамена 1.1 Given a scenario, design tables for storing data","intro":"Это самый первый блок курса: здесь появляются слова, которыми дальше описывается всё остальное. Разберём, что такое база данных, из чего она состоит и как называются её части по-английски.","body":[{"k":"h","v":"1.1. База данных, СУБД и SQL"},{"k":"p","v":"<b>Database</b> — файл, который хранит данные и позволяет их искать и строить по ним отчёты. <b>Data</b> — информация, организованная, внесённая в файлы и доступная для получения в любой момент."},{"k":"p","v":"<b>SQL</b> (Structured Query Language) — язык, на котором пишут запросы к данным. Он состоит из ключевых слов: <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code> и других. <b>SQL Server</b> — серверная программа, которая хранит базы данных и все связанные с ними настройки."},{"k":"lead","label":"Важно.","v":"Экзамен проверяет знание ANSI SQL — стандартного варианта языка, общего для MySQL, Microsoft SQL Server и Oracle. Примеры в учебных видео показаны в SQL Server, но формулировки вопросов будут стандартными."},{"k":"h","v":"1.2. Entity, row, column"},{"k":"p","v":"Данные хранятся в <b>entities</b> — сущностях. Второе название того же самого — <b>table</b>, таблица. У таблицы есть строки и столбцы."},{"k":"b","v":["<b>Entity</b> (она же <b>table</b>) — объект базы данных с организованными строками и столбцами данных.","<b>Row</b> (она же <b>record</b>) — одна строка, блок данных со значениями для каждого столбца. Одна запись — один объект: один человек, один заказ, один товар.","<b>Column</b> (он же <b>field</b>) — свойство, которое описывает данные в сущности. Столбцы — это характеристики: имя, дата, цена."]},{"k":"lead","label":"Пример.","v":"В таблице <code>Person.Person</code> базы AdventureWorks почти 20 000 строк и 13 столбцов. Каждая строка — один человек. Каждый столбец — одна его характеристика: имя, фамилия, дата изменения записи."},{"k":"lead","label":"Как запомнить:","v":"строка — про кого запись, столбец — что мы про него знаем."},{"k":"h","v":"1.3. Relational database"},{"k":"p","v":"<b>Relational database</b> — база данных, сущности которой можно соединять между собой через общее поле. Именно поэтому данные не хранят в одной огромной таблице: их разносят по нескольким и связывают. Как это делается — в блоке 4."},{"k":"p","v":"В SQL Server таблицы принято записывать в виде <code>схема.таблица</code>: <code>Person.Person</code>, <code>Sales.Customer</code>, <code>dbo.Employees</code>. Первая часть — <b>schema</b>, папка внутри базы. Эту запись вы будете видеть в каждом запросе на экзамене."},{"k":"h","v":"1.4. Object Explorer"},{"k":"p","v":"<b>Object Explorer</b> — окно в SQL Server Management Studio, где видны все базы данных сервера и их объекты: таблицы, представления, процедуры, индексы. Это то место, откуда начинается любая работа."},{"k":"table","head":["Термин","Что это","Как запомнить"],"rows":[["Data","Организованная информация, доступная для поиска","Сырьё"],["Database","Файл, который хранит данные и позволяет строить отчёты","Хранилище"],["Entity / Table","Объект со строками и столбцами","Одна тема — одна таблица"],["Row / Record","Одна строка данных","Один объект"],["Column / Field","Свойство, описывающее данные","Одна характеристика"],["Relational database","База, таблицы которой связаны общим полем","Таблицы дружат"],["SQL","Язык запросов на ключевых словах","Язык вопросов к данным"],["Object Explorer","Окно со списком баз и их объектов","Проводник по серверу"]]}],"exam":"Entity = table, row = record, column = field — на экзамене эти пары используются как синонимы, вопрос может содержать любое из двух слов. Строка — это одна запись целиком, столбец — одно свойство у всех записей. Relational database — база, в которой таблицы связаны через общее поле.","qa":[["Как ещё называется entity?","Table — таблица."],["Как ещё называется row?","Record — запись."],["Как ещё называется column?","Field — поле."],["Что описывает столбец, а что строка?","Столбец — одно свойство данных; строка — один полный объект."],["Что делает базу relational?","Её таблицы можно соединять через общее для них поле."],["На каком варианте SQL сформулированы вопросы экзамена?","На ANSI SQL."]]},{"n":2,"title":"Первичный ключ","plain":"Первичный ключ","obj":"Domain 1 · цель экзамена 1.2 Given a scenario, identify the appropriate primary key","intro":"У каждой таблицы должно быть поле, которое отличает одну запись от всех остальных. Это и есть первичный ключ.","body":[{"k":"h","v":"2.1. Primary key"},{"k":"p","v":"<b>Primary key</b> — поле сущности, которое гарантирует, что каждая запись в ней уникальна. Проще говоря: по значению первичного ключа всегда можно найти ровно одну строку и не перепутать её с другой."},{"k":"p","v":"Три свойства первичного ключа:"},{"k":"b","v":["значения не повторяются;","значение не может быть пустым, то есть не может быть <code>NULL</code>;","значение не меняется со временем."]},{"k":"p","v":"Первичный ключ определяют, <b>когда сущность только проектируют</b>, а не после того, как в неё уже занесли данные."},{"k":"h","v":"2.2. Composite / compound key"},{"k":"p","v":"Иногда одного столбца не хватает, чтобы запись стала уникальной. Тогда ключом делают комбинацию из двух и более столбцов. Такой ключ называют <b>composite key</b> или <b>compound key</b> — это два названия одного и того же."},{"k":"lead","label":"Пример.","v":"В таблице посещаемости ни <code>StudentID</code>, ни <code>LessonID</code> по отдельности не уникальны: один ученик приходит на много уроков, на одном уроке бывает много учеников. А вот пара «ученик + урок» встречается ровно один раз — она и будет составным ключом."},{"k":"lead","label":"Пример из AdventureWorks.","v":"В <code>Sales.SalesOrderDetail</code> первичный ключ составной: <code>SalesOrderID</code> плюс <code>SalesOrderDetailID</code>."},{"k":"h","v":"2.3. Как выбрать ключ в задании"},{"k":"p","v":"На экзамене вопрос обычно звучит так: дано описание таблицы, надо выбрать подходящий первичный ключ. Порядок рассуждения:"},{"k":"b","v":["Найдите поле, значения которого точно не повторятся ни у кого. Обычно это поле с <code>ID</code> в названии.","Проверьте, что оно не может быть пустым.","Если такого одного поля нет — ищите пару полей, которая вместе даёт уникальность. Это будет composite key.","Не берите в ключ то, что может измениться: фамилию, телефон, адрес, email."]},{"k":"table","head":["Термин","Что это","Как запомнить"],"rows":[["Primary key","Поле, делающее каждую запись уникальной","Паспорт строки"],["Composite key","Ключ из двух и более полей","Пара, которой хватает"],["Compound key","То же самое, второе название","Синоним composite"],["Constraint","Ограничение на то, что можно ввести в поле","Правило для поля"]]}],"exam":"Primary key ensures that every record in a table is unique — эту формулировку надо узнавать дословно. Первичный ключ никогда не бывает пустым. Если одного поля для уникальности не хватает, используется composite или compound key — это одно и то же понятие под двумя именами. Ключ назначается на этапе проектирования сущности.","qa":[["Какое поле гарантирует, что каждая запись в таблице уникальна?","Primary key."],["Как называется ключ, когда первичным ключом должны быть два поля?","Composite key, он же compound key."],["Может ли первичный ключ быть пустым?","Нет. Значение NULL в первичном ключе недопустимо."],["Когда назначают первичный ключ?","Когда сущность только проектируют."],["Почему email — плохой первичный ключ?","Он может измениться, а ключ должен быть постоянным."],["Какой ключ будет у таблицы посещаемости с полями StudentID и LessonID?","Составной: StudentID + LessonID."]]},{"n":3,"title":"Типы данных","plain":"Типы данных","obj":"Domain 1 · цель экзамена 1.3 Given a scenario, choose data types to meet requirements","intro":"Тип данных задаётся у каждого столбца и определяет, что в него можно положить. Выбор типа влияет сразу на три вещи: какие операции будут работать, сколько места займут данные и как быстро будет идти поиск.","body":[{"k":"h","v":"3.1. Зачем нужен тип данных"},{"k":"p","v":"<b>Data type</b> — настройка, которая определяет, какие данные можно ввести в поле: число, дату или текстовую строку. Большинство типов — это текст или числа."},{"k":"p","v":"Если хранить дату как текст, сортировка и сравнение сломаются: строка «02.01.2025» окажется раньше строки «10.12.2024», потому что текст сравнивается посимвольно. Если хранить число как текст, по нему нельзя посчитать сумму. Поэтому тип выбирают по смыслу данных, а не «лишь бы влезло»."},{"k":"h","v":"3.2. Числа"},{"k":"b","v":["<b>Integer</b> — целые числа. <code>int</code> занимает четыре байта, <code>tinyint</code> — один байт.","<code>decimal</code> и <code>numeric</code> — числа с фиксированной точностью, для денег и измерений.","<code>money</code> — специальный денежный тип. Диапазон примерно от −922 до 922 триллионов.","<code>float</code> и <code>real</code> — приблизительные числа. Для денег не подходят."]},{"k":"h","v":"3.3. Текст и Unicode"},{"k":"b","v":["<b>Varchar</b> — тип, который хранит заданное число символов в поле.","<b>Nvarchar</b> — то же самое, но с поддержкой <b>Unicode</b>. Unicode — набор символов, допускающий цифры, буквы и знаки, в том числе символы других языков.","<code>char</code> и <code>nchar</code> — те же пары, но с фиксированной длиной."]},{"k":"lead","label":"Ключевой факт.","v":"Nvarchar занимает вдвое больше места, потому что хранит данные в Unicode: два байта на символ вместо одного. Зато в нём можно хранить кириллицу, иероглифы и любые национальные алфавиты."},{"k":"h","v":"3.4. Даты, время и логические значения"},{"k":"b","v":["<b>Datetime</b> — тип, который хранит дату и время. Есть также <code>date</code> — только дата, <code>time</code> — только время.","<b>Bit</b> — тип, который хранит либо ноль, либо единицу.","<b>Boolean</b> — тип, допускающий значения true или false. В SQL Server его роль выполняет <code>bit</code>: поле «да/нет», «истина/ложь»."]},{"k":"h","v":"3.5. Storage requirements"},{"k":"p","v":"<b>Byte</b> — единица измерения, показывающая, сколько памяти займёт кусок данных. На таблице в миллион строк разница между типами становится заметной: лишний байт на строку — это лишний мегабайт на диске и в памяти."},{"k":"table","head":["Тип","Что хранит","Размер"],"rows":[["tinyint","Целые от 0 до 255","1 байт"],["smallint","Небольшие целые числа","2 байта"],["int","Целые числа","4 байта"],["bigint","Очень большие целые числа","8 байт"],["bit","0 или 1, да/нет","1 бит"],["money","Денежные суммы, ±922 трлн","8 байт"],["decimal(p,s)","Числа с фиксированной точностью","5–17 байт"],["varchar(n)","Текст без Unicode","1 байт на символ"],["nvarchar(n)","Текст с Unicode","2 байта на символ"],["datetime","Дата и время","8 байт"]]}],"exam":"Int — четыре байта, tiny integer — один байт. Nvarchar использует вдвое больше символов, потому что хранит данные в Unicode. Bit хранит либо ноль, либо единицу. Диапазон money — от −922 до 922 триллионов. Boolean — это поле Yes/No, True/False. Для денег берут decimal или money, но не float.","qa":[["Сколько байт занимает поле типа int?","Четыре байта."],["А поле типа tinyint?","Один байт."],["Почему nvarchar занимает вдвое больше места, чем varchar?","Потому что хранит данные в Unicode: два байта на символ."],["Какой тип хранит только ноль или единицу?","Bit."],["Какой тип выбрать для поля «Есть ли льгота»?","Bit — это логическое поле Yes/No."],["Каков диапазон значений поля money?","Примерно от −922 до 922 триллионов."],["Почему нельзя хранить дату в текстовом поле?","Сломаются сортировка и сравнение: текст сравнивается посимвольно."]]},{"n":4,"title":"Связи между таблицами и ERD","plain":"Связи между таблицами и ERD","obj":"Domain 1 · цель экзамена 1.4 Given a scenario, design relationships between tables","intro":"Данные разносят по нескольким таблицам и связывают между собой. Связь строится на паре ключей: первичном в одной таблице и внешнем в другой.","body":[{"k":"h","v":"4.1. Foreign key"},{"k":"p","v":"<b>Foreign key</b> — поле сущности, которое помогает создать связь «один ко многим» между сущностями. Внешний ключ хранит значение первичного ключа другой таблицы."},{"k":"lead","label":"Главное правило:","v":"внешний ключ всегда живёт на стороне «многих». У клиента много заказов, значит <code>CustomerID</code> лежит в таблице заказов, а не наоборот."},{"k":"h","v":"4.2. Три типа связей"},{"k":"b","v":["<b>One-to-one relationship</b> — связь между двумя первичными ключами в двух сущностях. Встречается редко.","<b>One-to-many relationship</b> — связь между первичным ключом в одной сущности и внешним ключом в другой. Самый частый случай: один клиент — много заказов.","<b>Many-to-many</b> — напрямую в реляционной базе не существует. Её реализуют через промежуточную таблицу, у которой обычно составной ключ."]},{"k":"lead","label":"Пример many-to-many.","v":"Ученик изучает много предметов, предмет изучают много учеников. Между <code>Student</code> и <code>Subject</code> ставят третью таблицу <code>Enrollment</code> с полями <code>StudentID</code> и <code>SubjectID</code> — и получают две связи «один ко многим» вместо одной «многие ко многим»."},{"k":"h","v":"4.3. ERD"},{"k":"p","v":"<b>ERD</b> (Entity Relationship Diagram) — визуальное представление базы данных, её сущностей и связей между ними. На диаграмме прямоугольники — таблицы, линии между ними — связи, а значки на концах линий показывают кардинальность: сколько записей с одной стороны соответствует записям с другой."},{"k":"h","v":"4.4. Referential integrity"},{"k":"p","v":"<b>Referential integrity</b> — гарантия того, что в связи «один ко многим» значение сначала должно появиться в первичном ключе таблицы на стороне «один», и только потом его разрешено использовать на стороне «многие»."},{"k":"p","v":"<b>Orphaned record</b> — «осиротевшая» запись: строка на стороне «многих», у которой во внешнем ключе стоит значение, которого нет в первичном ключе связанной таблицы. Например, заказ на клиента, которого не существует. Ссылочная целостность нужна именно для того, чтобы таких записей не появлялось."},{"k":"table","head":["Термин","Что это","Как запомнить"],"rows":[["Foreign key","Поле, ссылающееся на первичный ключ другой таблицы","Живёт на стороне «многих»"],["One-to-one","Связь двух первичных ключей","Один к одному"],["One-to-many","Первичный ключ ↔ внешний ключ","Один клиент — много заказов"],["ERD","Схема сущностей и связей между ними","Карта базы"],["Referential integrity","Сначала в «один», потом в «многие»","Родитель раньше ребёнка"],["Orphaned record","Запись со ссылкой в никуда","Заказ без клиента"]]}],"exam":"One-to-one — связь двух первичных ключей. One-to-many — связь первичного ключа с внешним; внешний ключ всегда на стороне «многих». Связь «многие ко многим» реализуется через промежуточную таблицу. Referential integrity не даёт появиться orphaned record — записи с внешним ключом, для которого нет соответствующего первичного ключа.","qa":[["Какие ключи участвуют в связи «один ко многим»?","Первичный ключ одной таблицы и внешний ключ другой."],["В какой из двух таблиц лежит внешний ключ?","В той, что на стороне «многих»."],["Что за связь между двумя первичными ключами двух таблиц?","One-to-one."],["Как реализуют связь «многие ко многим»?","Через промежуточную таблицу с составным ключом."],["Как расшифровывается ERD?","Entity Relationship Diagram."],["Что такое orphaned record?","Запись, у которой во внешнем ключе стоит значение, отсутствующее в первичном ключе связанной таблицы."],["Что предотвращает появление таких записей?","Referential integrity."]]},{"n":5,"title":"Нормализация","plain":"Нормализация","obj":"Domain 1 · цель экзамена 1.5 Normalize a database","intro":"Нормализация — процесс, который приводит таблицы в порядок так, чтобы они правильно работали друг с другом. Экзамен требует уметь доводить базу до третьей нормальной формы.","body":[{"k":"h","v":"5.1. Зачем нормализовать"},{"k":"p","v":"<b>Normalization</b> — процесс, обеспечивающий, что сущность в базе данных может работать с другими сущностями так, как это нужно организации, с точки зрения структуры и связей."},{"k":"p","v":"Если всё держать в одной плоской таблице, начинаются три вида проблем:"},{"k":"b","v":["одни и те же данные повторяются сотни раз — это избыточность;","при изменении данных приходится править их во множестве строк, и легко что-то пропустить;","удаляя одну запись, можно случайно потерять единственное упоминание чего-то другого."]},{"k":"h","v":"5.2. First Normal Form (1NF)"},{"k":"p","v":"<b>1NF</b> — форма нормализации, при которой каждое поле содержит <b>единственное значение</b>, чтобы данные можно было отсортировать любым способом."},{"k":"p","v":"Что нарушает 1NF: список в одной ячейке («Математика, Физика, Химия») и повторяющиеся группы столбцов (<code>Phone1</code>, <code>Phone2</code>, <code>Phone3</code>)."},{"k":"h","v":"5.3. Second Normal Form (2NF)"},{"k":"p","v":"<b>2NF</b> — таблица уже в 1NF, и при этом каждый неключевой столбец зависит от <b>всего</b> составного ключа, а не от его части. Вторая нормальная форма имеет смысл только там, где ключ составной: если ключ состоит из одного поля, нарушить 2NF невозможно."},{"k":"lead","label":"Пример.","v":"В таблице с ключом «заказ + товар» название товара зависит только от товара, а не от пары целиком. Значит, название товара надо вынести в отдельную таблицу."},{"k":"h","v":"5.4. Third Normal Form (3NF)"},{"k":"p","v":"<b>3NF</b> — форма нормализации, при которой изменение значения в неключевом столбце одной таблицы не требует изменения другого неключевого столбца в той же сущности."},{"k":"p","v":"Проще: неключевой столбец не должен зависеть от другого неключевого столбца. Классический пример — почтовый индекс и город: город определяется индексом, а не первичным ключом строки. Значит, пару «индекс — город» выносят в отдельную таблицу."},{"k":"table","head":["Форма","Правило","Как проверить"],"rows":[["1NF","В каждой ячейке одно значение","Есть списки в ячейке? Есть Phone1, Phone2?"],["2NF","Нет зависимости от части составного ключа","Ключ составной? Всё ли зависит от него целиком?"],["3NF","Неключевой столбец не зависит от неключевого","Можно ли вычислить один столбец из другого?"]]}],"exam":"1NF — в каждом поле одно значение, чтобы данные можно было сортировать любым способом. 2NF существует только при составном ключе. 3NF — изменение неключевого столбца не должно требовать изменения другого неключевого столбца. Нормализация борется с избыточностью и аномалиями при вставке, изменении и удалении.","qa":[["Что требует первая нормальная форма?","Чтобы каждое поле содержало единственное значение."],["Столбцы Phone1, Phone2, Phone3 — какую форму это нарушает?","Первую: это повторяющаяся группа."],["В каком случае вторая нормальная форма не может быть нарушена?","Когда первичный ключ состоит из одного поля."],["Что запрещает третья нормальная форма?","Зависимость одного неключевого столбца от другого неключевого."],["До какой нормальной формы надо уметь доводить базу на экзамене?","До третьей — 3NF."],["Зачем вообще нормализуют базу?","Чтобы убрать избыточность и аномалии при вставке, изменении и удалении данных."]]},{"n":6,"title":"Защита данных","plain":"Защита данных","obj":"Domain 1 · цель экзамена 1.6 Given a scenario, identify data protection measures","intro":"Данные надо не только правильно спроектировать, но и защитить: сделать копии, аккуратно раздать права, скрыть чувствительные значения и фиксировать, кто что делал. В редакции объективов 2025 года этот раздел заметно расширен.","body":[{"k":"h","v":"6.1. Резервные копии и восстановление"},{"k":"b","v":["<b>Backup</b> — копия данных, хранящаяся в другом месте, чтобы её можно было восстановить при потере или повреждении оригинала.","<b>Full backup</b> — резервная копия всей базы данных целиком.","<b>Differential backup</b> — копия данных, изменившихся со времени последней полной копии. Занимает меньше места и делается быстрее.","<b>Restore</b> — процесс замены потерянных или испорченных данных их копией."]},{"k":"lead","label":"Как это работает вместе.","v":"Полную копию делают, например, раз в неделю, а разностные — каждый день. При аварии восстанавливают сначала полную копию, затем последнюю разностную."},{"k":"h","v":"6.2. Принцип наименьших привилегий и роли"},{"k":"p","v":"<b>Principle of least privilege</b> — принцип назначения прав, при котором люди, имеющие доступ к базе, получают права, необходимые для выполнения их рабочих обязанностей, и <b>только эти</b> права."},{"k":"p","v":"<b>Role</b> — определённый набор прав внутри базы данных. Роли удобны тем, что права раздаются не каждому человеку по отдельности, а группе: назначил роль — выдал сразу весь нужный набор."},{"k":"h","v":"6.3. GRANT, WITH GRANT OPTION, REVOKE"},{"k":"b","v":["<b>GRANT</b> — выдать право на объект базы данных пользователю или роли.","<b>WITH GRANT OPTION</b> — дополнение к <code>GRANT</code>: получатель не просто получает право, но и может выдавать это право дальше другим. Использовать надо осторожно — контроль над правами теряется.","<b>REVOKE</b> — забрать ранее выданное право."]},{"k":"code","v":"GRANT EXECUTE ON GetDepartment TO procTester WITH GRANT OPTION;\nREVOKE EXECUTE ON GetDepartment FROM procTester CASCADE;","raw":"GRANT EXECUTE ON GetDepartment TO procTester WITH GRANT OPTION;\nREVOKE EXECUTE ON GetDepartment FROM procTester CASCADE;"},{"k":"p","v":"<code>CASCADE</code> в <code>REVOKE</code> означает: забрать право не только у самого пользователя, но и у всех, кому он успел его передать."},{"k":"h","v":"6.4. Encryption, hashing и masking"},{"k":"p","v":"Три разных способа скрыть данные — экзамен проверяет, что вы их не путаете."},{"k":"b","v":["<b>Encryption</b> — шифрование. Данные превращаются в нечитаемый вид, но их можно вернуть обратно, если есть ключ. Применяют к данным на диске и к данным, которые передаются по сети.","<b>Hashing</b> — хеширование. Данные превращаются в строку фиксированной длины, и обратно их вернуть <b>нельзя</b>. Так хранят пароли: систему можно проверить на совпадение, но узнать исходный пароль из хеша не получится.","<b>Masking</b> — маскирование. Настоящее значение остаётся в базе, но пользователю показывается скрытым: «**<b> </b><b> </b>** 1234». Так дают доступ к базе тем, кому не положено видеть полные данные."]},{"k":"lead","label":"Как запомнить:","v":"encryption — можно расшифровать обратно; hashing — нельзя; masking — данные целы, скрыт только показ."},{"k":"h","v":"6.5. Auditing"},{"k":"p","v":"<b>Auditing</b> — аудит: ведение журнала того, кто, когда и какие действия выполнял в базе данных. Аудит не предотвращает нарушение, а фиксирует его. Он нужен, чтобы после инцидента можно было выяснить, что именно произошло, и чтобы выполнить требования регуляторов."},{"k":"table","head":["Мера","Что делает","Когда применяют"],"rows":[["Full backup","Копия всей базы целиком","Регулярно, база целиком"],["Differential backup","Копия изменений с последней полной","Ежедневно, между полными"],["Restore","Возврат данных из копии","После потери или повреждения"],["Least privilege","Только необходимые права","Всегда, при выдаче доступа"],["Role","Набор прав для группы","Когда людей много"],["Encryption","Скрывает данные обратимо","Диск, передача по сети"],["Hashing","Скрывает необратимо","Пароли"],["Masking","Скрывает при показе","Частичный доступ к данным"],["Auditing","Записывает, кто что делал","Расследование, отчётность"]]}],"exam":"Full backup — вся база, differential — только изменения с момента последней полной копии. Restore — процесс возврата данных из копии. Principle of least privilege: у человека есть права, нужные для его работы, и никаких других. GRANT выдаёт право, WITH GRANT OPTION позволяет передавать его дальше, REVOKE забирает. Encryption обратимо, hashing необратимо, masking скрывает только отображение. Auditing фиксирует действия, но не запрещает их.","qa":[["Что копирует differential backup?","Данные, изменившиеся со времени последней полной резервной копии."],["Что такое restore?","Процесс замены потерянных или повреждённых данных их копией."],["Сформулируйте принцип наименьших привилегий.","У человека есть ровно те права, которые нужны для его работы, и никаких других."],["Что добавляет WITH GRANT OPTION?","Возможность передавать полученное право другим."],["Чем hashing отличается от encryption?","Хеширование необратимо: исходные данные из хеша не восстановить. Шифрование обратимо при наличии ключа."],["Какую меру применяют, чтобы показать только последние четыре цифры карты?","Masking — маскирование."],["Для чего нужен аудит?","Чтобы фиксировать, кто, когда и что делал в базе данных."],["Что такое role в базе данных?","Определённый набор прав, который выдаётся сразу целиком."]]},{"n":7,"title":"CREATE, ALTER и DROP: работа с таблицами","plain":"CREATE, ALTER и DROP: работа с таблицами","obj":"Domain 2 · цель экзамена 2.1 Construct and analyze queries that create, alter, and drop tables","intro":"Домен 2 называется Database Object Management using DDL. DDL — это команды, которые меняют не данные, а структуру базы. Начинаем с таблиц.","body":[{"k":"h","v":"7.1. DDL и DML"},{"k":"p","v":"Все команды SQL делятся на две большие группы, и экзамен проверяет умение их различать."},{"k":"b","v":["<b>DDL</b> (Data Definition Language) — работа со структурой: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>.","<b>DML</b> (Data Manipulation Language) — работа с данными: <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>."]},{"k":"p","v":"<b>CREATE</b> — ключевое слово, добавляющее объект в базу данных или целую базу в экземпляр SQL Server. <b>ALTER</b> — изменяющее определение объекта базы данных. <b>DROP</b> — удаляющее объект базы данных."},{"k":"h","v":"7.2. CREATE TABLE"},{"k":"p","v":"Порядок такой: <code>CREATE TABLE</code>, имя таблицы, круглая скобка, список столбцов через запятую, закрывающая скобка. Каждый столбец описывается как «имя — тип — ограничения»."},{"k":"code","v":"CREATE TABLE BikeRepairs (\n    BikeRepairID      int,\n    CustomerID        int,\n    StartDate         datetime,\n    EndDate           datetime,\n    EstHour           int,\n    EstRate           money,\n    RepairDescription varchar(50)\n)","raw":"CREATE TABLE BikeRepairs (\n    BikeRepairID      int,\n    CustomerID        int,\n    StartDate         datetime,\n    EndDate           datetime,\n    EstHour           int,\n    EstRate           money,\n    RepairDescription varchar(50)\n)"},{"k":"lead","label":"Частая ошибка:","v":"запятая после последнего столбца. Её быть не должно."},{"k":"h","v":"7.3. NULL и NOT NULL"},{"k":"p","v":"<b>NULL</b> — ключевое слово SQL, обозначающее пустое значение в поле. Это не ноль и не пустая строка, а именно <b>отсутствие значения</b>."},{"k":"p","v":"<code>NOT NULL</code> в описании столбца означает: поле обязательно к заполнению, пустым его оставить нельзя. Если ничего не указано, поле считается допускающим <code>NULL</code>."},{"k":"code","v":"CREATE TABLE BikeRepairsTest2 (\n    BikeRepairID int not null primary key,\n    CustomerID   int not null,\n    StartDate    datetime,\n    EstRate      money not null,\n    RepairDescription varchar(50)\n)","raw":"CREATE TABLE BikeRepairsTest2 (\n    BikeRepairID int not null primary key,\n    CustomerID   int not null,\n    StartDate    datetime,\n    EstRate      money not null,\n    RepairDescription varchar(50)\n)"},{"k":"p","v":"Здесь <code>BikeRepairID</code>, <code>CustomerID</code> и <code>EstRate</code> заполнять обязательно, а <code>StartDate</code> и <code>RepairDescription</code> можно оставить пустыми."},{"k":"h","v":"7.4. ALTER TABLE"},{"k":"p","v":"<code>ALTER TABLE</code> меняет уже существующую таблицу: добавляет столбец, меняет его тип или удаляет его."},{"k":"code","v":"ALTER TABLE BikeRepairs\n   ADD DueDate datetime\n\nALTER TABLE BikeRepairs\n   ALTER COLUMN RepairDescription nvarchar(100)","raw":"ALTER TABLE BikeRepairs\n   ADD DueDate datetime\n\nALTER TABLE BikeRepairs\n   ALTER COLUMN RepairDescription nvarchar(100)"},{"k":"h","v":"7.5. DROP TABLE"},{"k":"p","v":"<code>DROP TABLE</code> удаляет таблицу целиком — и данные, и саму структуру. После этой команды таблицы в базе больше нет."},{"k":"code","v":"DROP TABLE BikeRepairs_OLD","raw":"DROP TABLE BikeRepairs_OLD"},{"k":"table","head":["Команда","Что делает","Группа"],"rows":[["CREATE TABLE","Создаёт новую таблицу","DDL"],["ALTER TABLE ... ADD","Добавляет столбец","DDL"],["ALTER TABLE ... ALTER COLUMN","Меняет тип столбца","DDL"],["DROP TABLE","Удаляет таблицу вместе со структурой","DDL"],["NOT NULL","Запрещает оставлять поле пустым","Ограничение"],["Constraint","Ограничение на значения в поле","Ограничение"]]}],"exam":"CREATE добавляет объект, ALTER меняет определение объекта, DROP удаляет объект. NULL — это пустое значение, а не ноль. Столбец с NOT NULL обязателен к заполнению; если ничего не указано, поле допускает NULL. Запятая после последнего столбца в CREATE TABLE — синтаксическая ошибка. DROP TABLE убирает и данные, и структуру.","qa":[["Какое ключевое слово изменяет определение объекта базы данных?","ALTER."],["Что означает NULL?","Пустое значение в поле — отсутствие значения, а не ноль."],["Что означает NOT NULL у столбца?","Что поле обязательно к заполнению."],["К какой группе команд относится CREATE TABLE — DDL или DML?","К DDL."],["Что останется от таблицы после DROP TABLE?","Ничего: удаляются и данные, и структура."],["Как добавить столбец в существующую таблицу?","ALTER TABLE имя ADD столбец тип."]]},{"n":8,"title":"Представления (views)","plain":"Представления (views)","obj":"Domain 2 · цель экзамена 2.2 Construct and analyze queries that create, alter, and drop views","intro":"Представление — это сохранённый запрос, который ведёт себя как таблица. В редакции 2025 года в объектив добавлен пункт «purpose of views»: надо понимать не только синтаксис, но и зачем представления нужны.","body":[{"k":"h","v":"8.1. Что такое view"},{"k":"p","v":"<b>View</b> — объект SQL Server, представляющий собой сохранённый запрос для получения данных."},{"k":"lead","label":"Ключевой факт.","v":"View не хранит данные. Она хранит только текст запроса. Каждый раз, когда к представлению обращаются, запрос выполняется заново и возвращает актуальные данные из исходных таблиц."},{"k":"h","v":"8.2. Зачем нужны представления"},{"k":"b","v":["<b>Скрыть сложность.</b> Запрос с четырьмя соединениями и фильтрами прячется за одним коротким именем.","<b>Ограничить доступ.</b> Пользователю выдают право на представление, а не на таблицу. Он увидит только те столбцы и строки, которые попали в запрос представления, — например, зарплату коллег он не увидит.","<b>Переиспользовать логику.</b> Один раз написанный расчёт используют десятки отчётов, и правится он в одном месте.","<b>Дать привычные имена.</b> Технические названия столбцов заменяются понятными через алиасы."]},{"k":"h","v":"8.3. CREATE, ALTER и DROP VIEW"},{"k":"code","v":"CREATE VIEW Sales.SaleView AS\nSELECT SalesOrderID, OrderDate, ShipDate, DueDate,\n       Status, CustomerID, SalesPersonID, Subtotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2011-06-01' AND '2011-06-30'","raw":"CREATE VIEW Sales.SaleView AS\nSELECT SalesOrderID, OrderDate, ShipDate, DueDate,\n       Status, CustomerID, SalesPersonID, Subtotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2011-06-01' AND '2011-06-30'"},{"k":"p","v":"После создания к представлению обращаются как к обычной таблице:"},{"k":"code","v":"SELECT * FROM Sales.SaleView","raw":"SELECT * FROM Sales.SaleView"},{"k":"p","v":"<code>ALTER VIEW</code> меняет запрос внутри представления, <code>DROP VIEW</code> удаляет само представление. Исходные таблицы при этом не страдают — удаляется только сохранённый запрос."},{"k":"table","head":["Команда","Что делает","Что происходит с данными"],"rows":[["CREATE VIEW","Сохраняет запрос под именем","Данные не копируются"],["ALTER VIEW","Меняет запрос внутри представления","Данные не меняются"],["DROP VIEW","Удаляет представление","Таблицы остаются нетронутыми"]]}],"exam":"View — это saved query for retrieving data. Представление не хранит данные, оно хранит запрос, поэтому всегда показывает актуальное состояние таблиц. Основные цели: скрыть сложность запроса, ограничить доступ к столбцам и строкам, переиспользовать логику. DROP VIEW удаляет только представление, исходные таблицы остаются.","qa":[["Что такое view одним предложением?","Сохранённый запрос для получения данных."],["Хранит ли представление сами данные?","Нет, только текст запроса."],["Назовите две причины использовать view.","Скрыть сложность запроса и ограничить доступ к части данных."],["Что произойдёт с исходной таблицей после DROP VIEW?","Ничего: удаляется только представление."],["Как обратиться к представлению после его создания?","Так же, как к таблице: SELECT * FROM имя_представления."]]},{"n":9,"title":"Хранимые процедуры и функции","plain":"Хранимые процедуры и функции","obj":"Domain 2 · цель экзамена 2.3 Construct and analyze stored procedures and functions","intro":"Хранимая процедура — это тоже сохранённый код, но, в отличие от представления, она умеет принимать параметры и менять данные. В редакции 2025 года добавлен пункт «purpose of stored procedures».","body":[{"k":"h","v":"9.1. Что такое stored procedure"},{"k":"p","v":"<b>Stored procedure</b> — объект SQL Server, представляющий собой сохранённый запрос для получения или изменения данных. Запускается командой <b>EXEC</b>."},{"k":"p","v":"Зачем нужны процедуры:"},{"k":"b","v":["один раз написанный код используется многократно и правится в одном месте;","процедура принимает параметры, поэтому один и тот же код работает для разных значений;","права можно выдать на выполнение процедуры, не давая доступа к самим таблицам;","передача значений через параметры безопаснее, чем склеивание запроса из кусков текста."]},{"k":"h","v":"9.2. Input и output parameters"},{"k":"p","v":"<b>Parameter</b> — значение, обычно задаваемое пользователем, которое используется для получения данных при запуске хранимой процедуры."},{"k":"b","v":["<b>Input parameter</b> — значение, которое человек вводит, чтобы использовать как фильтр при запуске процедуры.","<b>Output parameter</b> — значение, которое возвращается из процедуры наружу. В объявлении помечается словом <code>output</code>."]},{"k":"code","v":"CREATE PROCEDURE GetDepartment\n  @EmployeeID   int,\n  @DepartmentID int output\nAS\nBEGIN\n  SELECT @DepartmentID = DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\nEND\n\nEXEC GetDepartment 16, 1","raw":"CREATE PROCEDURE GetDepartment\n  @EmployeeID   int,\n  @DepartmentID int output\nAS\nBEGIN\n  SELECT @DepartmentID = DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\nEND\n\nEXEC GetDepartment 16, 1"},{"k":"p","v":"Здесь <code>@EmployeeID</code> — входной параметр: по нему процедура ищет. <code>@DepartmentID</code> — выходной: в него кладётся результат."},{"k":"h","v":"9.3. RETURN"},{"k":"p","v":"<b>RETURN</b> — ключевое слово, которое формирует и удерживает значение, являющееся результатом работы хранимой процедуры."},{"k":"code","v":"CREATE PROCEDURE GetDepartmentIDTest\n  @EmployeeID int\nAS\n  SELECT DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\n  RETURN","raw":"CREATE PROCEDURE GetDepartmentIDTest\n  @EmployeeID int\nAS\n  SELECT DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\n  RETURN"},{"k":"h","v":"9.4. Процедура и функция"},{"k":"p","v":"Функция тоже хранит код, но используется иначе: её вызывают прямо внутри запроса, в списке <code>SELECT</code> или в условии <code>WHERE</code>. Процедуру так использовать нельзя — она запускается отдельно, через <code>EXEC</code>."},{"k":"table","head":["Признак","Stored procedure","Функция"],"rows":[["Как вызывается","EXEC имя параметры","Внутри SELECT или WHERE"],["Что возвращает","Набор данных, output-параметры, RETURN","Обязательно возвращает значение"],["Может менять данные","Да","Нет"],["Параметры","Входные и выходные","Только входные"]]}],"exam":"Stored procedure — a saved query for retrieving or changing data. Input parameter — значение, которое пользователь вводит как фильтр при запуске процедуры; output parameter — значение, которое процедура возвращает наружу. RETURN формирует и удерживает результат процедуры. Процедура запускается через EXEC; функция вызывается внутри запроса и обязана вернуть значение.","qa":[["Что такое хранимая процедура?","Сохранённый запрос для получения или изменения данных."],["Какой командой запускают хранимую процедуру?","EXEC."],["Что такое input parameter?","Значение, которое человек вводит как фильтр при запуске процедуры."],["Что такое output parameter?","Значение, которое возвращается из процедуры наружу."],["Каким словом помечают выходной параметр в объявлении?","Словом output."],["Чем функция отличается от процедуры по способу вызова?","Функцию вызывают внутри запроса, процедуру — отдельно через EXEC."],["Назовите одну причину использовать процедуры.","Права можно выдать на выполнение процедуры, не открывая доступ к таблицам."]]},{"n":10,"title":"Индексы","plain":"Индексы","obj":"Domain 2 · цель экзамена 2.4 Given a scenario, choose between clustered and non-clustered indexes","intro":"Индекс ускоряет поиск данных. Экзамен спрашивает главным образом одно: в чём разница между кластерным и некластерным индексом и когда какой применять.","body":[{"k":"h","v":"10.1. Что такое index"},{"k":"p","v":"<b>Index</b> — виртуальная таблица, которая упорядочивает информацию в сущности и делает получение этой информации более лёгким, чем без индекса."},{"k":"lead","label":"Как запомнить:","v":"индекс — это алфавитный указатель в конце учебника. Без него нужную страницу ищут перелистыванием всей книги, с ним — сразу по указателю."},{"k":"h","v":"10.2. Clustered index"},{"k":"p","v":"<b>Clustered index</b> — индекс, построенный на первичном ключе сущности."},{"k":"p","v":"Кластерный индекс задаёт <b>физический порядок</b> строк в таблице. Отсюда главное следствие: кластерный индекс в таблице может быть только <b>один</b>. Строки нельзя разложить в двух разных порядках одновременно."},{"k":"h","v":"10.3. Nonclustered index"},{"k":"p","v":"<b>Nonclustered index</b> — индекс, построенный на поле сущности, которое не является её первичным ключом."},{"k":"p","v":"Некластерный индекс не меняет порядок строк, а хранится отдельно и ссылается на них. Поэтому таких индексов в таблице может быть <b>много</b> — по одному на каждое поле, по которому часто ищут."},{"k":"h","v":"10.4. Синтаксис"},{"k":"code","v":"CREATE INDEX ndx_CustomerID ON BikeRepairs (CustomerID)","raw":"CREATE INDEX ndx_CustomerID ON BikeRepairs (CustomerID)"},{"k":"h","v":"10.5. Когда индекс не нужен"},{"k":"p","v":"Индекс ускоряет выборку, но замедляет добавление, изменение и удаление данных: при каждой такой операции индекс приходится перестраивать. Ещё он занимает место на диске. Поэтому индексы не ставят на маленькие таблицы и на поля, по которым почти не ищут."},{"k":"table","head":["Признак","Clustered index","Nonclustered index"],"rows":[["На каком поле","На первичном ключе","На любом другом поле"],["Сколько в таблице","Только один","Может быть много"],["Порядок строк","Задаёт физический порядок","Не меняет порядок строк"],["Где хранится","Вместе с данными","Отдельно, со ссылками на строки"]]}],"exam":"Index — a virtual table used to sort information in an entity and make it easier to retrieve. Clustered index строится на первичном ключе и задаёт физический порядок строк, поэтому он в таблице ровно один. Nonclustered index строится на поле, не являющемся первичным ключом, и таких индексов может быть несколько. Индексы ускоряют SELECT, но замедляют INSERT, UPDATE и DELETE.","qa":[["Что такое index?","Виртуальная таблица, упорядочивающая данные и ускоряющая их получение."],["На каком поле строится кластерный индекс?","На первичном ключе."],["Сколько кластерных индексов может быть в одной таблице?","Только один."],["Почему только один?","Он задаёт физический порядок строк, а разложить строки в двух порядках сразу нельзя."],["На каком поле строится некластерный индекс?","На поле, которое не является первичным ключом."],["Какие операции индекс замедляет?","INSERT, UPDATE и DELETE."]]},{"n":11,"title":"Соединение таблиц: JOIN","plain":"Соединение таблиц: JOIN","obj":"Domain 3 · цель экзамена 3.1 Construct and analyze queries that select data (часть 1)","intro":"Домен 3 — самый большой на экзамене, а соединения — его основа. Здесь надо не просто выучить слова, а понимать, какие строки попадут в результат при каждом типе соединения.","body":[{"k":"h","v":"11.1. SELECT и Query"},{"k":"p","v":"<b>Query</b> — предложение, используемое для получения нужных данных из базы. <b>SELECT</b> — ключевое слово SQL, используемое для получения данных из базы. Простейший запрос выглядит так:"},{"k":"code","v":"SELECT CustomerID, AccountNumber\nFROM Sales.Customer","raw":"SELECT CustomerID, AccountNumber\nFROM Sales.Customer"},{"k":"h","v":"11.2. Join"},{"k":"p","v":"<b>Join</b> — объединение двух сущностей в одном запросе, при котором данные связываются по общему для обеих сущностей полю."},{"k":"p","v":"Четыре типа соединений, которые надо различать:"},{"k":"b","v":["<b>Inner join</b> — соединение, показывающее связанные записи из обеих таблиц. Строки без пары не попадают в результат.","<b>Left outer join</b> — соединение, показывающее все записи из первой таблицы, указанной в соединении, и связанные записи из второй.","<b>Right outer join</b> — соединение, показывающее все записи из второй таблицы, указанной в соединении.","<b>Full outer join</b> — соединение, показывающее все записи из обеих таблиц."]},{"k":"p","v":"<b>Outer join</b> — общее название для соединения, которое показывает все записи с одной стороны и связанные записи с другой. Там, где пары нет, в столбцах второй таблицы будет <code>NULL</code>."},{"k":"code","v":"SELECT c.CustomerID, c.AccountNumber, soh.OrderDate, soh.Status\nFROM Sales.Customer AS c\nLEFT JOIN Sales.SalesOrderHeader AS soh\n       ON c.CustomerID = soh.CustomerID","raw":"SELECT c.CustomerID, c.AccountNumber, soh.OrderDate, soh.Status\nFROM Sales.Customer AS c\nLEFT JOIN Sales.SalesOrderHeader AS soh\n       ON c.CustomerID = soh.CustomerID"},{"k":"h","v":"11.3. Cross join и Cartesian product"},{"k":"p","v":"<b>Cartesian product</b> — соединение двух несвязанных таблиц в запросе. Каждая строка первой таблицы соединяется с каждой строкой второй, поэтому число строк в результате равно произведению числа строк в таблицах."},{"k":"p","v":"Такой результат получается двумя способами: намеренно — командой <code>CROSS JOIN</code>, и случайно — если перечислить таблицы через запятую и забыть условие связи. В редакции 2025 года <code>CROSS JOIN</code> прямо назван в объективе."},{"k":"code","v":"-- случайный декартов продукт: нет условия связи\nSELECT * FROM Sales.Customer, Sales.SalesOrderHeader\n\n-- намеренный\nSELECT * FROM Sizes CROSS JOIN Colors","raw":"-- случайный декартов продукт: нет условия связи\nSELECT * FROM Sales.Customer, Sales.SalesOrderHeader\n\n-- намеренный\nSELECT * FROM Sizes CROSS JOIN Colors"},{"k":"h","v":"11.4. Self join"},{"k":"p","v":"<b>Self join</b> — соединение, связывающее два поля одной и той же сущности друг с другом. Классический случай — сотрудник и его руководитель: оба лежат в одной таблице."},{"k":"p","v":"Без псевдонимов такой запрос написать нельзя: базе надо объяснить, где «сотрудник», а где «начальник»."},{"k":"code","v":"SELECT e.EmployeeID,\n       e.LastName AS 'Employee',\n       m.LastName AS 'Manager'\nFROM dbo.Employees AS e\nJOIN dbo.Employees AS m ON e.ManagerID = m.EmployeeID","raw":"SELECT e.EmployeeID,\n       e.LastName AS 'Employee',\n       m.LastName AS 'Manager'\nFROM dbo.Employees AS e\nJOIN dbo.Employees AS m ON e.ManagerID = m.EmployeeID"},{"k":"table","head":["Тип соединения","Какие строки попадут в результат"],"rows":[["INNER JOIN","Только те, у которых есть пара в обеих таблицах"],["LEFT JOIN","Все из первой таблицы + совпавшие из второй"],["RIGHT JOIN","Все из второй таблицы + совпавшие из первой"],["FULL OUTER JOIN","Все строки из обеих таблиц"],["CROSS JOIN","Каждая строка с каждой: декартов продукт"],["SELF JOIN","Таблица соединяется сама с собой по своим же полям"]]}],"exam":"Inner join — только связанные записи из обеих таблиц. Left outer join — все записи первой таблицы; right outer join — все записи второй; full outer join — все записи обеих. Cartesian product — соединение двух несвязанных таблиц, число строк перемножается; получается через CROSS JOIN или при забытом условии связи. Self join связывает два поля одной и той же сущности и требует псевдонимов.","qa":[["Какое соединение показывает только связанные записи из обеих таблиц?","Inner join."],["Какое соединение показывает все записи из первой таблицы?","Left outer join."],["Какое соединение показывает все записи из обеих таблиц?","Full outer join."],["Что окажется в столбцах второй таблицы, если пары нет?","NULL."],["Что такое Cartesian product?","Соединение двух несвязанных таблиц: каждая строка с каждой."],["Как декартов продукт получается случайно?","Если перечислить таблицы через запятую и не задать условие связи."],["Что такое self join?","Соединение, связывающее два поля одной и той же сущности."],["Что обязательно нужно для self join?","Псевдонимы таблицы, иначе нельзя различить две её роли."]]},{"n":12,"title":"UNION, INTERSECT, DISTINCT, алиасы и вычисляемые столбцы","plain":"UNION, INTERSECT, DISTINCT, алиасы и вычисляемые столбцы","obj":"Domain 3 · цель экзамена 3.1 Construct and analyze queries that select data (часть 2)","intro":"Соединение добавляет к результату столбцы. Здесь разберём инструменты, которые добавляют строки, убирают дубликаты и создают новые столбцы прямо в запросе.","body":[{"k":"h","v":"12.1. UNION и INTERSECT"},{"k":"p","v":"<b>UNION</b> — ключевое слово, возвращающее две или более сущности как единый набор данных в запросе. <b>INTERSECT</b> — ключевое слово, возвращающее совпадающие записи между двумя сущностями."},{"k":"lead","label":"Главное различие.","v":"<code>JOIN</code> добавляет столбцы — результат становится шире. <code>UNION</code> добавляет строки — результат становится длиннее."},{"k":"p","v":"Три правила <code>UNION</code>: одинаковое число столбцов в обоих запросах, совместимые типы данных, порядок столбцов важен. <code>UNION</code> убирает повторы, <code>UNION ALL</code> оставляет всё как есть."},{"k":"code","v":"SELECT BusinessEntityID FROM Sales.SalesPerson\nUNION\nSELECT BusinessEntityID FROM HumanResources.Employee","raw":"SELECT BusinessEntityID FROM Sales.SalesPerson\nUNION\nSELECT BusinessEntityID FROM HumanResources.Employee"},{"k":"h","v":"12.2. DISTINCT"},{"k":"p","v":"<b>DISTINCT</b> — ключевое слово, возвращающее записи без повторяющихся значений среди полей, указанных в запросе."},{"k":"p","v":"Важно: <code>DISTINCT</code> действует на всю выбранную строку целиком, а не на один столбец."},{"k":"code","v":"SELECT DISTINCT ProductID\nFROM Production.ProductCostHistory","raw":"SELECT DISTINCT ProductID\nFROM Production.ProductCostHistory"},{"k":"h","v":"12.3. Column alias"},{"k":"p","v":"<b>Alias</b> — заменяющее имя для столбца или таблицы. Задаётся ключевым словом <code>AS</code>. Алиас нужен, чтобы дать столбцу понятное название в отчёте и чтобы обращаться к длинному имени таблицы коротко."},{"k":"h","v":"12.4. Вычисляемые столбцы"},{"k":"p","v":"Вычисляемый столбец — это выражение прямо в списке <code>SELECT</code>. В нём можно складывать, вычитать, умножать и делить значения других столбцов."},{"k":"code","v":"SELECT ProductID,\n       Name,\n       ListPrice - StandardCost AS 'Profit'\nFROM Production.Product","raw":"SELECT ProductID,\n       Name,\n       ListPrice - StandardCost AS 'Profit'\nFROM Production.Product"},{"k":"h","v":"12.5. Конкатенация: оператор + и CONCAT()"},{"k":"p","v":"Конкатенация — склеивание текстовых значений в одно. Этот пункт добавлен в объективы в редакции 2025 года, и способов два."},{"k":"b","v":["Оператор <code>+</code>: <code>SELECT FirstName + ' ' + LastName</code>. Если хоть одно значение равно <code>NULL</code>, весь результат станет <code>NULL</code>.","Функция <code>CONCAT()</code>: <code>SELECT CONCAT(FirstName, ' ', LastName)</code>. Она обрабатывает <code>NULL</code> как пустую строку, поэтому результат не пропадает."]},{"k":"lead","label":"Как запомнить:","v":"<code>+</code> ломается на NULL, <code>CONCAT()</code> — нет."},{"k":"h","v":"12.6. NULLIF()"},{"k":"p","v":"<code>NULLIF(a, b)</code> сравнивает два значения. Если они равны — возвращает <code>NULL</code>, если различаются — возвращает первое. Основное применение — защита от деления на ноль: <code>NULLIF(ListPrice, 0)</code> превращает ноль в <code>NULL</code>, и деление возвращает <code>NULL</code> вместо ошибки."},{"k":"code","v":"SELECT Name,\n       (ListPrice - StandardCost) / NULLIF(ListPrice, 0) AS 'Margin'\nFROM Production.Product","raw":"SELECT Name,\n       (ListPrice - StandardCost) / NULLIF(ListPrice, 0) AS 'Margin'\nFROM Production.Product"},{"k":"table","head":["Инструмент","Что делает","Как запомнить"],"rows":[["UNION","Складывает наборы, убирая повторы","Строки вниз"],["UNION ALL","Складывает наборы со всеми повторами","Быстрее, но с дублями"],["INTERSECT","Только совпадающие записи","Пересечение"],["DISTINCT","Убирает повторяющиеся строки","Каждая строка по разу"],["Alias (AS)","Заменяющее имя столбца или таблицы","Понятная подпись"],["Оператор +","Склеивает текст, ломается на NULL","Строгий"],["CONCAT()","Склеивает текст, NULL как пустая строка","Спокойный"],["NULLIF(a,b)","NULL, если значения равны","Защита от деления на ноль"]]}],"exam":"UNION возвращает две и более сущности как единый набор данных и убирает дубликаты; UNION ALL их оставляет. Оба запроса должны иметь одинаковое число столбцов с совместимыми типами. INTERSECT возвращает только совпадающие записи. DISTINCT убирает повторы среди указанных полей. Alias — заменяющее имя для столбца или таблицы. Конкатенация оператором + даёт NULL, если хоть одно значение NULL; CONCAT() этого не делает. NULLIF(a, b) возвращает NULL при равенстве значений.","qa":[["Чем UNION отличается от JOIN?","JOIN добавляет столбцы, UNION добавляет строки."],["Назовите два правила UNION.","Одинаковое число столбцов и совместимые типы данных в обоих запросах."],["Чем UNION отличается от UNION ALL?","UNION убирает дубликаты, UNION ALL оставляет их."],["Что возвращает INTERSECT?","Только записи, совпадающие в обоих наборах."],["Что такое alias?","Заменяющее имя для столбца или таблицы."],["Что вернёт FirstName + ' ' + LastName, если LastName равен NULL?","NULL — весь результат станет пустым."],["Какая функция склеит те же значения без потери результата?","CONCAT()."],["Что возвращает NULLIF(10, 10)?","NULL, потому что значения равны."]]},{"n":13,"title":"Сортировка и фильтрация: ORDER BY, WHERE, LIKE, BETWEEN","plain":"Сортировка и фильтрация: ORDER BY, WHERE, LIKE, BETWEEN","obj":"Domain 3 · цель экзамена 3.2 Construct and analyze queries that sort and filter data (часть 1)","intro":"Получить все строки таблицы умеет любой. Экзамен проверяет умение отобрать нужные и расположить их в нужном порядке.","body":[{"k":"h","v":"13.1. ORDER BY"},{"k":"p","v":"<b>ORDER BY</b> — набор ключевых слов, используемый для сортировки данных внутри набора. По умолчанию сортировка идёт по возрастанию — <code>ASC</code>. Для убывания пишут <code>DESC</code>."},{"k":"p","v":"Сортировать можно по нескольким столбцам сразу: сначала по первому, а внутри одинаковых значений — по второму. <code>ORDER BY</code> всегда стоит в конце запроса."},{"k":"code","v":"SELECT FirstName, LastName, City\nFROM Person.Person\nORDER BY City ASC, LastName DESC","raw":"SELECT FirstName, LastName, City\nFROM Person.Person\nORDER BY City ASC, LastName DESC"},{"k":"h","v":"13.2. WHERE и операторы сравнения"},{"k":"p","v":"<b>WHERE</b> — ключевое слово SQL, используемое для отбора записей из набора при выполнении запроса."},{"k":"p","v":"<b>Comparison operator</b> — символ, задающий фильтр внутри запроса, например знак «больше или равно» (<code>&gt;=</code>)."},{"k":"table","head":["Оператор","Что означает","Пример"],"rows":[["=","Равно","WHERE City = 'Seattle'"],["&lt;&gt; или !=","Не равно","WHERE City &lt;&gt; 'Seattle'"],["&gt;","Больше","WHERE ListPrice &gt; 100"],["&lt;","Меньше","WHERE ListPrice &lt; 100"],["&gt;=","Больше или равно","WHERE OrderQty &gt;= 10"],["&lt;=","Меньше или равно","WHERE OrderQty &lt;= 10"]]},{"k":"p","v":"Текстовые значения в условии пишут в одинарных кавычках, числа — без кавычек."},{"k":"h","v":"13.3. LIKE и подстановочные знаки"},{"k":"p","v":"<b>LIKE</b> — ключевое слово SQL, которое позволяет использовать подстановочные знаки, чтобы возвращать приблизительные совпадения с условием в запросе."},{"k":"b","v":["<code>%</code> — любое количество любых символов, в том числе ни одного;","<code>_</code> — ровно один любой символ."]},{"k":"table","head":["Шаблон","Что находит","Пример совпадения"],"rows":[["LIKE 'A%'","Начинается на A","Adams, Allen"],["LIKE '%son'","Заканчивается на son","Anderson, Jackson"],["LIKE '%an%'","Содержит an где угодно","Alexander, Brand"],["LIKE '_a%'","Вторая буква — a","Barnes, Nash"],["LIKE 'S____'","Ровно пять букв, первая S","Smith, Stone"]]},{"k":"h","v":"13.4. BETWEEN"},{"k":"p","v":"<b>BETWEEN</b> — ключевое слово SQL, задающее диапазон значений для фильтра внутри запроса."},{"k":"lead","label":"Важно.","v":"Обе границы диапазона <b>включаются</b>. <code>BETWEEN 10 AND 20</code> — это то же самое, что <code>&gt;= 10 AND &lt;= 20</code>."},{"k":"code","v":"SELECT SalesOrderID, OrderDate, SubTotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2014-06-01' AND '2014-06-30'","raw":"SELECT SalesOrderID, OrderDate, SubTotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2014-06-01' AND '2014-06-30'"},{"k":"h","v":"13.5. AND, OR, NOT и приоритет"},{"k":"b","v":["<code>AND</code> — должны выполниться оба условия;","<code>OR</code> — достаточно, чтобы выполнилось хотя бы одно;","<code>NOT</code> — переворачивает условие на противоположное."]},{"k":"p","v":"У этих операторов есть <b>приоритет</b>: сначала выполняется <code>NOT</code>, затем <code>AND</code>, и только потом <code>OR</code>. Поэтому два запроса ниже дают разные результаты:"},{"k":"code","v":"WHERE City = 'Los Angeles' OR City = 'Seattle' AND LastName = 'Adams'\nWHERE (City = 'Los Angeles' OR City = 'Seattle') AND LastName = 'Adams'","raw":"WHERE City = 'Los Angeles' OR City = 'Seattle' AND LastName = 'Adams'\nWHERE (City = 'Los Angeles' OR City = 'Seattle') AND LastName = 'Adams'"},{"k":"p","v":"Первый вернёт всех из Лос-Анджелеса плюс Адамсов из Сиэтла. Второй — только Адамсов, но из обоих городов. Если сомневаетесь — ставьте скобки."}],"exam":"ORDER BY сортирует данные, по умолчанию по возрастанию; DESC — по убыванию. WHERE отбирает записи. LIKE работает с подстановочными знаками: % — любое количество символов, _ — ровно один. BETWEEN задаёт диапазон, и обе границы в него входят. Приоритет логических операторов: сначала NOT, затем AND, затем OR.","qa":[["Какое ключевое слово сортирует данные?","ORDER BY."],["Как отсортировать по убыванию?","Добавить DESC после имени столбца."],["Какое ключевое слово отбирает записи по условию?","WHERE."],["Что означает знак % в LIKE?","Любое количество любых символов."],["Что означает знак _ в LIKE?","Ровно один любой символ."],["Что найдёт шаблон LIKE '_a%'?","Значения, у которых вторая буква — a."],["Входят ли границы в BETWEEN?","Да, обе границы включаются."],["Какой оператор выполняется раньше — AND или OR?","AND. Порядок: NOT, затем AND, затем OR."]]},{"n":14,"title":"TOP, IN, ANY, ALL и работа с NULL","plain":"TOP, IN, ANY, ALL и работа с NULL","obj":"Domain 3 · цель экзамена 3.2 Construct and analyze queries that sort and filter data (часть 2)","intro":"Вторая половина фильтрации: как ограничить число строк, как проверить попадание в список и как правильно искать пустые значения. Последнее — самое частое место ошибок.","body":[{"k":"h","v":"14.1. TOP"},{"k":"p","v":"<b>TOP</b> — ключевое слово SQL, ограничивающее количество записей, возвращаемых запросом. Почти всегда используется вместе с <code>ORDER BY</code>: без сортировки непонятно, какие именно строки окажутся «верхними»."},{"k":"code","v":"SELECT TOP 10 FirstName, LastName, City\nFROM Person.Person\nORDER BY LastName","raw":"SELECT TOP 10 FirstName, LastName, City\nFROM Person.Person\nORDER BY LastName"},{"k":"lead","label":"Диалекты.","v":"В объективе экзамена написано «TOP (LIMIT)». В SQL Server пишут <code>TOP 10</code> в начале запроса, в MySQL и PostgreSQL — <code>LIMIT 10</code> в конце. Узнавать надо обе формы."},{"k":"h","v":"14.2. IN и NOT IN"},{"k":"p","v":"<b>IN</b> — ключевое слово SQL, задающее несколько значений, используемых как критерий фильтрации внутри запроса. Это короткая запись длинной цепочки <code>OR</code>."},{"k":"code","v":"-- длинно\nWHERE City = 'Seattle' OR City = 'Portland' OR City = 'Denver'\n\n-- то же самое коротко\nWHERE City IN ('Seattle', 'Portland', 'Denver')","raw":"-- длинно\nWHERE City = 'Seattle' OR City = 'Portland' OR City = 'Denver'\n\n-- то же самое коротко\nWHERE City IN ('Seattle', 'Portland', 'Denver')"},{"k":"p","v":"<code>NOT IN</code> — обратное условие: значение не входит ни в один из перечисленных вариантов."},{"k":"h","v":"14.3. Подзапрос"},{"k":"p","v":"Список значений для <code>IN</code> можно не перечислять руками, а получить другим запросом. Запрос внутри запроса называется подзапросом. Сначала выполняется внутренний, его результат подставляется во внешний."},{"k":"code","v":"SELECT ProductID, Name\nFROM Production.Product\nWHERE ProductID IN\n      (SELECT ProductID FROM Sales.SalesOrderDetail WHERE OrderQty &gt;= 10)","raw":"SELECT ProductID, Name\nFROM Production.Product\nWHERE ProductID IN\n      (SELECT ProductID FROM Sales.SalesOrderDetail WHERE OrderQty >= 10)"},{"k":"h","v":"14.4. ANY и ALL"},{"k":"p","v":"<b>ANY</b> — ключевое слово SQL, используемое для поиска совпадающих записей между запросом и подзапросом. <b>ALL</b> — ключевое слово SQL, отображающее записи запроса, если все записи этого запроса совпадают со связанными записями в подзапросе."},{"k":"b","v":["<code>&gt; ANY (подзапрос)</code> — больше, чем <b>хотя бы одно</b> из значений подзапроса;","<code>&gt; ALL (подзапрос)</code> — больше, чем <b>каждое</b> значение подзапроса;","<code>= ANY</code> работает так же, как <code>IN</code>."]},{"k":"p","v":"Оба ключевых слова используются только вместе с оператором сравнения и подзапросом — сами по себе они не применяются."},{"k":"h","v":"14.5. NULL и NOT NULL"},{"k":"p","v":"<b>NULL</b> — ключевое слово SQL, обозначающее пустое значение в поле. Из этого следует главное правило, которое надо запомнить дословно:"},{"k":"lead","label":"Правило.","v":"Значение <code>NULL</code> нельзя сравнивать через <code>=</code>. Условие <code>WHERE MiddleName = NULL</code> не вернёт ничего и не выдаст ошибки — оно просто всегда ложно. Проверять пустоту нужно через <code>IS NULL</code>, а непустоту — через <code>IS NOT NULL</code>."},{"k":"code","v":"-- не работает, вернёт 0 строк\nSELECT * FROM Person.Person WHERE MiddleName = NULL\n\n-- правильно\nSELECT * FROM Person.Person WHERE MiddleName IS NULL\nSELECT * FROM Person.Person WHERE MiddleName IS NOT NULL","raw":"-- не работает, вернёт 0 строк\nSELECT * FROM Person.Person WHERE MiddleName = NULL\n\n-- правильно\nSELECT * FROM Person.Person WHERE MiddleName IS NULL\nSELECT * FROM Person.Person WHERE MiddleName IS NOT NULL"},{"k":"table","head":["Ключевое слово","Что делает","Как запомнить"],"rows":[["TOP n","Ограничивает число строк","Первые n, обычно с ORDER BY"],["LIMIT n","То же в MySQL и PostgreSQL","Другой диалект"],["IN","Значение входит в список","Короткая замена цепочке OR"],["NOT IN","Значение не входит в список","Обратное к IN"],["ANY","Совпадение хотя бы с одним значением","Достаточно одного"],["ALL","Совпадение со всеми значениями","Нужны все"],["IS NULL","Поле пустое","Единственный способ проверить пустоту"],["IS NOT NULL","Поле заполнено","Обратное к IS NULL"]]}],"exam":"TOP ограничивает количество записей, возвращаемых запросом; в других диалектах то же делает LIMIT. IN задаёт несколько значений для фильтрации и заменяет длинную цепочку OR. ANY ищет совпадение хотя бы с одним значением подзапроса, ALL требует совпадения со всеми. NULL — пустое значение; сравнивать его через знак равенства нельзя, используются только IS NULL и IS NOT NULL.","qa":[["Какое ключевое слово ограничивает количество возвращаемых записей?","TOP, в других диалектах LIMIT."],["С каким ключевым словом почти всегда идёт TOP?","С ORDER BY."],["Чем удобно IN?","Заменяет длинную цепочку условий OR одним коротким списком."],["Что выполняется раньше — внешний запрос или подзапрос?","Подзапрос: его результат подставляется во внешний запрос."],["В чём разница между ANY и ALL?","ANY — совпадение хотя бы с одним значением, ALL — со всеми."],["Почему WHERE MiddleName = NULL не работает?","NULL — это отсутствие значения, его нельзя сравнить знаком равенства."],["Как правильно найти строки с пустым полем?","WHERE поле IS NULL."],["Как найти строки с заполненным полем?","WHERE поле IS NOT NULL."]]},{"n":15,"title":"Агрегация данных","plain":"Агрегация данных","obj":"Domain 3 · цель экзамена 3.3 Construct and analyze queries that aggregate data","intro":"Агрегация превращает множество строк в итоговые числа: сумму, среднее, количество, минимум и максимум. Здесь же появляется важнейшая идея всего домена 3 — порядок обработки запроса.","body":[{"k":"h","v":"15.1. Агрегатные функции"},{"k":"b","v":["<b>SUM</b> — суммирует значения одного или нескольких полей внутри запроса.","<b>COUNT</b> — показывает количество записей в запросе.","<b>AVG</b> — вычисляет средние значения для одного или нескольких полей.","<b>MIN</b> — получает наименьшее значение в диапазоне значений.","<b>MAX</b> — получает наибольшее значение в диапазоне значений."]},{"k":"h","v":"15.2. GROUP BY"},{"k":"p","v":"<b>GROUP BY</b> — набор ключевых слов, задающий поля, по которым нужно выполнять агрегацию, когда в запросе используются агрегатные функции."},{"k":"lead","label":"Железное правило.","v":"Каждый столбец из <code>SELECT</code>, не обёрнутый в агрегатную функцию, обязан присутствовать в <code>GROUP BY</code>. Это самая частая ошибка и самый частый вопрос по этому объективу."},{"k":"code","v":"SELECT SalesPersonID, LastName, FirstName,\n       SUM(SubTotal) AS 'Total Sales'\nFROM Sales.SalesOrderHeader soh\nJOIN Sales.SalesPerson  sp ON soh.SalesPersonID = sp.BusinessEntityID\nJOIN Person.Person       p ON sp.BusinessEntityID = p.BusinessEntityID\nGROUP BY SalesPersonID, LastName, FirstName","raw":"SELECT SalesPersonID, LastName, FirstName,\n       SUM(SubTotal) AS 'Total Sales'\nFROM Sales.SalesOrderHeader soh\nJOIN Sales.SalesPerson  sp ON soh.SalesPersonID = sp.BusinessEntityID\nJOIN Person.Person       p ON sp.BusinessEntityID = p.BusinessEntityID\nGROUP BY SalesPersonID, LastName, FirstName"},{"k":"h","v":"15.3. HAVING"},{"k":"p","v":"<code>HAVING</code> фильтрует результат <b>после</b> агрегации. Именно поэтому агрегатную функцию нельзя писать в <code>WHERE</code>: на момент выполнения <code>WHERE</code> итог ещё не посчитан."},{"k":"code","v":"GROUP BY SalesPersonID, LastName, FirstName\nHAVING SUM(SubTotal) &gt; 1000000\nORDER BY SUM(SubTotal) DESC","raw":"GROUP BY SalesPersonID, LastName, FirstName\nHAVING SUM(SubTotal) > 1000000\nORDER BY SUM(SubTotal) DESC"},{"k":"h","v":"15.4. WHERE или HAVING"},{"k":"table","head":["Признак","WHERE","HAVING"],"rows":[["Когда работает","До группировки","После группировки"],["Что фильтрует","Отдельные строки","Готовые группы"],["Можно ли агрегат","Нет","Да"],["Пример","WHERE OrderDate &gt; 2014","HAVING SUM(SubTotal) &gt; 1000000"]]},{"k":"h","v":"15.5. Порядок обработки запроса"},{"k":"p","v":"Запрос выполняется не в том порядке, в каком он написан. Реальный порядок такой:"},{"k":"code","v":"FROM  →  WHERE  →  GROUP BY  →  HAVING  →  SELECT  →  ORDER BY  →  TOP","raw":"FROM  →  WHERE  →  GROUP BY  →  HAVING  →  SELECT  →  ORDER BY  →  TOP"},{"k":"p","v":"Из этого порядка сразу следуют три вещи, которые иначе пришлось бы просто заучивать:"},{"k":"b","v":["<code>HAVING</code> умеет работать с агрегатами, а <code>WHERE</code> — нет, потому что <code>WHERE</code> выполняется до группировки;","алиас, заданный в <code>SELECT</code>, не виден в <code>WHERE</code>, но виден в <code>ORDER BY</code> — потому что <code>ORDER BY</code> выполняется после <code>SELECT</code>;","<code>TOP</code> без <code>ORDER BY</code> даёт непредсказуемый результат: он применяется последним, к уже готовому набору."]}],"exam":"SUM суммирует значения, COUNT показывает количество записей, AVG считает среднее, MIN и MAX дают наименьшее и наибольшее значения. GROUP BY задаёт поля, по которым идёт агрегация; каждый неагрегированный столбец из SELECT должен быть в GROUP BY. WHERE фильтрует строки до группировки, HAVING фильтрует группы после неё, поэтому агрегатная функция допустима только в HAVING. Порядок обработки: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, TOP.","qa":[["Какая функция суммирует значения поля?","SUM."],["Какая функция показывает количество записей?","COUNT."],["Какая функция вычисляет среднее?","AVG."],["Что задаёт GROUP BY?","Поля, по которым выполняется агрегация."],["Какие столбцы обязаны быть в GROUP BY?","Все столбцы из SELECT, не обёрнутые в агрегатную функцию."],["Чем HAVING отличается от WHERE?","WHERE фильтру
