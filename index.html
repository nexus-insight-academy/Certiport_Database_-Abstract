',\n       m.LastName AS 'Manager'\nFROM dbo.Employees AS e\nJOIN dbo.Employees AS m ON e.ManagerID = m.EmployeeID","raw":"SELECT e.EmployeeID,\n       e.LastName AS 'Employee',\n       m.LastName AS 'Manager'\nFROM dbo.Employees AS e\nJOIN dbo.Employees AS m ON e.ManagerID = m.EmployeeID"},{"k":"table","head":["Tipul îmbinării","Ce rânduri ajung în rezultat"],"rows":[["INNER JOIN","Doar acelea care au pereche în ambele tabele"],["LEFT JOIN","Toate din primul tabel + cele potrivite din al doilea"],["RIGHT JOIN","Toate din al doilea tabel + cele potrivite din primul"],["FULL OUTER JOIN","Toate rândurile din ambele tabele"],["CROSS JOIN","Fiecare rând cu fiecare: produs cartezian"],["SELF JOIN","Tabelul se îmbină cu el însuși după propriile câmpuri"]]}],"exam":"Inner join — doar înregistrările legate din ambele tabele. Left outer join — toate înregistrările primului tabel; right outer join — toate înregistrările celui de-al doilea; full outer join — toate înregistrările din ambele. Cartesian product — îmbinarea a două tabele nelegate, numărul de rânduri se înmulțește; se obține prin CROSS JOIN sau când se uită condiția de legătură. Self join leagă două câmpuri ale aceleiași entități și cere alias-uri.","qa":[["Ce îmbinare arată doar înregistrările legate din ambele tabele?","Inner join."],["Ce îmbinare arată toate înregistrările din primul tabel?","Left outer join."],["Ce îmbinare arată toate înregistrările din ambele tabele?","Full outer join."],["Ce va fi în coloanele celui de-al doilea tabel dacă perechea lipsește?","NULL."],["Ce este Cartesian product?","Îmbinarea a două tabele nelegate: fiecare rând cu fiecare."],["Cum apare produsul cartezian din întâmplare?","Dacă enumerați tabelele prin virgulă și nu puneți condiția de legătură."],["Ce este self join?","Îmbinarea care leagă două câmpuri ale aceleiași entități."],["Ce este obligatoriu necesar pentru self join?","Alias-urile tabelului, altfel nu se pot deosebi cele două roluri ale lui."]]},{"n":12,"title":"UNION, INTERSECT, DISTINCT, alias-uri și coloane calculate","plain":"UNION, INTERSECT, DISTINCT, alias-uri și coloane calculate","obj":"Domain 3 · obiectivul de examen 3.1 Construct and analyze queries that select data (partea 2)","intro":"Îmbinarea adaugă coloane la rezultat. Aici vom vedea instrumentele care adaugă rânduri, scot duplicatele și creează coloane noi chiar în interogare.","body":[{"k":"h","v":"12.1. UNION și INTERSECT"},{"k":"p","v":"<b>UNION</b> — cuvântul-cheie care întoarce două sau mai multe entități ca un singur set de date într-o interogare. <b>INTERSECT</b> — cuvântul-cheie care întoarce înregistrările care coincid între două entități."},{"k":"lead","label":"Deosebirea principală.","v":"<code>JOIN</code> adaugă coloane — rezultatul devine mai lat. <code>UNION</code> adaugă rânduri — rezultatul devine mai lung."},{"k":"p","v":"Trei reguli pentru <code>UNION</code>: același număr de coloane în ambele interogări, tipuri de date compatibile, ordinea coloanelor contează. <code>UNION</code> scoate duplicatele, <code>UNION ALL</code> lasă totul așa cum este."},{"k":"code","v":"SELECT BusinessEntityID FROM Sales.SalesPerson\nUNION\nSELECT BusinessEntityID FROM HumanResources.Employee","raw":"SELECT BusinessEntityID FROM Sales.SalesPerson\nUNION\nSELECT BusinessEntityID FROM HumanResources.Employee"},{"k":"h","v":"12.2. DISTINCT"},{"k":"p","v":"<b>DISTINCT</b> — cuvântul-cheie care întoarce înregistrările fără valori care se repetă printre câmpurile indicate în interogare."},{"k":"p","v":"Important: <code>DISTINCT</code> acționează asupra rândului selectat în întregime, nu asupra unei singure coloane."},{"k":"code","v":"SELECT DISTINCT ProductID\nFROM Production.ProductCostHistory","raw":"SELECT DISTINCT ProductID\nFROM Production.ProductCostHistory"},{"k":"h","v":"12.3. Column alias"},{"k":"p","v":"<b>Alias</b> — nume înlocuitor pentru o coloană sau un tabel. Se dă prin cuvântul-cheie <code>AS</code>. Alias-ul este necesar ca să dea coloanei o denumire clară în raport și ca să vă adresați scurt unui nume lung de tabel."},{"k":"h","v":"12.4. Coloane calculate"},{"k":"p","v":"Coloana calculată este o expresie pusă chiar în lista <code>SELECT</code>. În ea se pot aduna, scădea, înmulți și împărți valorile altor coloane."},{"k":"code","v":"SELECT ProductID,\n       Name,\n       ListPrice - StandardCost AS 'Profit'\nFROM Production.Product","raw":"SELECT ProductID,\n       Name,\n       ListPrice - StandardCost AS 'Profit'\nFROM Production.Product"},{"k":"h","v":"12.5. Concatenarea: operatorul + și CONCAT()"},{"k":"p","v":"Concatenarea este lipirea valorilor de text într-una singură. Acest punct a fost adăugat în obiective în redacția din 2025, iar modurile sunt două."},{"k":"b","v":["Operatorul <code>+</code>: <code>SELECT FirstName + ' ' + LastName</code>. Dacă măcar o valoare este <code>NULL</code>, tot rezultatul devine <code>NULL</code>.","Funcția <code>CONCAT()</code>: <code>SELECT CONCAT(FirstName, ' ', LastName)</code>. Ea tratează <code>NULL</code> ca pe un șir gol, de aceea rezultatul nu se pierde."]},{"k":"lead","label":"Cum țineți minte:","v":"<code>+</code> se strică la NULL, <code>CONCAT()</code> — nu."},{"k":"h","v":"12.6. NULLIF()"},{"k":"p","v":"<code>NULLIF(a, b)</code> compară două valori. Dacă ele sunt egale — întoarce <code>NULL</code>, dacă diferă — întoarce prima. Întrebuințarea principală este protecția împotriva împărțirii la zero: <code>NULLIF(ListPrice, 0)</code> transformă zero în <code>NULL</code>, iar împărțirea întoarce <code>NULL</code> în loc de eroare."},{"k":"code","v":"SELECT Name,\n       (ListPrice - StandardCost) / NULLIF(ListPrice, 0) AS 'Margin'\nFROM Production.Product","raw":"SELECT Name,\n       (ListPrice - StandardCost) / NULLIF(ListPrice, 0) AS 'Margin'\nFROM Production.Product"},{"k":"table","head":["Instrumentul","Ce face","Cum țineți minte"],"rows":[["UNION","Adună seturile, scoțând duplicatele","Rânduri în jos"],["UNION ALL","Adună seturile cu toate duplicatele","Mai rapid, dar cu duplicate"],["INTERSECT","Doar înregistrările care coincid","Intersecția"],["DISTINCT","Scoate rândurile care se repetă","Fiecare rând o singură dată"],["Alias (AS)","Nume înlocuitor pentru coloană sau tabel","Etichetă clară"],["Operatorul +","Lipește textul, se strică la NULL","Sever"],["CONCAT()","Lipește textul, NULL ca șir gol","Liniștit"],["NULLIF(a,b)","NULL, dacă valorile sunt egale","Protecție la împărțirea la zero"]]}],"exam":"UNION întoarce două sau mai multe entități ca un singur set de date și scoate duplicatele; UNION ALL le lasă. Ambele interogări trebuie să aibă același număr de coloane cu tipuri compatibile. INTERSECT întoarce doar înregistrările care coincid. DISTINCT scoate duplicatele dintre câmpurile indicate. Alias este numele înlocuitor pentru o coloană sau un tabel. Concatenarea cu operatorul + dă NULL dacă măcar o valoare este NULL; CONCAT() nu face asta. NULLIF(a, b) întoarce NULL când valorile sunt egale.","qa":[["Prin ce se deosebește UNION de JOIN?","JOIN adaugă coloane, UNION adaugă rânduri."],["Numiți două reguli ale lui UNION.","Același număr de coloane și tipuri de date compatibile în ambele interogări."],["Prin ce se deosebește UNION de UNION ALL?","UNION scoate duplicatele, UNION ALL le lasă."],["Ce întoarce INTERSECT?","Doar înregistrările care coincid în ambele seturi."],["Ce este alias?","Nume înlocuitor pentru o coloană sau un tabel."],["Ce va întoarce FirstName + ' ' + LastName, dacă LastName este NULL?","NULL — tot rezultatul va deveni gol."],["Ce funcție va lipi aceleași valori fără pierderea rezultatului?","CONCAT()."],["Ce întoarce NULLIF(10, 10)?","NULL, pentru că valorile sunt egale."]]},{"n":13,"title":"Sortarea și filtrarea: ORDER BY, WHERE, LIKE, BETWEEN","plain":"Sortarea și filtrarea: ORDER BY, WHERE, LIKE, BETWEEN","obj":"Domain 3 · obiectivul de examen 3.2 Construct and analyze queries that sort and filter data (partea 1)","intro":"Să obțină toate rândurile unui tabel poate oricine. Examenul verifică priceperea de a le alege pe cele necesare și de a le așeza în ordinea cerută.","body":[{"k":"h","v":"13.1. ORDER BY"},{"k":"p","v":"<b>ORDER BY</b> — setul de cuvinte-cheie folosit pentru sortarea datelor într-un set. Implicit sortarea merge crescător — <code>ASC</code>. Pentru descrescător se scrie <code>DESC</code>."},{"k":"p","v":"Se poate sorta după mai multe coloane deodată: mai întâi după prima, iar în interiorul valorilor egale — după a doua. <code>ORDER BY</code> stă întotdeauna la sfârșitul interogării."},{"k":"code","v":"SELECT FirstName, LastName, City\nFROM Person.Person\nORDER BY City ASC, LastName DESC","raw":"SELECT FirstName, LastName, City\nFROM Person.Person\nORDER BY City ASC, LastName DESC"},{"k":"h","v":"13.2. WHERE și operatorii de comparație"},{"k":"p","v":"<b>WHERE</b> — cuvântul-cheie SQL folosit pentru alegerea înregistrărilor dintr-un set la executarea interogării."},{"k":"p","v":"<b>Comparison operator</b> — simbolul care stabilește un filtru în interiorul interogării, de exemplu semnul „mai mare sau egal” (<code>&gt;=</code>)."},{"k":"table","head":["Operatorul","Ce înseamnă","Exemplu"],"rows":[["=","Egal","WHERE City = 'Seattle'"],["&lt;&gt; sau !=","Diferit","WHERE City &lt;&gt; 'Seattle'"],["&gt;","Mai mare","WHERE ListPrice &gt; 100"],["&lt;","Mai mic","WHERE ListPrice &lt; 100"],["&gt;=","Mai mare sau egal","WHERE OrderQty &gt;= 10"],["&lt;=","Mai mic sau egal","WHERE OrderQty &lt;= 10"]]},{"k":"p","v":"Valorile de text din condiție se scriu între ghilimele simple, numerele — fără ghilimele."},{"k":"h","v":"13.3. LIKE și caracterele de înlocuire"},{"k":"p","v":"<b>LIKE</b> — cuvântul-cheie SQL care permite folosirea caracterelor de înlocuire pentru a întoarce potriviri aproximative cu condiția din interogare."},{"k":"b","v":["<code>%</code> — oricâte caractere, inclusiv niciunul;","<code>_</code> — exact un caracter oarecare."]},{"k":"table","head":["Șablonul","Ce găsește","Exemplu de potrivire"],"rows":[["LIKE 'A%'","Începe cu A","Adams, Allen"],["LIKE '%son'","Se termină cu son","Anderson, Jackson"],["LIKE '%an%'","Conține an oriunde","Alexander, Brand"],["LIKE '_a%'","A doua literă este a","Barnes, Nash"],["LIKE 'S____'","Exact cinci litere, prima S","Smith, Stone"]]},{"k":"h","v":"13.4. BETWEEN"},{"k":"p","v":"<b>BETWEEN</b> — cuvântul-cheie SQL care stabilește un interval de valori pentru filtrul din interogare."},{"k":"lead","label":"Important.","v":"Ambele limite ale intervalului <b>se includ</b>. <code>BETWEEN 10 AND 20</code> este același lucru cu <code>&gt;= 10 AND &lt;= 20</code>."},{"k":"code","v":"SELECT SalesOrderID, OrderDate, SubTotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2014-06-01' AND '2014-06-30'","raw":"SELECT SalesOrderID, OrderDate, SubTotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2014-06-01' AND '2014-06-30'"},{"k":"h","v":"13.5. AND, OR, NOT și prioritatea"},{"k":"b","v":["<code>AND</code> — trebuie să se îndeplinească ambele condiții;","<code>OR</code> — ajunge să se îndeplinească măcar una;","<code>NOT</code> — răstoarnă condiția în opusul ei."]},{"k":"p","v":"Acești operatori au o <b>prioritate</b>: mai întâi se execută <code>NOT</code>, apoi <code>AND</code>, și abia după aceea <code>OR</code>. De aceea cele două interogări de mai jos dau rezultate diferite:"},{"k":"code","v":"WHERE City = 'Los Angeles' OR City = 'Seattle' AND LastName = 'Adams'\nWHERE (City = 'Los Angeles' OR City = 'Seattle') AND LastName = 'Adams'","raw":"WHERE City = 'Los Angeles' OR City = 'Seattle' AND LastName = 'Adams'\nWHERE (City = 'Los Angeles' OR City = 'Seattle') AND LastName = 'Adams'"},{"k":"p","v":"Prima va întoarce pe toți din Los Angeles plus pe cei cu numele Adams din Seattle. A doua — doar pe cei cu numele Adams, dar din ambele orașe. Dacă aveți îndoieli — puneți paranteze."}],"exam":"ORDER BY sortează datele, implicit crescător; DESC — descrescător. WHERE alege înregistrările. LIKE lucrează cu caractere de înlocuire: % — oricâte caractere, _ — exact unul. BETWEEN stabilește un interval, și ambele limite intră în el. Prioritatea operatorilor logici: mai întâi NOT, apoi AND, apoi OR.","qa":[["Ce cuvânt-cheie sortează datele?","ORDER BY."],["Cum sortați descrescător?","Adăugați DESC după numele coloanei."],["Ce cuvânt-cheie alege înregistrările după o condiție?","WHERE."],["Ce înseamnă semnul % în LIKE?","Oricâte caractere, oricare ar fi ele."],["Ce înseamnă semnul _ în LIKE?","Exact un caracter oarecare."],["Ce va găsi șablonul LIKE '_a%'?","Valorile la care a doua literă este a."],["Intră limitele în BETWEEN?","Da, ambele limite se includ."],["Ce operator se execută mai devreme — AND sau OR?","AND. Ordinea: NOT, apoi AND, apoi OR."]]},{"n":14,"title":"TOP, IN, ANY, ALL și lucrul cu NULL","plain":"TOP, IN, ANY, ALL și lucrul cu NULL","obj":"Domain 3 · obiectivul de examen 3.2 Construct and analyze queries that sort and filter data (partea 2)","intro":"A doua jumătate a filtrării: cum se limitează numărul de rânduri, cum se verifică apartenența la o listă și cum se caută corect valorile goale. Ultimul lucru este cel mai frecvent loc al greșelilor.","body":[{"k":"h","v":"14.1. TOP"},{"k":"p","v":"<b>TOP</b> — cuvântul-cheie SQL care limitează numărul de înregistrări întoarse de interogare. Aproape întotdeauna se folosește împreună cu <code>ORDER BY</code>: fără sortare nu se înțelege care rânduri vor fi „primele”."},{"k":"code","v":"SELECT TOP 10 FirstName, LastName, City\nFROM Person.Person\nORDER BY LastName","raw":"SELECT TOP 10 FirstName, LastName, City\nFROM Person.Person\nORDER BY LastName"},{"k":"lead","label":"Dialectele.","v":"În obiectivul examenului este scris „TOP (LIMIT)”. În SQL Server se scrie <code>TOP 10</code> la începutul interogării, în MySQL și PostgreSQL — <code>LIMIT 10</code> la sfârșit. Trebuie recunoscute ambele forme."},{"k":"h","v":"14.2. IN și NOT IN"},{"k":"p","v":"<b>IN</b> — cuvântul-cheie SQL care stabilește mai multe valori folosite drept criteriu de filtrare în interiorul interogării. Este scrierea scurtă a unui lanț lung de <code>OR</code>."},{"k":"code","v":"-- lung\nWHERE City = 'Seattle' OR City = 'Portland' OR City = 'Denver'\n\n-- același lucru, scurt\nWHERE City IN ('Seattle', 'Portland', 'Denver')","raw":"-- lung\nWHERE City = 'Seattle' OR City = 'Portland' OR City = 'Denver'\n\n-- același lucru, scurt\nWHERE City IN ('Seattle', 'Portland', 'Denver')"},{"k":"p","v":"<code>NOT IN</code> — condiția inversă: valoarea nu intră în niciuna dintre variantele enumerate."},{"k":"h","v":"14.3. Subinterogarea"},{"k":"p","v":"Lista de valori pentru <code>IN</code> poate să nu fie enumerată manual, ci obținută printr-o altă interogare. Interogarea din interiorul interogării se numește subinterogare. Mai întâi se execută cea interioară, iar rezultatul ei se pune în cea exterioară."},{"k":"code","v":"SELECT ProductID, Name\nFROM Production.Product\nWHERE ProductID IN\n      (SELECT ProductID FROM Sales.SalesOrderDetail WHERE OrderQty &gt;= 10)","raw":"SELECT ProductID, Name\nFROM Production.Product\nWHERE ProductID IN\n      (SELECT ProductID FROM Sales.SalesOrderDetail WHERE OrderQty >= 10)"},{"k":"h","v":"14.4. ANY și ALL"},{"k":"p","v":"<b>ANY</b> — cuvântul-cheie SQL folosit pentru găsirea înregistrărilor care coincid între interogare și subinterogare. <b>ALL</b> — cuvântul-cheie SQL care afișează înregistrările interogării dacă toate înregistrările acestei interogări coincid cu înregistrările legate din subinterogare."},{"k":"b","v":["<code>&gt; ANY (subinterogare)</code> — mai mare decât <b>măcar una</b> dintre valorile subinterogării;","<code>&gt; ALL (subinterogare)</code> — mai mare decât <b>fiecare</b> valoare a subinterogării;","<code>= ANY</code> lucrează la fel ca <code>IN</code>."]},{"k":"p","v":"Ambele cuvinte-cheie se folosesc doar împreună cu un operator de comparație și cu o subinterogare — singure nu se întrebuințează."},{"k":"h","v":"14.5. NULL și NOT NULL"},{"k":"p","v":"<b>NULL</b> — cuvântul-cheie SQL care marchează o valoare goală într-un câmp. De aici urmează regula principală, care trebuie ținută minte cuvânt cu cuvânt:"},{"k":"lead","label":"Regula.","v":"Valoarea <code>NULL</code> nu poate fi comparată prin <code>=</code>. Condiția <code>WHERE MiddleName = NULL</code> nu va întoarce nimic și nu va da eroare — ea este pur și simplu mereu falsă. Golul se verifică prin <code>IS NULL</code>, iar lipsa golului — prin <code>IS NOT NULL</code>."},{"k":"code","v":"-- nu funcționează, va întoarce 0 rânduri\nSELECT * FROM Person.Person WHERE MiddleName = NULL\n\n-- corect\nSELECT * FROM Person.Person WHERE MiddleName IS NULL\nSELECT * FROM Person.Person WHERE MiddleName IS NOT NULL","raw":"-- nu funcționează, va întoarce 0 rânduri\nSELECT * FROM Person.Person WHERE MiddleName = NULL\n\n-- corect\nSELECT * FROM Person.Person WHERE MiddleName IS NULL\nSELECT * FROM Person.Person WHERE MiddleName IS NOT NULL"},{"k":"table","head":["Cuvântul-cheie","Ce face","Cum țineți minte"],"rows":[["TOP n","Limitează numărul de rânduri","Primele n, de obicei cu ORDER BY"],["LIMIT n","Același lucru în MySQL și PostgreSQL","Alt dialect"],["IN","Valoarea intră în listă","Înlocuire scurtă pentru lanțul de OR"],["NOT IN","Valoarea nu intră în listă","Inversul lui IN"],["ANY","Potrivire cu măcar o valoare","Ajunge una"],["ALL","Potrivire cu toate valorile","Trebuie toate"],["IS NULL","Câmpul este gol","Singurul mod de a verifica golul"],["IS NOT NULL","Câmpul este completat","Inversul lui IS NULL"]]}],"exam":"TOP limitează numărul de înregistrări întoarse de interogare; în alte dialecte același lucru îl face LIMIT. IN stabilește mai multe valori pentru filtrare și înlocuiește un lanț lung de OR. ANY caută potrivirea cu măcar o valoare a subinterogării, ALL cere potrivirea cu toate. NULL este valoarea goală; ea nu poate fi comparată prin semnul egal, se folosesc doar IS NULL și IS NOT NULL.","qa":[["Ce cuvânt-cheie limitează numărul de înregistrări întoarse?","TOP, în alte dialecte LIMIT."],["Cu ce cuvânt-cheie merge aproape întotdeauna TOP?","Cu ORDER BY."],["Prin ce este comod IN?","Înlocuiește un lanț lung de condiții OR cu o singură listă scurtă."],["Ce se execută mai devreme — interogarea exterioară sau subinterogarea?","Subinterogarea: rezultatul ei se pune în interogarea exterioară."],["Care este diferența dintre ANY și ALL?","ANY — potrivirea cu măcar o valoare, ALL — cu toate."],["De ce WHERE MiddleName = NULL nu funcționează?","NULL înseamnă lipsa valorii, el nu poate fi comparat cu semnul egal."],["Cum găsiți corect rândurile cu un câmp gol?","WHERE câmp IS NULL."],["Cum găsiți rândurile cu un câmp completat?","WHERE câmp IS NOT NULL."]]},{"n":15,"title":"Agregarea datelor","plain":"Agregarea datelor","obj":"Domain 3 · obiectivul de examen 3.3 Construct and analyze queries that aggregate data","intro":"Agregarea transformă mulțimea de rânduri în numere finale: suma, media, numărul, minimul și maximul. Tot aici apare cea mai importantă idee a întregului domeniu 3 — ordinea de prelucrare a interogării.","body":[{"k":"h","v":"15.1. Funcțiile de agregare"},{"k":"b","v":["<b>SUM</b> — adună valorile unuia sau mai multor câmpuri în interiorul interogării.","<b>COUNT</b> — arată numărul de înregistrări din interogare.","<b>AVG</b> — calculează valorile medii pentru unul sau mai multe câmpuri.","<b>MIN</b> — obține cea mai mică valoare dintr-un interval de valori.","<b>MAX</b> — obține cea mai mare valoare dintr-un interval de valori."]},{"k":"h","v":"15.2. GROUP BY"},{"k":"p","v":"<b>GROUP BY</b> — setul de cuvinte-cheie care stabilește câmpurile după care trebuie făcută agregarea, atunci când în interogare se folosesc funcții de agregare."},{"k":"lead","label":"Regulă de fier.","v":"Fiecare coloană din <code>SELECT</code> care nu este învelită într-o funcție de agregare trebuie să fie prezentă în <code>GROUP BY</code>. Este cea mai frecventă greșeală și cea mai frecventă întrebare la acest obiectiv."},{"k":"code","v":"SELECT SalesPersonID, LastName, FirstName,\n       SUM(SubTotal) AS 'Total Sales'\nFROM Sales.SalesOrderHeader soh\nJOIN Sales.SalesPerson  sp ON soh.SalesPersonID = sp.BusinessEntityID\nJOIN Person.Person       p ON sp.BusinessEntityID = p.BusinessEntityID\nGROUP BY SalesPersonID, LastName, FirstName","raw":"SELECT SalesPersonID, LastName, FirstName,\n       SUM(SubTotal) AS 'Total Sales'\nFROM Sales.SalesOrderHeader soh\nJOIN Sales.SalesPerson  sp ON soh.SalesPersonID = sp.BusinessEntityID\nJOIN Person.Person       p ON sp.BusinessEntityID = p.BusinessEntityID\nGROUP BY SalesPersonID, LastName, FirstName"},{"k":"h","v":"15.3. HAVING"},{"k":"p","v":"<code>HAVING</code> filtrează rezultatul <b>după</b> agregare. Tocmai de aceea funcția de agregare nu poate fi scrisă în <code>WHERE</code>: în momentul executării lui <code>WHERE</code> totalul încă nu este calculat."},{"k":"code","v":"GROUP BY SalesPersonID, LastName, FirstName\nHAVING SUM(SubTotal) &gt; 1000000\nORDER BY SUM(SubTotal) DESC","raw":"GROUP BY SalesPersonID, LastName, FirstName\nHAVING SUM(SubTotal) > 1000000\nORDER BY SUM(SubTotal) DESC"},{"k":"h","v":"15.4. WHERE sau HAVING"},{"k":"table","head":["Criteriul","WHERE","HAVING"],"rows":[["Când lucrează","Înainte de grupare","După grupare"],["Ce filtrează","Rânduri separate","Grupuri gata formate"],["Se poate agregat","Nu","Da"],["Exemplu","WHERE OrderDate &gt; 2014","HAVING SUM(SubTotal) &gt; 1000000"]]},{"k":"h","v":"15.5. Ordinea de prelucrare a interogării"},{"k":"p","v":"Interogarea nu se execută în ordinea în care este scrisă. Ordinea reală este aceasta:"},{"k":"code","v":"FROM  →  WHERE  →  GROUP BY  →  HAVING  →  SELECT  →  ORDER BY  →  TOP","raw":"FROM  →  WHERE  →  GROUP BY  →  HAVING  →  SELECT  →  ORDER BY  →  TOP"},{"k":"p","v":"Din această ordine urmează imediat trei lucruri care altfel ar trebui pur și simplu memorate:"},{"k":"b","v":["<code>HAVING</code> poate lucra cu agregate, iar <code>WHERE</code> — nu, pentru că <code>WHERE</code> se execută înainte de grupare;","alias-ul dat în <code>SELECT</code> nu se vede în <code>WHERE</code>, dar se vede în <code>ORDER BY</code> — pentru că <code>ORDER BY</code> se execută după <code>SELECT</code>;","<code>TOP</code> fără <code>ORDER BY</code> dă un rezultat imprevizibil: el se aplică ultimul, unui set deja gata."]}],"exam":"SUM adună valorile, COUNT arată numărul de înregistrări, AVG calculează media, MIN și MAX dau cea mai mică și cea mai mare valoare. GROUP BY stabilește câmpurile după care merge agregarea; fiecare coloană neagregată din SELECT trebuie să fie în GROUP BY. WHERE filtrează rândurile înainte de grupare, HAVING filtrează grupurile după ea, de aceea funcția de agregare este admisă doar în HAVING. Ordinea de prelucrare: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, TOP.","qa":[["Ce funcție adună valorile unui câmp?","SUM."],["Ce funcție arată numărul de înregistrări?","COUNT."],["Ce funcție calculează media?","AVG."],["Ce stabilește GROUP BY?","Câmpurile după care se face agregarea."],["Ce coloane trebuie să fie în GROUP BY?","Toate coloanele din SELECT care nu sunt învelite într-o funcție de agregare."],["Prin ce se deosebește HAVING de WHERE?","WHERE filtrează rândurile înainte de grupare, HAVING — grupurile gata, după ea."],["Se poate scrie SUM() în condiția WHERE?","Nu. Agregatul este admis doar în HAVING."],["Numiți ordinea de prelucrare a interogării.","FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, TOP."]]},{"n":16,"title":"Modificarea datelor: INSERT, UPDATE, DELETE","plain":"Modificarea datelor: INSERT, UPDATE, DELETE","obj":"Domain 4 · obiectivele de examen 4.1 INSERT · 4.2 UPDATE · 4.3 DELETE","intro":"Domeniul 4 se numește Data Manipulation using DML. Până acum doar am citit datele — de acum le vom adăuga, modifica și șterge.","body":[{"k":"h","v":"16.1. INSERT INTO ... VALUES"},{"k":"p","v":"<b>VALUES</b> — cuvântul-cheie SQL folosit ca parte a propoziției <code>INSERT</code>, care stabilește ce anume se adaugă în entitate."},{"k":"p","v":"Mai întâi se enumeră coloanele, apoi valorile în aceeași ordine. Cu o singură comandă se pot adăuga deodată mai multe rânduri."},{"k":"code","v":"INSERT INTO BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\nVALUES\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)","raw":"INSERT INTO BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\nVALUES\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)"},{"k":"h","v":"16.2. INSERT INTO ... SELECT și SELECT INTO"},{"k":"p","v":"<b>INSERT INTO</b> — propoziția SQL care copiază înregistrări dintr-o entitate în alta. Tabelul-țintă trebuie să existe deja."},{"k":"p","v":"<b>SELECT INTO</b> — propoziția SQL care copiază înregistrări dintr-o entitate într-o entitate <b>nouă</b>. Tabelul se creează automat."},{"k":"code","v":"-- copiază într-un tabel existent\nINSERT INTO BikeRepairsTest\nSELECT * FROM BikeRepairs\n\n-- creează un tabel nou și copiază în el\nSELECT * INTO BikeRepairsArchive FROM BikeRepairs","raw":"-- copiază într-un tabel existent\nINSERT INTO BikeRepairsTest\nSELECT * FROM BikeRepairs\n\n-- creează un tabel nou și copiază în el\nSELECT * INTO BikeRepairsArchive FROM BikeRepairs"},{"k":"lead","label":"Cum țineți minte:","v":"<code>INSERT INTO ... SELECT</code> — tabelul există deja. <code>SELECT ... INTO</code> — tabelul se creează din mers."},{"k":"h","v":"16.3. UPDATE"},{"k":"p","v":"<b>UPDATE</b> — cuvântul-cheie SQL folosit pentru modificarea datelor în interiorul unei entități. Sintaxa: <code>UPDATE</code> tabelul, <code>SET</code> ce se schimbă, <code>WHERE</code> în ce rânduri."},{"k":"code","v":"UPDATE BikeRepairs\nSET StartDate = '2021-07-02'\nWHERE BikeRepairID = 2","raw":"UPDATE BikeRepairs\nSET StartDate = '2021-07-02'\nWHERE BikeRepairID = 2"},{"k":"lead","label":"Avertisment.","v":"<code>UPDATE</code> fără <code>WHERE</code> va modifica <b>toate rândurile tabelului</b>. Greșeala se observă greu, iar fără o copie de rezervă nu poate fi anulată."},{"k":"h","v":"16.4. DELETE și TRUNCATE TABLE"},{"k":"p","v":"<b>DELETE</b> — cuvântul-cheie SQL folosit pentru ștergerea datelor dintr-o entitate. Ca și <code>UPDATE</code>, fără <code>WHERE</code> el atinge tot tabelul."},{"k":"p","v":"<b>TRUNCATE TABLE</b> — setul de cuvinte-cheie care golește complet entitatea. Structura tabelului rămâne însă."},{"k":"code","v":"DELETE FROM BikeRepairsTest\nWHERE BikeRepairID = 5\n\nTRUNCATE TABLE BikeRepairsTest","raw":"DELETE FROM BikeRepairsTest\nWHERE BikeRepairID = 5\n\nTRUNCATE TABLE BikeRepairsTest"},{"k":"h","v":"16.5. Trei moduri de a șterge"},{"k":"table","head":["Criteriul","DELETE","TRUNCATE TABLE","DROP TABLE"],"rows":[["Grupa de comenzi","DML","DDL","DDL"],["Șterge datele","Da","Da, toate","Da"],["Șterge structura","Nu","Nu","Da"],["Se poate cu WHERE","Da","Nu","Nu"],["Ce rămâne","Tabel gol sau redus","Tabel gol","Nimic"]]}],"exam":"INSERT INTO copiază înregistrări dintr-o entitate în alta — tabelul-țintă trebuie să existe. SELECT INTO copiază înregistrările într-o entitate nouă, creând-o. VALUES stabilește ce anume se adaugă. UPDATE schimbă datele din interiorul entității; fără WHERE se vor schimba toate rândurile. DELETE șterge datele din entitate; TRUNCATE TABLE o golește complet, dar lasă structura. DROP TABLE șterge și datele, și structura.","qa":[["Ce cuvânt-cheie stabilește ce se adaugă la inserare?","VALUES."],["Prin ce se deosebește INSERT INTO SELECT de SELECT INTO?","Primul copiază într-un tabel existent, al doilea creează unul nou."],["Ce se va întâmpla la un UPDATE fără WHERE?","Se vor schimba toate rândurile tabelului."],["Ce face TRUNCATE TABLE?","Golește complet tabelul, lăsându-i structura."],["Se poate folosi WHERE cu TRUNCATE TABLE?","Nu."],["Ce rămâne din tabel după TRUNCATE și ce rămâne după DROP?","După TRUNCATE — un tabel gol, după DROP — nimic."],["Din ce grupă face parte DELETE — DDL sau DML?","Din DML."]]},{"n":17,"title":"Căutarea greșelilor în interogări","plain":"Căutarea greșelilor în interogări","obj":"Domain 5 · obiectivele de examen 5.1 · 5.2 · 5.3 Troubleshoot query failures","intro":"Domeniul 5 nu introduce material nou. El verifică dacă știți să găsiți greșeala într-o interogare străină — după toate comenzile parcurse mai devreme. La examen o astfel de întrebare arată ca un cod cu rugămintea de a indica rândul cu greșeala.","body":[{"k":"h","v":"17.1. Două clase de greșeli"},{"k":"b","v":["<b>Syntax error</b> — greșeala din cod, provocată de obicei de punctuație greșită, de scrierea incorectă a unui cuvânt-cheie sau de ordinea greșită a cuvintelor-cheie într-un bloc de cod. Se prinde <b>înainte</b> de executare.","<b>Runtime error</b> — greșeala care apare <b>în timpul</b> executării codului. Sintaxa este corectă, dar comanda nu poate funcționa."]},{"k":"lead","label":"Cum le deosebiți:","v":"dacă interogarea nu a pornit deloc — este syntax error. Dacă a pornit și a căzut pe date — runtime error."},{"k":"p","v":"Cauze tipice ale erorilor runtime: tabelul sau coloana nu există, este încălcată o restricție (<code>NOT NULL</code>, <code>PRIMARY KEY</code>, <code>FOREIGN KEY</code>), tipul de date nu se potrivește, împărțire la zero."},{"k":"h","v":"17.2. Greșeli în lucrul cu obiectele"},{"k":"code","v":"ALTER BikeRepairs\nADD COLUMN EmployeeID int","raw":"ALTER BikeRepairs\nADD COLUMN EmployeeID int"},{"k":"p","v":"Aici sunt două greșeli: lipsește cuvântul <code>TABLE</code> după <code>ALTER</code>, iar în T-SQL la adăugarea unei coloane nu se scrie cuvântul <code>COLUMN</code>. Corect este:"},{"k":"code","v":"ALTER TABLE BikeRepairs\nADD EmployeeID int","raw":"ALTER TABLE BikeRepairs\nADD EmployeeID int"},{"k":"h","v":"17.3. Greșeli la extragerea datelor"},{"k":"code","v":"SELECT Sales.Customer.CustomerID,\n       Sales.Customer.AccountNumber,\n       OrderDate,\n       Status,\nFROM Sales.Customer\nJOIN Sales.SalesOrderHeader\n  ON Sales.Customer.CustomerID = Sales.SalesOrderHeader.CustomerID","raw":"SELECT Sales.Customer.CustomerID,\n       Sales.Customer.AccountNumber,\n       OrderDate,\n       Status,\nFROM Sales.Customer\nJOIN Sales.SalesOrderHeader\n  ON Sales.Customer.CustomerID = Sales.SalesOrderHeader.CustomerID"},{"k":"p","v":"Virgulă în plus după <code>Status</code>, chiar înainte de <code>FROM</code>. Greșeală de sintaxă clasică: lista coloanelor s-a terminat, iar virgula a rămas."},{"k":"h","v":"17.4. Greșeli la modificarea datelor"},{"k":"code","v":"INSERT BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)","raw":"INSERT BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)"},{"k":"p","v":"Lipsește cuvântul-cheie <code>VALUES</code> între lista coloanelor și lista valorilor."},{"k":"h","v":"17.5. Ordinea de verificare a unei interogări străine"},{"k":"b","v":["Verificați virgulele: cea în plus înainte de <code>FROM</code>, cea în plus după ultima coloană din <code>CREATE TABLE</code>, cea lipsă dintre coloane.","Verificați ghilimelele: textul trebuie să fie între ghilimele simple, numerele — fără.","Verificați dacă toate cuvintele-cheie sunt la locul lor: <code>TABLE</code> după <code>ALTER</code>, <code>VALUES</code> înaintea listei de valori, <code>FROM</code> în <code>DELETE FROM</code>.","Verificați ordinea: <code>WHERE</code> vine după <code>FROM</code>, <code>GROUP BY</code> după <code>WHERE</code>, <code>HAVING</code> după <code>GROUP BY</code>, <code>ORDER BY</code> chiar la sfârșit.","Verificați <code>GROUP BY</code>: sunt oare enumerate acolo toate coloanele neagregate din <code>SELECT</code>.","Verificați comparația cu <code>NULL</code>: trebuie să fie <code>IS NULL</code>, nu <code>= NULL</code>."]},{"k":"table","head":["Ce vedeți","Clasa greșelii","Despre ce este vorba"],"rows":[["Virgulă înainte de FROM","Syntax","Separator în plus în lista coloanelor"],["ALTER fără TABLE","Syntax","Lipsește un cuvânt-cheie"],["INSERT fără VALUES","Syntax","Lipsește un cuvânt-cheie"],["SELECT scris greșit","Syntax","Greșeală de scriere într-un cuvânt-cheie"],["Tabelul nu există","Runtime","Nume greșit al obiectului"],["Încălcarea cheii externe","Runtime","Nu există înregistrarea în tabelul-părinte"],["Inserare de NULL în NOT NULL","Runtime","Restricție încălcată"],["Împărțire la zero","Runtime","Greșeală pe date"]]}],"exam":"Syntax error este greșeala de cod din cauza punctuației, a scrierii unui cuvânt-cheie sau a ordinii cuvintelor-cheie; ea nu lasă interogarea să pornească. Runtime error apare în timpul executării: obiectul nu există, o restricție este încălcată, tipul nu se potrivește, împărțire la zero. Când verificați o interogare străină, începeți cu virgulele, ghilimelele, cuvintele-cheie lipsă și ordinea propozițiilor.","qa":[["Ce este syntax error?","Greșeala din cod din cauza punctuației, a scrierii unui cuvânt-cheie sau a ordinii cuvintelor-cheie."],["Ce este runtime error?","Greșeala care apare în timpul executării codului."],["Interogarea nu a pornit deloc — ce clasă de greșeală este?","Syntax error."],["Interogarea a pornit și a căzut la inserare — ce clasă este?","Runtime error."],["Găsiți greșeala: ALTER BikeRepairs ADD COLUMN EmployeeID int.","Lipsește cuvântul TABLE, iar cuvântul COLUMN este aici în plus."],["Găsiți greșeala: lista coloanelor, apoi virgulă, apoi FROM.","Virgulă în plus înainte de FROM."],["Găsiți greșeala: INSERT, lista coloanelor, imediat lista valorilor.","Lipsește cuvântul-cheie VALUES."],["Ce nu este în regulă în condiția WHERE MiddleName = NULL?","Comparația cu NULL prin semnul egal. Trebuie IS NULL."]]}],"gloss":[["1NF","First Normal Form (1NF) is a form of normalization in which each field has a single value so that data can be sorted in any way possible.","Prima formă normală: în fiecare câmp o singură valoare, de aceea datele pot fi sortate în orice fel."],["2NF","Second Normal Form (2NF) is a form of normalization in which a table is in 1NF and every non-key column depends on the whole composite key rather than on part of it.","A doua formă normală: tabelul este deja în 1NF, și fiecare coloană nerelevantă depinde de toată cheia compusă, nu de o parte a ei."],["3NF","Third Normal Form (3NF) is a form of normalization in which a value change in a non-key column in one table does not necessitate a change in another non-key column within an entity.","A treia formă normală: modificarea unei coloane nerelevante nu cere modificarea altei coloane nerelevante din aceeași entitate."],["Alias","A replacement name for a column or table.","Nume înlocuitor pentru o coloană sau un tabel. Se dă prin cuvântul AS."],["ALL","A SQL keyword used to display records within a query if all records within that query match related records in a subquery.","Cuvânt-cheie: condiția se îndeplinește doar dacă potrivirea există cu toate înregistrările subinterogării."],["ALTER","A SQL keyword used to change the definition of a database object.","Cuvânt-cheie pentru modificarea definiției unui obiect al bazei de date."],["ANSI SQL","The standardized version of SQL shared by MySQL, Microsoft SQL Server, Oracle, and other relational database systems. Exam questions are written in ANSI SQL.","Varianta standardizată a SQL, comună pentru MySQL, SQL Server, Oracle și alte SGBD. Întrebările examenului sunt formulate anume în ea."],["ANY","A SQL keyword used to find matching records from a query to a subquery.","Cuvânt-cheie: condiția se îndeplinește la potrivirea cu măcar o înregistrare a subinterogării."],["Auditing","The practice of recording who accessed the database, when, and what actions they performed, so that activity can be reviewed after the fact.","Auditul: jurnalul despre cine, când și ce a făcut în bază. Nu interzice acțiunile, ci le consemnează."],["AVG","A SQL keyword used to get the average amounts for one or more fields within a query.","Cuvânt-cheie pentru calcularea valorii medii după unul sau mai multe câmpuri."],["Backup","A copy of data stored elsewhere to be restored if original data is lost or damaged.","Copia de rezervă a datelor, păstrată separat, ca să fie restaurate la pierdere sau deteriorare."],["BETWEEN","A SQL keyword used to define a range of values used for a filter within a query.","Cuvânt-cheie care stabilește un interval de valori pentru filtru. Ambele limite se includ."],["Bit","A data type that is either a zero or a one.","Tip de date care păstrează zero sau unu."],["Boolean","A data type that allows for values to be either true or false.","Tip de date cu valorile „adevărat” sau „fals”. În SQL Server rolul lui îl joacă bit."],["Byte","A unit of measurement used to determine how much memory a piece of data will take.","Unitatea de măsură a memoriei pe care o ocupă datele."],["Cartesian Product","A combining of two unrelated tables within a query.","Îmbinarea a două tabele nelegate: fiecare rând cu fiecare. Numărul de rânduri se înmulțește."],["Clustered Index","An index based on the primary key of an entity.","Index pe cheia primară. Stabilește ordinea fizică a rândurilor, de aceea într-un tabel poate fi doar unul."],["Column","A property that defines data in an entity. Also known as a field.","Proprietate care descrie datele dintr-o entitate. A doua denumire este field, câmp."],["Comparison Operator","A symbol used to define a filter within a query, for example, the greater than or equal to symbol (&gt;=).","Simbol care stabilește condiția de filtru: =, &lt;&gt;, &gt;, &lt;, &gt;=, &lt;=."],["Composite Key","A primary key consisting of two or more fields. Also known as a compound key.","Cheie primară din două sau mai multe câmpuri. A doua denumire este compound key."],["Compound Key","A primary key consisting of two or more fields. Also known as a composite key.","Același lucru cu composite key: cheie din mai multe câmpuri."],["CONCAT()","A SQL function that joins two or more text values into one. Unlike the + operator, it treats NULL as an empty string.","Funcție de lipire a textului. Spre deosebire de operatorul +, tratează NULL ca pe un șir gol."],["Concatenation","The joining of two or more text values into a single value, using either the + operator or the CONCAT() function.","Lipirea valorilor de text într-una singură — cu operatorul + sau cu funcția CONCAT()."],["Constraint","A limitation on what can be entered in a data field within an entity.","Restricție asupra a ceea ce se poate introduce într-un câmp al entității."],["COUNT","A SQL keyword used to show the number of records within a query.","Cuvânt-cheie pentru numărarea înregistrărilor dintr-o interogare."],["CREATE","A SQL keyword used to add an object to a database or add an entire database to an instance of SQL Server.","Cuvânt-cheie pentru crearea unui obiect al bazei de date sau a bazei însăși."],["Cross Join","A join that returns every combination of rows from two tables, producing a Cartesian product.","Îmbinare care întoarce toate combinațiile posibile de rânduri ale două tabele — produsul cartezian."],["Data","Information that is organized, entered into files, and then retrievable as needed.","Informație organizată, introdusă în fișiere și disponibilă pentru a fi obținută la nevoie."],["Data Masking","A protection measure that hides part of a stored value when it is displayed, while the real value remains in the database.","Mascarea: valoarea adevărată rămâne în bază, dar se arată ascunsă, de exemplu **** 1234."],["Data Type","A setting that defines what kind of data can be entered in a field, such as a number, date, or text string.","Setare care hotărăște ce date se pot introduce într-un câmp: număr, dată sau text."],["Database","A file that stores data and allows people to search and create reports from the data.","Fișier care păstrează datele și permite căutarea în ele și construirea de rapoarte."],["Datetime","A data type that holds dates and times.","Tip de date pentru păstrarea datei și a orei."],["DDL","Data Definition Language — the group of SQL statements that define or change database structure: CREATE, ALTER, DROP, TRUNCATE.","Limbajul de definire a datelor: comenzile care schimbă structura bazei, nu datele însele."],["DELETE","A SQL keyword used to remove data from an entity.","Cuvânt-cheie pentru ștergerea datelor dintr-o entitate. Fără WHERE șterge toate rândurile."],["Differential Backup","A backup of data that has changed since the last full backup.","Copia de rezervă a datelor care s-au schimbat de la ultima copie completă."],["DISTINCT","A keyword used to return records without duplicate values among fields specified in a query.","Cuvânt-cheie care întoarce înregistrările fără valori care se repetă printre câmpurile indicate."],["DML","Data Manipulation Language — the group of SQL statements that work with the data itself: SELECT, INSERT, UPDATE, DELETE.","Limbajul de manipulare a datelor: comenzile care lucrează cu datele însele, nu cu structura."],["DROP","A SQL keyword used to remove a database object.","Cuvânt-cheie pentru ștergerea unui obiect al bazei de date împreună cu structura."],["Encryption","A protection measure that converts data into an unreadable form which can be converted back only with the correct key.","Criptarea: datele devin necitibile, dar pot fi aduse înapoi dacă există cheia."],["Entity","A database object with organized rows and columns as data. Also known as a table.","Obiect al bazei de date cu rânduri și coloane. A doua denumire este table, tabel."],["Entry","Adding a row of data to an entity.","Adăugarea unui rând de date într-o entitate."],["ERD","An Entity Relationship Diagram (ERD) is a visual representation of a database, its entities, and the relationships among those entities.","Diagrama „entitate — relație”: schema vizuală a bazei, a tabelelor ei și a relațiilor dintre ele."],["EXEC","A SQL command used to run a stored procedure.","Comanda pentru pornirea unei proceduri stocate."],["Field","A property that defines data in an entity. Also known as a column.","Proprietate care descrie datele dintr-o entitate. A doua denumire este column, coloană."],["Foreign Key","An entity field used to help create a one-to-many relationship between entities.","Câmp care creează relația „unu la multe”. Se află întotdeauna de partea „multe”."],["Full Backup","A backup of an entire database.","Copia de rezervă a întregii baze de date."],["Full Outer Join","A join that shows all records from both tables within a defined join.","Îmbinare care arată toate înregistrările din ambele tabele."],["GRANT","A SQL statement used to give a user or a role permission on a database object.","Comanda de acordare a unui drept unui utilizator sau unui rol asupra unui obiect al bazei."],["GROUP BY","A SQL keyword set used to define fields that should be aggregated when aggregates are used within a query.","Setul de cuvinte-cheie care stabilește câmpurile după care se face agregarea."],["Hashing","A protection measure that converts data into a fixed-length value that cannot be converted back to the original.","Hashing: transformarea ireversibilă a datelor. Așa se păstrează parolele."],["HAVING","A SQL keyword used to filter grouped results after aggregation has been applied.","Cuvânt-cheie care filtrează rezultatul deja grupat. Doar aici sunt admise funcțiile de agregare."],["IN","A SQL keyword used to define multiple values used for filtering criteria within a query.","Cuvânt-cheie care stabilește o listă de valori pentru filtru. Înlocuire scurtă pentru lanțul de OR."],["Index","A virtual table used to sort information in an entity and make that information easier to retrieve than without the index.","Tabel virtual care ordonează datele și accelerează obținerea lor."],["Inner Join","A join that shows related records from both tables within the join.","Îmbinare care arată doar înregistrările legate din ambele tabele."],["Input Parameter","A value a person enters to use as a filter when running a stored procedure.","Valoarea pe care omul o introduce ca filtru la pornirea unei proceduri stocate."],["INSERT INTO","A SQL statement that copies records from one entity to another.","Propoziție care copiază înregistrări dintr-o entitate în alta. Tabelul-țintă trebuie să existe."],["Integer","A data type consisting of whole numbers.","Tip de date pentru numere întregi. Int ocupă 4 octeți, tinyint — 1 octet."],["INTERSECT","A keyword used to return matching records between two entities.","Cuvânt-cheie care întoarce doar înregistrările care coincid în două seturi."],["IS NULL","A SQL condition used to find rows where a field has no value. NULL cannot be tested with the equals sign.","Condiție pentru căutarea câmpurilor goale. Prin semnul egal NULL nu poate fi verificat."],["Join","The combining of two entities within a single query, with data being related on a common field between the two entities.","Unirea a două entități într-o singură interogare după un câmp comun."],["Left Outer Join","A join that shows all records from the first table defined in a join.","Îmbinare care arată toate înregistrările din primul tabel al îmbinării."],["LIKE","A SQL keyword that allows for the use of wildcards to return approximate matches of criteria within a query.","Cuvânt-cheie care permite căutarea după un șablon cu caractere de înlocuire."],["LIMIT","A SQL keyword used in MySQL and PostgreSQL to restrict the number of rows returned. SQL Server uses TOP for the same purpose.","Limitarea numărului de rânduri în MySQL și PostgreSQL. În SQL Server același rol îl joacă TOP."],["MAX","A SQL keyword used to get the largest value within a range of values.","Cuvânt-cheie pentru obținerea celei mai mari valori."],["MIN","A SQL keyword used to get the smallest value within a range of values.","Cuvânt-cheie pentru obținerea celei mai mici valori."],["Nonclustered Index","An index based on an entity field that is not the primary key of an entity.","Index pe un câmp care nu este cheia primară. Astfel de indexuri pot fi mai multe într-un tabel."],["Normalization","The process of ensuring that an entity in a database can work with other entities as needed from an organization and relationship standpoint.","Procesul de punere în ordine a tabelelor, ca ele să lucreze corect unul cu altul."],["NOT IN","A SQL keyword set used to return records whose value does not appear in a specified list of values.","Condiție: valoarea nu intră în niciuna dintre variantele enumerate."],["NOT NULL","A column setting that requires a value to be entered; the field cannot be left empty.","Setare a coloanei care cere completarea obligatorie a câmpului."],["NULL","A SQL keyword used to indicate an empty value within a field.","Cuvânt-cheie care marchează valoarea goală — lipsa datelor, nu zero."],["NULLIF()","A SQL function that returns NULL when two values are equal and the first value when they differ. Commonly used to prevent division by zero.","Funcție care întoarce NULL când valorile sunt egale. Cel mai des protejează de împărțirea la zero."],["Nvarchar","A data type that holds a set number of characters in a field and allows for Unicode characters.","Tip text cu suport Unicode. Ocupă doi octeți pe caracter."],["Object Explorer","A window in SQL Server that shows databases and their objects within each server instance.","Fereastra SQL Server cu lista bazelor de date și a obiectelor lor."],["One-to-Many Relationship","An entity relationship between a primary key in one entity and a foreign key in another entity.","Relația cheii primare a unei entități cu cheia externă a alteia. Cel mai frecvent tip de relație."],["One-to-One Relationship","A relationship between two primary keys in two entities.","Relația dintre două chei primare ale două entități."],["ORDER BY","A keyword set used to sort data within a dataset.","Setul de cuvinte-cheie pentru sortarea datelor. Implicit, crescător."],["Orphaned Record","A record entered in the many table of a one-to-many relationship that has a value in its foreign key that does not exist in the primary key of the entity used on the other side of the relationship.","Înregistrare de partea „multe”, a cărei cheie externă arată spre o valoare inexistentă."],["Outer Join","A join that shows all records from one side of the join and related records from the other side of the join.","Îmbinare care arată toate înregistrările dintr-o parte și pe cele legate din cealaltă."],["Output Parameter","A value that is returned from running a stored procedure.","Valoarea care se întoarce în afară după executarea unei proceduri stocate."],["Parameter","A value specified, usually by a user, that is used to retrieve data using that value when running a stored procedure.","Valoarea dată de utilizator și folosită de procedură pentru obținerea datelor."],["Primary Key","An entity field that ensures that every record in an entity is unique.","Câmp care garantează unicitatea fiecărei înregistrări. Nu poate fi gol."],["Principle of Least Privilege","A permissions principle that ensures people with access to a database have the permissions they need to perform their job duties, but those permissions are the only ones they have.","Principiul privilegiului minim: omul are exact acele drepturi care îi trebuie pentru muncă, și niciunul în plus."],["Query","A statement used to retrieve desired data from a database.","Propoziție pentru obținerea datelor necesare din bază."],["Record","A block of data with values for each field or column. Also known as a row.","Bloc de date cu valori pentru fiecare câmp. A doua denumire este row, rând."],["Referential Integrity","In a one-to-many relationship, assurance that a value is entered in the primary key of the entity being used as the one side of the relationship before that same value is allowed on the many side of the relationship.","Integritatea referențială: valoarea trebuie să apară de partea „unu” mai devreme decât va fi permisă de partea „multe”."],["Relational Database","A database with entities that have data that can be joined with each other through a field common to both entities.","Bază de date ale cărei tabele pot fi unite printr-un câmp comun."],["Restore","The process of replacing lost or corrupt data with a copy of that data.","Procesul de înlocuire a datelor pierdute sau deteriorate cu copia lor de rezervă."],["RETURN","A keyword used to generate and hold a value that is the result of a stored procedure.","Cuvânt-cheie care formează și reține rezultatul unei proceduri stocate."],["REVOKE","A SQL statement used to take back a permission that was previously granted.","Comanda care ia înapoi un drept acordat anterior."],["Right Outer Join","A join that shows all records from the second table defined in a join.","Îmbinare care arată toate înregistrările din al doilea tabel al îmbinării."],["Role","A defined set of permissions within a database.","Un set anumit de drepturi în baza de date, acordat deodată în întregime."],["Row","A block of data with values for each field or column. Also known as a record.","Rând de date cu valori pentru fiecare coloană. A doua denumire este record."],["Runtime Error","An error that occurs during the execution of code.","Greșeală care apare în timpul executării codului: obiectul lipsește, o restricție este încălcată, împărțire la zero."],["Schema","A named container inside a database used to group related objects. Tables are referenced as schema.table.","Dosar cu nume în interiorul bazei, care grupează obiectele. Tabelele se scriu ca schema.tabel."],["SELECT","A SQL keyword used to retrieve data from a database.","Cuvânt-cheie pentru obținerea datelor din bază."],["SELECT INTO","A SQL statement that copies records from one entity into a new entity.","Propoziție care copiază înregistrări într-o entitate nouă, creând-o din mers."],["Self Join","A join that relates two fields from the same entity to each other.","Îmbinare care leagă două câmpuri ale aceleiași entități. Cere alias-uri."],["SQL","Structured Query Language (SQL) is a keyword-based language used in writing queries on data within databases.","Limbajul interogărilor structurate: limbaj pe cuvinte-cheie pentru lucrul cu datele din baze."],["SQL Keyword","A word, part of the language aspect of SQL, used to formulate part of a SQL statement.","Cuvânt al limbajului SQL, din care se alcătuiește propoziția interogării."],["SQL Server","A server app that stores databases and all related database settings.","Program-server care păstrează bazele de date și toate setările lor."],["SQL Statement","A block of code that serves either as a data query or a command to add, update, or remove data or an object from a database.","Bloc de cod: fie o interogare de date, fie o comandă de modificare a datelor ori a unui obiect al bazei."],["Stored Procedure","A SQL server object that is a saved query for retrieving or changing data.","Obiect SQL Server: interogare salvată pentru obținerea sau modificarea datelor. Se pornește prin EXEC."],["STR","A SQL keyword used to convert a number to a string.","Cuvânt-cheie pentru transformarea unui număr într-un șir de text."],["Subquery","A query placed inside another query. The inner query runs first and its result is used by the outer query.","Interogare în interiorul interogării. Mai întâi se execută cea interioară, iar rezultatul ei îl folosește cea exterioară."],["SUM","A SQL keyword used to total the values for one or more fields within a query.","Cuvânt-cheie pentru adunarea valorilor unuia sau mai multor câmpuri."],["Syntax Error","An error in coding usually caused by improper punctuation, incorrect spelling of a keyword, or an incorrect ordering of keywords within a code block.","Greșeală de cod din cauza punctuației, a scrierii unui cuvânt-cheie sau a ordinii lor. Interogarea nu pornește."],["Table","A database object with organized rows and columns of data. Also known as an entity.","Obiect al bazei de date cu rânduri și coloane. A doua denumire este entity, entitate."],["TOP","A SQL keyword used to limit the number of records returned in a query.","Cuvânt-cheie care limitează numărul de înregistrări întoarse. Analogul lui LIMIT din alte SGBD."],["TRUNCATE TABLE","A SQL keyword set used to empty all the data from an entity.","Setul de cuvinte-cheie care golește complet tabelul. Structura rămâne."],["Unicode","A character type that allows for numbers, letters, and symbols, including foreign language symbols.","Setul de caractere care admite cifre, litere și semne, inclusiv caracterele altor limbi."],["UNION","A keyword used to return two or more entities as a single dataset within a query.","Cuvânt-cheie care unește două sau mai multe entități într-un singur set de date. Scoate duplicatele."],["UNION ALL","A keyword used to combine result sets while keeping every duplicate row.","Unirea seturilor de date păstrând toate duplicatele. Lucrează mai repede decât UNION."],["UPDATE","A SQL keyword used to change data within an entity.","Cuvânt-cheie pentru modificarea datelor dintr-o entitate. Fără WHERE modifică toate rândurile."],["VALUES","A SQL keyword used as part of an INSERT statement that controls what is added to an entity.","Cuvânt-cheie din componența lui INSERT, care stabilește ce anume se adaugă în entitate."],["Varchar","A data type that holds a set number of characters in a field.","Tip text pentru un număr dat de caractere, fără Unicode. Un octet pe caracter."],["View","A SQL Server object that is a saved query for retrieving data.","Obiect SQL Server: interogare salvată pentru obținerea datelor. Datele însele nu le păstrează."],["WHERE","A SQL keyword used to filter records from recordset during a query.","Cuvânt-cheie pentru alegerea înregistrărilor la executarea interogării."],["Wildcard","A symbol used with LIKE to match unknown characters: % matches any number of characters, _ matches exactly one.","Caracter de înlocuire pentru LIKE: % — orice număr de caractere, _ — exact unul."],["WITH GRANT OPTION","An addition to a GRANT statement that allows the recipient to pass the same permission on to other users.","Completare la GRANT: destinatarul poate transmite dreptul primit mai departe altora."]]}};</script>

     gloss:'Dicționar de termeni',glossSub:'Definiția în engleză — exact ca la examen. Mai jos, cu gri — explicația în română.',
     glossFind:'Caută un termen…',terms:'de termeni',block:'Blocul',done:'Învățat',
     prog:'Parcurse {a} din {b}',copy:'Copiază',copied:'Copiat',
     empty:'Nu s-a găsit nimic',print:'Tipărire',top:'Sus',menu:'Meniu',
     head:['Blocul','Tema','Domeniul și obiectivul de examen'],
     foot:'Nexus Insight Academy · Certiport IT Specialist: Databases'}
};

const KW = /\b(SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|ON|GROUP|BY|HAVING|ORDER|ASC|DESC|TOP|LIMIT|OFFSET|FETCH|DISTINCT|UNION|ALL|INTERSECT|EXCEPT|AS|AND|OR|NOT|IN|ANY|SOME|EXISTS|BETWEEN|LIKE|IS|NULL|CASE|WHEN|THEN|ELSE|END|INSERT|INTO|VALUES|UPDATE|SET|DELETE|TRUNCATE|CREATE|ALTER|DROP|ADD|TABLE|VIEW|INDEX|CLUSTERED|NONCLUSTERED|PROCEDURE|PROC|FUNCTION|RETURNS|RETURN|BEGIN|EXEC|EXECUTE|PRIMARY|FOREIGN|KEY|REFERENCES|CONSTRAINT|UNIQUE|CHECK|DEFAULT|IDENTITY|COLUMN|DATABASE|SCHEMA|GRANT|REVOKE|WITH|COUNT|SUM|AVG|MIN|MAX|CAST|CONVERT|GO|USE|INT|VARCHAR|NVARCHAR|CHAR|DECIMAL|NUMERIC|FLOAT|BIT|DATE|DATETIME|TIME|MONEY|TEXT)\b/g;

function hl(s){
  return s.split('\n').map(function(line){
    var i = line.indexOf('--'), cmt = '', code = line;
    if (i >= 0){ code = line.slice(0,i); cmt = '<span class="cm">' + line.slice(i) + '</span>'; }
    var str = [];
    code = code.replace(/'[^']*'/g, function(m){ str.push(m); return '\u0001' + (str.length-1) + '\u0001'; });
    code = code.replace(KW, function(m){ return '<span class="kw">' + m + '</span>'; });
    code = code.replace(/\u0001(\d+)\u0001/g, function(m,k){ return '<span class="st">' + str[k] + '</span>'; });
    return code + cmt;
  }).join('\n');
}

// localStorage can be unavailable when the page is opened straight from disk
function store(k, v){
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }
  catch (e) { return null; }
}
let lang = store('kon.lang') || 'ru';
let done = new Set(JSON.parse(store('kon.done') || '[]'));

const $ = function(s,r){ return (r||document).querySelector(s); };
const $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

function table(head, rows){
  return '<div class="tw"><table><thead><tr>' +
    head.map(function(h){ return '<th>' + h + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div>';
}

function body(items){
  return items.map(function(it){
    if (it.k === 'h')    return '<h3 class="sec">' + it.v + '</h3>';
    if (it.k === 'p')    return '<p>' + it.v + '</p>';
    if (it.k === 'b')    return '<ul class="b">' + it.v.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>';
    if (it.k === 'lead') return '<p class="lead"><b>' + it.label + '</b> ' + it.v + '</p>';
    if (it.k === 'code') return '<div class="code"><button class="cp" data-copy>' + UI[lang].copy + '</button>' + hl(it.v) + '</div>';
    if (it.k === 'table')return table(it.head, it.rows);
    return '';
  }).join('');
}

function render(){
  const D = DATA[lang], T = UI[lang];
  document.documentElement.lang = lang;
  document.title = 'Certiport IT Specialist: Databases · ' + T.sub;
  $('#subt').textContent = T.sub;
  $('#find').placeholder = T.find;
  $('#gfind') && ($('#gfind').placeholder = T.glossFind);
  $('#navttl').textContent = T.map;
  $('#print').textContent = T.print;
  $('#up').title = T.top;

  // hero
  $('#hero').innerHTML =
    '<h1>Certiport IT Specialist: Databases</h1>' +
    '<div class="sub">' + D.subtitle + '</div>' +
    '<div class="tag">' + D.tagline + '</div>' +
    D.intro.map(function(p){ return '<p>' + p + '</p>'; }).join('') +
    '<h3 class="sec" style="color:#cdeff1">' + T.map + '</h3>' +
    table(T.head, D.mapRows);

  // blocks
  $('#blocks').innerHTML = D.blocks.map(function(b){
    return '<section id="b' + b.n + '">' +
      '<div class="hdr"><div class="n">' + b.n + '</div>' +
        '<div style="flex:1;min-width:0"><h2>' + b.title + '</h2><div class="obj">' + b.obj + '</div></div>' +
        '<button class="mark' + (done.has(b.n) ? ' on' : '') + '" data-mark="' + b.n + '">' + T.done + '</button>' +
      '</div>' +
      (b.intro ? '<p>' + b.intro + '</p>' : '') +
      body(b.body) +
      '<div class="cap">' + T.exam + '</div>' +
      '<div class="exam">' + b.exam + '</div>' +
      '<div class="cap">' + T.check + '<span class="sp"></span><button data-all="' + b.n + '">' + T.show + '</button></div>' +
      b.qa.map(function(p){
        return '<div class="qa"><button><span class="ar">›</span><span>' + p[0] + '</span></button>' +
               '<div class="ans">' + p[1] + '</div></div>';
      }).join('') +
    '</section>';
  }).join('');

  // glossary
  $('#gloss').innerHTML =
    '<div class="hdr"><div class="n">A→Z</div>' +
      '<div style="flex:1;min-width:0"><h2>' + T.gloss + '</h2>' +
      '<div class="obj">' + D.gloss.length + ' ' + T.terms + ' · ' + T.glossSub + '</div></div></div>' +
    '<input id="gfind" class="find" placeholder="' + T.glossFind + '">' +
    D.gloss.map(function(g){
      return '<div class="gl"><div class="t">' + g[0] + '</div>' +
             '<div><div class="en">' + g[1] + '</div><div class="xx">' + g[2] + '</div></div></div>';
    }).join('') + '<div class="empty" id="gempty" hidden>' + T.empty + '</div>';

  // nav
  $('#nav').innerHTML = D.blocks.map(function(b){
    return '<a href="#b' + b.n + '" data-n="' + b.n + '" class="' + (done.has(b.n) ? 'done' : '') + '">' +
           '<span class="num">' + b.n + '</span><span>' + b.plain + '</span></a>';
  }).join('') + '<hr><a href="#gloss" data-n="g"><span class="num">A→Z</span><span>' + T.gloss + '</span></a>';

  $('#foot').textContent = T.foot;
  $$('#blocks section, #gloss, #hero').forEach(function(s){ s._html = s.innerHTML; });
  progress(); filter(); spy();
  // honour the address-bar anchor, which points at content rendered only now
  if (location.hash.length > 1){
    const t = document.getElementById(location.hash.slice(1));
    if (t) window.scrollTo({ top: t.offsetTop - 70, behavior: 'instant' });
  }
}

function progress(){
  const n = DATA[lang].blocks.length;
  $('#bar').style.width = (done.size / n * 100) + '%';
  $('#plbl').textContent = UI[lang].prog.replace('{a}', done.size).replace('{b}', n);
}

/* ---------- search ---------- */
function clean(s){ return s.toLowerCase().replace(/ё/g,'е').replace(/[ăâ]/g,'a').replace(/[îi]/g,'i').replace(/ș/g,'s').replace(/ț/g,'t'); }

function markText(root, q){
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const hits = [];
  let node;
  while ((node = walk.nextNode())){
    if (node.parentNode.closest('button')) continue;
    if (clean(node.nodeValue).indexOf(q) >= 0) hits.push(node);
  }
  hits.forEach(function(n){
    const txt = n.nodeValue, low = clean(txt), frag = document.createDocumentFragment();
    let i = 0, p;
    while ((p = low.indexOf(q, i)) >= 0){
      frag.appendChild(document.createTextNode(txt.slice(i, p)));
      const m = document.createElement('mark');
      m.textContent = txt.slice(p, p + q.length);
      frag.appendChild(m);
      i = p + q.length;
    }
    frag.appendChild(document.createTextNode(txt.slice(i)));
    n.parentNode.replaceChild(frag, n);
  });
}

function filter(){
  const q = clean($('#find').value.trim());
  const secs = $$('#blocks section');
  let shown = 0;
  secs.forEach(function(s){
    s.innerHTML = s._html;
    const hit = !q || clean(s.textContent).indexOf(q) >= 0;
    s.classList.toggle('hide', !hit);
    if (hit){ shown++; if (q) markText(s, q); }
  });
  const g = $('#gloss');
  g.innerHTML = g._html;
  const ghit = !q || clean(g.textContent).indexOf(q) >= 0;
  g.classList.toggle('hide', !ghit);
  if (ghit && q) markText(g, q);
  gfilter();
  $('#hero').classList.toggle('hide', !!q);
  $$('#nav a').forEach(function(a){
    const n = a.dataset.n;
    const t = n === 'g' ? g : $('#b' + n);
    a.classList.toggle('hide', t.classList.contains('hide'));
  });
  $('#empty').hidden = !(q && !shown && !ghit);
  progress();
}

function gfilter(){
  const inp = $('#gfind');
  if (!inp) return;
  inp.oninput = gfilter;
  const q = clean(inp.value.trim());
  let n = 0;
  $$('#gloss .gl').forEach(function(r){
    const hit = !q || clean(r.textContent).indexOf(q) >= 0;
    r.classList.toggle('hide', !hit);
    if (hit) n++;
  });
  $('#gempty').hidden = !!n;
}

/* ---------- scroll spy ---------- */
function spy(){
  const y = window.scrollY + 120;
  let cur = null;
  $$('#blocks section, #gloss').forEach(function(s){
    if (!s.classList.contains('hide') && s.offsetTop <= y) cur = s.id;
  });
  $$('#nav a').forEach(function(a){
    a.classList.toggle('on', (a.dataset.n === 'g' ? 'gloss' : 'b' + a.dataset.n) === cur);
  });
  $('#up').classList.toggle('on', window.scrollY > 500);
}

// clipboard API needs a secure context; fall back for file:// pages
function copy(text){
  if (navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text); return; }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  const qa = e.target.closest('.qa > button');
  if (qa){ qa.parentNode.classList.toggle('open'); return; }

  const all = e.target.closest('[data-all]');
  if (all){
    const sec = all.closest('section');
    const open = $$('.qa.open', sec).length < $$('.qa', sec).length;
    $$('.qa', sec).forEach(function(x){ x.classList.toggle('open', open); });
    all.textContent = open ? UI[lang].hide : UI[lang].show;
    return;
  }

  const mk = e.target.closest('[data-mark]');
  if (mk){
    const n = +mk.dataset.mark;
    done.has(n) ? done.delete(n) : done.add(n);
    store('kon.done', JSON.stringify(Array.from(done)));
    mk.classList.toggle('on', done.has(n));
    const nav = $('#nav a[data-n="' + n + '"]');
    nav && nav.classList.toggle('done', done.has(n));
    const sec = mk.closest('section');
    sec._html = sec.innerHTML;
    progress();
    return;
  }

  const cp = e.target.closest('[data-copy]');
  if (cp){
    const box = cp.parentNode.cloneNode(true);
    $$('button', box).forEach(function(b){ b.remove(); });
    copy(box.textContent.replace(/^\n/, ''));
    cp.textContent = UI[lang].copied;
    setTimeout(function(){ cp.textContent = UI[lang].copy; }, 1300);
    return;
  }

  if (e.target.closest('#nav a') && window.innerWidth <= 1000) document.body.classList.remove('nav');
  if (e.target.closest('#burger')) document.body.classList.toggle('nav');
  else if (!e.target.closest('aside')) document.body.classList.remove('nav');
});

$$('.lang button').forEach(function(b){
  b.onclick = function(){
    lang = b.dataset.l;
    store('kon.lang', lang);
    $$('.lang button').forEach(function(x){ x.classList.toggle('on', x.dataset.l === lang); });
    render();
  };
});

let wasEmpty = true;
$('#find').addEventListener('input', function(){
  filter();
  const empty = !$('#find').value.trim();
  if (wasEmpty && !empty) window.scrollTo({ top: 0, behavior: 'instant' });
  wasEmpty = empty;
});
$('#print').onclick = function(){ window.print(); };
$('#up').onclick = function(){ window.scrollTo({ top: 0 }); };
window.addEventListener('scroll', spy, { passive: true });
document.addEventListener('keydown', function(e){
  if (e.key === '/' && e.target.tagName !== 'INPUT'){ e.preventDefault(); $('#find').focus(); }
  if (e.key === 'Escape'){ $('#find').value = ''; filter(); }
});

$$('.lang button').forEach(function(x){ x.classList.toggle('on', x.dataset.l === lang); });
render();
</script>
