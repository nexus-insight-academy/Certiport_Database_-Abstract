ет строки до группировки, HAVING — готовые группы после неё."],["Можно ли написать SUM() в условии WHERE?","Нет. Агрегат допустим только в HAVING."],["Назовите порядок обработки запроса.","FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, TOP."]]},{"n":16,"title":"Изменение данных: INSERT, UPDATE, DELETE","plain":"Изменение данных: INSERT, UPDATE, DELETE","obj":"Domain 4 · цели экзамена 4.1 INSERT · 4.2 UPDATE · 4.3 DELETE","intro":"Домен 4 называется Data Manipulation using DML. До сих пор мы данные только читали — теперь будем их добавлять, менять и удалять.","body":[{"k":"h","v":"16.1. INSERT INTO ... VALUES"},{"k":"p","v":"<b>VALUES</b> — ключевое слово SQL, используемое как часть предложения <code>INSERT</code>, которое определяет, что именно добавляется в сущность."},{"k":"p","v":"Сначала перечисляют столбцы, потом значения в том же порядке. Одной командой можно добавить сразу несколько строк."},{"k":"code","v":"INSERT INTO BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\nVALUES\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)","raw":"INSERT INTO BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\nVALUES\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)"},{"k":"h","v":"16.2. INSERT INTO ... SELECT и SELECT INTO"},{"k":"p","v":"<b>INSERT INTO</b> — предложение SQL, копирующее записи из одной сущности в другую. Целевая таблица при этом должна уже существовать."},{"k":"p","v":"<b>SELECT INTO</b> — предложение SQL, копирующее записи из одной сущности в <b>новую</b> сущность. Таблица создаётся автоматически."},{"k":"code","v":"-- копирует в существующую таблицу\nINSERT INTO BikeRepairsTest\nSELECT * FROM BikeRepairs\n\n-- создаёт новую таблицу и копирует в неё\nSELECT * INTO BikeRepairsArchive FROM BikeRepairs","raw":"-- копирует в существующую таблицу\nINSERT INTO BikeRepairsTest\nSELECT * FROM BikeRepairs\n\n-- создаёт новую таблицу и копирует в неё\nSELECT * INTO BikeRepairsArchive FROM BikeRepairs"},{"k":"lead","label":"Как запомнить:","v":"<code>INSERT INTO ... SELECT</code> — таблица уже есть. <code>SELECT ... INTO</code> — таблица создаётся на лету."},{"k":"h","v":"16.3. UPDATE"},{"k":"p","v":"<b>UPDATE</b> — ключевое слово SQL, используемое для изменения данных внутри сущности. Синтаксис: <code>UPDATE</code> таблица, <code>SET</code> что менять, <code>WHERE</code> в каких строках."},{"k":"code","v":"UPDATE BikeRepairs\nSET StartDate = '2021-07-02'\nWHERE BikeRepairID = 2","raw":"UPDATE BikeRepairs\nSET StartDate = '2021-07-02'\nWHERE BikeRepairID = 2"},{"k":"lead","label":"Предупреждение.","v":"<code>UPDATE</code> без <code>WHERE</code> изменит <b>все строки таблицы</b>. Ошибку заметить трудно, а откатить без резервной копии невозможно."},{"k":"h","v":"16.4. DELETE и TRUNCATE TABLE"},{"k":"p","v":"<b>DELETE</b> — ключевое слово SQL, используемое для удаления данных из сущности. Как и <code>UPDATE</code>, без <code>WHERE</code> оно затрагивает всю таблицу."},{"k":"p","v":"<b>TRUNCATE TABLE</b> — набор ключевых слов, опустошающий сущность полностью. Структура таблицы при этом остаётся."},{"k":"code","v":"DELETE FROM BikeRepairsTest\nWHERE BikeRepairID = 5\n\nTRUNCATE TABLE BikeRepairsTest","raw":"DELETE FROM BikeRepairsTest\nWHERE BikeRepairID = 5\n\nTRUNCATE TABLE BikeRepairsTest"},{"k":"h","v":"16.5. Три способа удалить"},{"k":"table","head":["Признак","DELETE","TRUNCATE TABLE","DROP TABLE"],"rows":[["Группа команд","DML","DDL","DDL"],["Удаляет данные","Да","Да, все","Да"],["Удаляет структуру","Нет","Нет","Да"],["Можно с WHERE","Да","Нет","Нет"],["Что останется","Пустая или урезанная таблица","Пустая таблица","Ничего"]]}],"exam":"INSERT INTO копирует записи из одной сущности в другую — целевая таблица должна существовать. SELECT INTO копирует записи в новую сущность, создавая её. VALUES определяет, что именно добавляется. UPDATE меняет данные внутри сущности; без WHERE изменятся все строки. DELETE удаляет данные из сущности; TRUNCATE TABLE опустошает её полностью, но оставляет структуру. DROP TABLE удаляет и данные, и структуру.","qa":[["Какое ключевое слово определяет, что добавляется при вставке?","VALUES."],["Чем INSERT INTO SELECT отличается от SELECT INTO?","Первое копирует в существующую таблицу, второе создаёт новую."],["Что произойдёт при UPDATE без WHERE?","Изменятся все строки таблицы."],["Что делает TRUNCATE TABLE?","Полностью опустошает таблицу, оставляя её структуру."],["Можно ли использовать WHERE с TRUNCATE TABLE?","Нет."],["Что останется от таблицы после TRUNCATE, а что после DROP?","После TRUNCATE — пустая таблица, после DROP — ничего."],["К какой группе относится DELETE — DDL или DML?","К DML."]]},{"n":17,"title":"Поиск ошибок в запросах","plain":"Поиск ошибок в запросах","obj":"Domain 5 · цели экзамена 5.1 · 5.2 · 5.3 Troubleshoot query failures","intro":"Домен 5 не вводит нового материала. Он проверяет, умеете ли вы найти ошибку в чужом запросе — по всем командам, которые прошли раньше. На экзамене такой вопрос выглядит как код с просьбой указать строку с ошибкой.","body":[{"k":"h","v":"17.1. Два класса ошибок"},{"k":"b","v":["<b>Syntax error</b> — ошибка в коде, обычно вызванная неправильной пунктуацией, неверным написанием ключевого слова или неправильным порядком ключевых слов в блоке кода. Ловится <b>до</b> выполнения.","<b>Runtime error</b> — ошибка, возникающая <b>во время</b> выполнения кода. Синтаксис при этом верный, но команда не может отработать."]},{"k":"lead","label":"Как различить:","v":"если запрос не запустился вообще — это syntax error. Если запустился и упал на данных — runtime error."},{"k":"p","v":"Типичные причины runtime-ошибок: таблицы или столбца не существует, нарушено ограничение (<code>NOT NULL</code>, <code>PRIMARY KEY</code>, <code>FOREIGN KEY</code>), тип данных не подходит, деление на ноль."},{"k":"h","v":"17.2. Ошибки в работе с объектами"},{"k":"code","v":"ALTER BikeRepairs\nADD COLUMN EmployeeID int","raw":"ALTER BikeRepairs\nADD COLUMN EmployeeID int"},{"k":"p","v":"Здесь две ошибки: пропущено слово <code>TABLE</code> после <code>ALTER</code>, и в T-SQL при добавлении столбца не пишут слово <code>COLUMN</code>. Правильно:"},{"k":"code","v":"ALTER TABLE BikeRepairs\nADD EmployeeID int","raw":"ALTER TABLE BikeRepairs\nADD EmployeeID int"},{"k":"h","v":"17.3. Ошибки в выборке данных"},{"k":"code","v":"SELECT Sales.Customer.CustomerID,\n       Sales.Customer.AccountNumber,\n       OrderDate,\n       Status,\nFROM Sales.Customer\nJOIN Sales.SalesOrderHeader\n  ON Sales.Customer.CustomerID = Sales.SalesOrderHeader.CustomerID","raw":"SELECT Sales.Customer.CustomerID,\n       Sales.Customer.AccountNumber,\n       OrderDate,\n       Status,\nFROM Sales.Customer\nJOIN Sales.SalesOrderHeader\n  ON Sales.Customer.CustomerID = Sales.SalesOrderHeader.CustomerID"},{"k":"p","v":"Лишняя запятая после <code>Status</code>, прямо перед <code>FROM</code>. Классическая синтаксическая ошибка: список столбцов закончился, а запятая осталась."},{"k":"h","v":"17.4. Ошибки при изменении данных"},{"k":"code","v":"INSERT BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)","raw":"INSERT BikeRepairs\n    (BikeRepairID, CustomerID, StartDate, EstHour, EstRate)\n    (1, 101, '2021-07-01', 5, 20),\n    (2, 101, '2021-07-01', 2, 20)"},{"k":"p","v":"Пропущено ключевое слово <code>VALUES</code> между списком столбцов и списком значений."},{"k":"h","v":"17.5. Порядок проверки чужого запроса"},{"k":"b","v":["Проверьте запятые: лишняя перед <code>FROM</code>, лишняя после последнего столбца в <code>CREATE TABLE</code>, пропущенная между столбцами.","Проверьте кавычки: текст должен быть в одинарных кавычках, числа — без.","Проверьте, все ли ключевые слова на месте: <code>TABLE</code> после <code>ALTER</code>, <code>VALUES</code> перед списком значений, <code>FROM</code> в <code>DELETE FROM</code>.","Проверьте порядок: <code>WHERE</code> идёт после <code>FROM</code>, <code>GROUP BY</code> после <code>WHERE</code>, <code>HAVING</code> после <code>GROUP BY</code>, <code>ORDER BY</code> в самом конце.","Проверьте <code>GROUP BY</code>: все ли неагрегированные столбцы из <code>SELECT</code> там перечислены.","Проверьте сравнение с <code>NULL</code>: должно быть <code>IS NULL</code>, а не <code>= NULL</code>."]},{"k":"table","head":["Что видите","Класс ошибки","В чём дело"],"rows":[["Запятая перед FROM","Syntax","Лишний разделитель в списке столбцов"],["ALTER без TABLE","Syntax","Пропущено ключевое слово"],["INSERT без VALUES","Syntax","Пропущено ключевое слово"],["Неверно написано SELECT","Syntax","Опечатка в ключевом слове"],["Таблицы не существует","Runtime","Неверное имя объекта"],["Нарушение внешнего ключа","Runtime","Нет записи в родительской таблице"],["Вставка NULL в NOT NULL","Runtime","Нарушено ограничение"],["Деление на ноль","Runtime","Ошибка на данных"]]}],"exam":"Syntax error — ошибка кода из-за неправильной пунктуации, неверного написания ключевого слова или неправильного порядка ключевых слов; она не даёт запросу запуститься. Runtime error возникает во время выполнения: объекта нет, нарушено ограничение, не подходит тип, деление на ноль. Проверяя чужой запрос, начинайте с запятых, кавычек, пропущенных ключевых слов и порядка предложений.","qa":[["Что такое syntax error?","Ошибка в коде из-за пунктуации, написания ключевого слова или порядка ключевых слов."],["Что такое runtime error?","Ошибка, возникающая во время выполнения кода."],["Запрос не запустился вообще — какой это класс ошибки?","Syntax error."],["Запрос запустился и упал при вставке — какой это класс?","Runtime error."],["Найдите ошибку: ALTER BikeRepairs ADD COLUMN EmployeeID int.","Пропущено слово TABLE, и слово COLUMN здесь лишнее."],["Найдите ошибку: список столбцов, затем запятая, затем FROM.","Лишняя запятая перед FROM."],["Найдите ошибку: INSERT, список столбцов, сразу список значений.","Пропущено ключевое слово VALUES."],["Что не так в условии WHERE MiddleName = NULL?","Сравнение с NULL через знак равенства. Нужно IS NULL."]]}],"gloss":[["1NF","First Normal Form (1NF) is a form of normalization in which each field has a single value so that data can be sorted in any way possible.","Первая нормальная форма: в каждом поле одно значение, поэтому данные можно сортировать любым способом."],["2NF","Second Normal Form (2NF) is a form of normalization in which a table is in 1NF and every non-key column depends on the whole composite key rather than on part of it.","Вторая нормальная форма: таблица уже в 1NF, и каждый неключевой столбец зависит от всего составного ключа, а не от его части."],["3NF","Third Normal Form (3NF) is a form of normalization in which a value change in a non-key column in one table does not necessitate a change in another non-key column within an entity.","Третья нормальная форма: изменение неключевого столбца не требует изменения другого неключевого столбца в той же сущности."],["Alias","A replacement name for a column or table.","Заменяющее имя для столбца или таблицы. Задаётся словом AS."],["ALL","A SQL keyword used to display records within a query if all records within that query match related records in a subquery.","Ключевое слово: условие выполняется, только если совпадение есть со всеми записями подзапроса."],["ALTER","A SQL keyword used to change the definition of a database object.","Ключевое слово для изменения определения объекта базы данных."],["ANSI SQL","The standardized version of SQL shared by MySQL, Microsoft SQL Server, Oracle, and other relational database systems. Exam questions are written in ANSI SQL.","Стандартный вариант SQL, общий для MySQL, SQL Server, Oracle и других СУБД. Вопросы экзамена сформулированы именно на нём."],["ANY","A SQL keyword used to find matching records from a query to a subquery.","Ключевое слово: условие выполняется при совпадении хотя бы с одной записью подзапроса."],["Auditing","The practice of recording who accessed the database, when, and what actions they performed, so that activity can be reviewed after the fact.","Аудит: журнал того, кто, когда и что делал в базе. Не запрещает действия, а фиксирует их."],["AVG","A SQL keyword used to get the average amounts for one or more fields within a query.","Ключевое слово для вычисления среднего значения по одному или нескольким полям."],["Backup","A copy of data stored elsewhere to be restored if original data is lost or damaged.","Резервная копия данных, хранящаяся отдельно, чтобы восстановить их при потере или повреждении."],["BETWEEN","A SQL keyword used to define a range of values used for a filter within a query.","Ключевое слово, задающее диапазон значений для фильтра. Обе границы включаются."],["Bit","A data type that is either a zero or a one.","Тип данных, хранящий ноль или единицу."],["Boolean","A data type that allows for values to be either true or false.","Тип данных со значениями «истина» или «ложь». В SQL Server его роль выполняет bit."],["Byte","A unit of measurement used to determine how much memory a piece of data will take.","Единица измерения объёма памяти, который занимают данные."],["Cartesian Product","A combining of two unrelated tables within a query.","Соединение двух несвязанных таблиц: каждая строка с каждой. Число строк перемножается."],["Clustered Index","An index based on the primary key of an entity.","Индекс по первичному ключу. Задаёт физический порядок строк, поэтому в таблице может быть только один."],["Column","A property that defines data in an entity. Also known as a field.","Свойство, описывающее данные в сущности. Второе название — field, поле."],["Comparison Operator","A symbol used to define a filter within a query, for example, the greater than or equal to symbol (&gt;=).","Символ, задающий условие фильтра: =, &lt;&gt;, &gt;, &lt;, &gt;=, &lt;=."],["Composite Key","A primary key consisting of two or more fields. Also known as a compound key.","Первичный ключ из двух и более полей. Второе название — compound key."],["Compound Key","A primary key consisting of two or more fields. Also known as a composite key.","То же самое, что composite key: ключ из нескольких полей."],["CONCAT()","A SQL function that joins two or more text values into one. Unlike the + operator, it treats NULL as an empty string.","Функция склеивания текста. В отличие от оператора +, обрабатывает NULL как пустую строку."],["Concatenation","The joining of two or more text values into a single value, using either the + operator or the CONCAT() function.","Склеивание текстовых значений в одно — оператором + или функцией CONCAT()."],["Constraint","A limitation on what can be entered in a data field within an entity.","Ограничение на то, что можно ввести в поле сущности."],["COUNT","A SQL keyword used to show the number of records within a query.","Ключевое слово для подсчёта количества записей в запросе."],["CREATE","A SQL keyword used to add an object to a database or add an entire database to an instance of SQL Server.","Ключевое слово для создания объекта базы данных или самой базы."],["Cross Join","A join that returns every combination of rows from two tables, producing a Cartesian product.","Соединение, возвращающее все возможные комбинации строк двух таблиц — декартов продукт."],["Data","Information that is organized, entered into files, and then retrievable as needed.","Информация, организованная, внесённая в файлы и доступная для получения по мере необходимости."],["Data Masking","A protection measure that hides part of a stored value when it is displayed, while the real value remains in the database.","Маскирование: настоящее значение остаётся в базе, но показывается скрытым, например **** 1234."],["Data Type","A setting that defines what kind of data can be entered in a field, such as a number, date, or text string.","Настройка, определяющая, какие данные можно ввести в поле: число, дату или текст."],["Database","A file that stores data and allows people to search and create reports from the data.","Файл, который хранит данные и позволяет искать по ним и строить отчёты."],["Datetime","A data type that holds dates and times.","Тип данных для хранения даты и времени."],["DDL","Data Definition Language — the group of SQL statements that define or change database structure: CREATE, ALTER, DROP, TRUNCATE.","Язык определения данных: команды, меняющие структуру базы, а не сами данные."],["DELETE","A SQL keyword used to remove data from an entity.","Ключевое слово для удаления данных из сущности. Без WHERE удаляет все строки."],["Differential Backup","A backup of data that has changed since the last full backup.","Резервная копия данных, изменившихся со времени последней полной копии."],["DISTINCT","A keyword used to return records without duplicate values among fields specified in a query.","Ключевое слово, возвращающее записи без повторяющихся значений среди указанных полей."],["DML","Data Manipulation Language — the group of SQL statements that work with the data itself: SELECT, INSERT, UPDATE, DELETE.","Язык манипулирования данными: команды, работающие с самими данными, а не со структурой."],["DROP","A SQL keyword used to remove a database object.","Ключевое слово для удаления объекта базы данных вместе со структурой."],["Encryption","A protection measure that converts data into an unreadable form which can be converted back only with the correct key.","Шифрование: данные становятся нечитаемыми, но их можно вернуть обратно при наличии ключа."],["Entity","A database object with organized rows and columns as data. Also known as a table.","Объект базы данных со строками и столбцами. Второе название — table, таблица."],["Entry","Adding a row of data to an entity.","Добавление строки данных в сущность."],["ERD","An Entity Relationship Diagram (ERD) is a visual representation of a database, its entities, and the relationships among those entities.","Диаграмма «сущность — связь»: наглядная схема базы, её таблиц и связей между ними."],["EXEC","A SQL command used to run a stored procedure.","Команда для запуска хранимой процедуры."],["Field","A property that defines data in an entity. Also known as a column.","Свойство, описывающее данные в сущности. Второе название — column, столбец."],["Foreign Key","An entity field used to help create a one-to-many relationship between entities.","Поле, создающее связь «один ко многим». Всегда находится на стороне «многих»."],["Full Backup","A backup of an entire database.","Резервная копия всей базы данных целиком."],["Full Outer Join","A join that shows all records from both tables within a defined join.","Соединение, показывающее все записи из обеих таблиц."],["GRANT","A SQL statement used to give a user or a role permission on a database object.","Команда выдачи права пользователю или роли на объект базы данных."],["GROUP BY","A SQL keyword set used to define fields that should be aggregated when aggregates are used within a query.","Набор ключевых слов, задающий поля, по которым выполняется агрегация."],["Hashing","A protection measure that converts data into a fixed-length value that cannot be converted back to the original.","Хеширование: необратимое преобразование данных. Так хранят пароли."],["HAVING","A SQL keyword used to filter grouped results after aggregation has been applied.","Ключевое слово, фильтрующее уже сгруппированный результат. Только здесь допустимы агрегатные функции."],["IN","A SQL keyword used to define multiple values used for filtering criteria within a query.","Ключевое слово, задающее список значений для фильтра. Короткая замена цепочке OR."],["Index","A virtual table used to sort information in an entity and make that information easier to retrieve than without the index.","Виртуальная таблица, упорядочивающая данные и ускоряющая их получение."],["Inner Join","A join that shows related records from both tables within the join.","Соединение, показывающее только связанные записи из обеих таблиц."],["Input Parameter","A value a person enters to use as a filter when running a stored procedure.","Значение, которое человек вводит как фильтр при запуске хранимой процедуры."],["INSERT INTO","A SQL statement that copies records from one entity to another.","Предложение, копирующее записи из одной сущности в другую. Целевая таблица должна существовать."],["Integer","A data type consisting of whole numbers.","Тип данных для целых чисел. Int занимает 4 байта, tinyint — 1 байт."],["INTERSECT","A keyword used to return matching records between two entities.","Ключевое слово, возвращающее только совпадающие записи двух наборов."],["IS NULL","A SQL condition used to find rows where a field has no value. NULL cannot be tested with the equals sign.","Условие для поиска пустых полей. Через знак равенства NULL проверить нельзя."],["Join","The combining of two entities within a single query, with data being related on a common field between the two entities.","Объединение двух сущностей в одном запросе по общему полю."],["Left Outer Join","A join that shows all records from the first table defined in a join.","Соединение, показывающее все записи из первой таблицы соединения."],["LIKE","A SQL keyword that allows for the use of wildcards to return approximate matches of criteria within a query.","Ключевое слово, позволяющее искать по шаблону с подстановочными знаками."],["LIMIT","A SQL keyword used in MySQL and PostgreSQL to restrict the number of rows returned. SQL Server uses TOP for the same purpose.","Ограничение числа строк в MySQL и PostgreSQL. В SQL Server ту же роль играет TOP."],["MAX","A SQL keyword used to get the largest value within a range of values.","Ключевое слово для получения наибольшего значения."],["MIN","A SQL keyword used to get the smallest value within a range of values.","Ключевое слово для получения наименьшего значения."],["Nonclustered Index","An index based on an entity field that is not the primary key of an entity.","Индекс по полю, не являющемуся первичным ключом. Таких индексов в таблице может быть несколько."],["Normalization","The process of ensuring that an entity in a database can work with other entities as needed from an organization and relationship standpoint.","Процесс приведения таблиц в порядок, чтобы они правильно работали друг с другом."],["NOT IN","A SQL keyword set used to return records whose value does not appear in a specified list of values.","Условие: значение не входит ни в один из перечисленных вариантов."],["NOT NULL","A column setting that requires a value to be entered; the field cannot be left empty.","Настройка столбца, требующая обязательного заполнения поля."],["NULL","A SQL keyword used to indicate an empty value within a field.","Ключевое слово, обозначающее пустое значение — отсутствие данных, а не ноль."],["NULLIF()","A SQL function that returns NULL when two values are equal and the first value when they differ. Commonly used to prevent division by zero.","Функция, возвращающая NULL при равенстве значений. Чаще всего защищает от деления на ноль."],["Nvarchar","A data type that holds a set number of characters in a field and allows for Unicode characters.","Текстовый тип с поддержкой Unicode. Занимает два байта на символ."],["Object Explorer","A window in SQL Server that shows databases and their objects within each server instance.","Окно SQL Server со списком баз данных и их объектов."],["One-to-Many Relationship","An entity relationship between a primary key in one entity and a foreign key in another entity.","Связь первичного ключа одной сущности с внешним ключом другой. Самый частый тип связи."],["One-to-One Relationship","A relationship between two primary keys in two entities.","Связь между двумя первичными ключами двух сущностей."],["ORDER BY","A keyword set used to sort data within a dataset.","Набор ключевых слов для сортировки данных. По умолчанию по возрастанию."],["Orphaned Record","A record entered in the many table of a one-to-many relationship that has a value in its foreign key that does not exist in the primary key of the entity used on the other side of the relationship.","Запись на стороне «многих», внешний ключ которой указывает на несуществующее значение."],["Outer Join","A join that shows all records from one side of the join and related records from the other side of the join.","Соединение, показывающее все записи с одной стороны и связанные — с другой."],["Output Parameter","A value that is returned from running a stored procedure.","Значение, которое возвращается наружу после выполнения хранимой процедуры."],["Parameter","A value specified, usually by a user, that is used to retrieve data using that value when running a stored procedure.","Значение, задаваемое пользователем и используемое процедурой для получения данных."],["Primary Key","An entity field that ensures that every record in an entity is unique.","Поле, гарантирующее уникальность каждой записи. Не может быть пустым."],["Principle of Least Privilege","A permissions principle that ensures people with access to a database have the permissions they need to perform their job duties, but those permissions are the only ones they have.","Принцип наименьших привилегий: у человека есть ровно те права, что нужны для работы, и никаких других."],["Query","A statement used to retrieve desired data from a database.","Предложение для получения нужных данных из базы."],["Record","A block of data with values for each field or column. Also known as a row.","Блок данных со значениями для каждого поля. Второе название — row, строка."],["Referential Integrity","In a one-to-many relationship, assurance that a value is entered in the primary key of the entity being used as the one side of the relationship before that same value is allowed on the many side of the relationship.","Ссылочная целостность: значение должно появиться на стороне «один» раньше, чем его разрешат на стороне «многие»."],["Relational Database","A database with entities that have data that can be joined with each other through a field common to both entities.","База данных, таблицы которой можно соединять через общее для них поле."],["Restore","The process of replacing lost or corrupt data with a copy of that data.","Процесс замены потерянных или повреждённых данных их резервной копией."],["RETURN","A keyword used to generate and hold a value that is the result of a stored procedure.","Ключевое слово, формирующее и удерживающее результат хранимой процедуры."],["REVOKE","A SQL statement used to take back a permission that was previously granted.","Команда, отбирающая ранее выданное право."],["Right Outer Join","A join that shows all records from the second table defined in a join.","Соединение, показывающее все записи из второй таблицы соединения."],["Role","A defined set of permissions within a database.","Определённый набор прав внутри базы данных, выдаваемый сразу целиком."],["Row","A block of data with values for each field or column. Also known as a record.","Строка данных со значениями для каждого столбца. Второе название — record."],["Runtime Error","An error that occurs during the execution of code.","Ошибка, возникающая во время выполнения кода: нет объекта, нарушено ограничение, деление на ноль."],["Schema","A named container inside a database used to group related objects. Tables are referenced as schema.table.","Именованная папка внутри базы, группирующая объекты. Таблицы записывают как схема.таблица."],["SELECT","A SQL keyword used to retrieve data from a database.","Ключевое слово для получения данных из базы."],["SELECT INTO","A SQL statement that copies records from one entity into a new entity.","Предложение, копирующее записи в новую сущность, создавая её на лету."],["Self Join","A join that relates two fields from the same entity to each other.","Соединение, связывающее два поля одной и той же сущности. Требует псевдонимов."],["SQL","Structured Query Language (SQL) is a keyword-based language used in writing queries on data within databases.","Язык структурированных запросов: язык на ключевых словах для работы с данными в базах."],["SQL Keyword","A word, part of the language aspect of SQL, used to formulate part of a SQL statement.","Слово языка SQL, из которых составляется предложение запроса."],["SQL Server","A server app that stores databases and all related database settings.","Серверная программа, хранящая базы данных и все их настройки."],["SQL Statement","A block of code that serves either as a data query or a command to add, update, or remove data or an object from a database.","Блок кода: либо запрос данных, либо команда изменения данных или объекта базы."],["Stored Procedure","A SQL server object that is a saved query for retrieving or changing data.","Объект SQL Server: сохранённый запрос для получения или изменения данных. Запускается через EXEC."],["STR","A SQL keyword used to convert a number to a string.","Ключевое слово для преобразования числа в строку."],["Subquery","A query placed inside another query. The inner query runs first and its result is used by the outer query.","Запрос внутри запроса. Сначала выполняется внутренний, его результат использует внешний."],["SUM","A SQL keyword used to total the values for one or more fields within a query.","Ключевое слово для суммирования значений одного или нескольких полей."],["Syntax Error","An error in coding usually caused by improper punctuation, incorrect spelling of a keyword, or an incorrect ordering of keywords within a code block.","Ошибка кода из-за пунктуации, написания ключевого слова или их порядка. Запрос не запускается."],["Table","A database object with organized rows and columns of data. Also known as an entity.","Объект базы данных со строками и столбцами. Второе название — entity, сущность."],["TOP","A SQL keyword used to limit the number of records returned in a query.","Ключевое слово, ограничивающее число возвращаемых записей. Аналог LIMIT в других СУБД."],["TRUNCATE TABLE","A SQL keyword set used to empty all the data from an entity.","Набор ключевых слов, полностью опустошающий таблицу. Структура остаётся."],["Unicode","A character type that allows for numbers, letters, and symbols, including foreign language symbols.","Набор символов, допускающий цифры, буквы и знаки, включая символы других языков."],["UNION","A keyword used to return two or more entities as a single dataset within a query.","Ключевое слово, объединяющее две и более сущности в один набор данных. Убирает дубликаты."],["UNION ALL","A keyword used to combine result sets while keeping every duplicate row.","Объединение наборов данных с сохранением всех повторов. Работает быстрее UNION."],["UPDATE","A SQL keyword used to change data within an entity.","Ключевое слово для изменения данных в сущности. Без WHERE изменяет все строки."],["VALUES","A SQL keyword used as part of an INSERT statement that controls what is added to an entity.","Ключевое слово в составе INSERT, определяющее, что именно добавляется в сущность."],["Varchar","A data type that holds a set number of characters in a field.","Текстовый тип на заданное число символов, без Unicode. Один байт на символ."],["View","A SQL Server object that is a saved query for retrieving data.","Объект SQL Server: сохранённый запрос для получения данных. Сами данные не хранит."],["WHERE","A SQL keyword used to filter records from recordset during a query.","Ключевое слово для отбора записей при выполнении запроса."],["Wildcard","A symbol used with LIKE to match unknown characters: % matches any number of characters, _ matches exactly one.","Подстановочный знак для LIKE: % — любое число символов, _ — ровно один."],["WITH GRANT OPTION","An addition to a GRANT statement that allows the recipient to pass the same permission on to other users.","Дополнение к GRANT: получатель может передавать полученное право дальше другим."]]},"ro":{"subtitle":"Caiet de lucru pentru elevi","tagline":"Blocurile 1–17 · toate cele cinci domenii · obiectivele în redacția din mai 2025","intro":["Acest caiet cuprinde tot examenul IT Specialist Databases. Materialul este împărțit în șaptesprezece blocuri, fiecare dintre ele acoperind un obiectiv de examen. În interiorul blocului vine mai întâi analiza noțiunilor, apoi un tabel recapitulativ, apoi două secțiuni obligatorii: „Pentru examen”, cu formulările care trebuie știute cuvânt cu cuvânt, și „Verificați-vă”, cu întrebări scurte pentru autoverificare. La sfârșit este dicționarul tuturor termenilor: sus definiția în engleză, în formularea în care termenul apare la examen, jos, cu gri — același lucru în română.","Examenul se susține în limba engleză, iar sintaxa din întrebări este dată în ANSI SQL. De aceea toate cuvintele-cheie, denumirile comenzilor și definițiile din caiet sunt lăsate în engleză: anume în această formă ele vor apărea pe ecran în timpul examenului."],"mapRows":[["1","Tabele, rânduri și coloane","1.1 Design tables for storing data"],["2","Cheia primară","1.2 Identify the appropriate primary key"],["3","Tipurile de date","1.3 Choose data types to meet requirements"],["4","Relațiile dintre tabele și ERD","1.4 Design relationships between tables"],["5","Normalizarea","1.5 Normalize a database"],["6","Protecția datelor","1.6 Identify data protection measures"],["7","CREATE, ALTER și DROP: tabele","2.1 Create, alter, and drop tables"],["8","Views (reprezentările)","2.2 Create, alter, and drop views"],["9","Proceduri stocate și funcții","2.3 Stored procedures and functions"],["10","Indexurile","2.4 Clustered vs. non-clustered indexes"],["11","Îmbinarea tabelelor: JOIN","3.1 Queries that select data (partea 1)"],["12","UNION, DISTINCT, alias-uri, calcule","3.1 Queries that select data (partea 2)"],["13","Sortarea și filtrarea","3.2 Queries that sort and filter data (partea 1)"],["14","TOP, IN, ANY, ALL și NULL","3.2 Queries that sort and filter data (partea 2)"],["15","Agregarea datelor","3.3 Queries that aggregate data"],["16","INSERT, UPDATE, DELETE","4.1 · 4.2 · 4.3 Data manipulation"],["17","Căutarea greșelilor în interogări","5.1 · 5.2 · 5.3 Troubleshooting"]],"blocks":[{"n":1,"title":"Tabele, rânduri și coloane","plain":"Tabele, rânduri și coloane","obj":"Domain 1 · obiectivul de examen 1.1 Given a scenario, design tables for storing data","intro":"Acesta este primul bloc al cursului: aici apar cuvintele cu care se descrie mai departe tot restul. Vom vedea ce este o bază de date, din ce se compune și cum se numesc părțile ei în engleză.","body":[{"k":"h","v":"1.1. Baza de date, SGBD și SQL"},{"k":"p","v":"<b>Database</b> — fișierul care păstrează datele și permite să le căutați și să construiți rapoarte pe baza lor. <b>Data</b> — informația organizată, introdusă în fișiere și disponibilă pentru a fi obținută în orice moment."},{"k":"p","v":"<b>SQL</b> (Structured Query Language) — limbajul în care se scriu interogările către date. El este format din cuvinte-cheie: <code>SELECT</code>, <code>FROM</code>, <code>WHERE</code> și altele. <b>SQL Server</b> — programul-server care păstrează bazele de date și toate setările legate de ele."},{"k":"lead","label":"Important.","v":"Examenul verifică cunoașterea ANSI SQL — varianta standardizată a limbajului, comună pentru MySQL, Microsoft SQL Server și Oracle. Exemplele din videoclipurile de curs sunt arătate în SQL Server, dar formulările întrebărilor vor fi cele standard."},{"k":"h","v":"1.2. Entity, row, column"},{"k":"p","v":"Datele se păstrează în <b>entities</b> — entități. Al doilea nume al aceluiași lucru este <b>table</b>, tabel. Tabelul are rânduri și coloane."},{"k":"b","v":["<b>Entity</b> (adică <b>table</b>) — obiect al bazei de date cu rânduri și coloane de date organizate.","<b>Row</b> (adică <b>record</b>) — un rând, un bloc de date cu valori pentru fiecare coloană. O înregistrare — un obiect: un om, o comandă, un produs.","<b>Column</b> (adică <b>field</b>) — proprietatea care descrie datele dintr-o entitate. Coloanele sunt caracteristicile: numele, data, prețul."]},{"k":"lead","label":"Exemplu.","v":"În tabelul <code>Person.Person</code> din baza AdventureWorks sunt aproape 20 000 de rânduri și 13 coloane. Fiecare rând este un om. Fiecare coloană este o caracteristică a lui: prenumele, numele, data modificării înregistrării."},{"k":"lead","label":"Cum țineți minte:","v":"rândul spune despre cine este înregistrarea, coloana — ce știm despre el."},{"k":"h","v":"1.3. Relational database"},{"k":"p","v":"<b>Relational database</b> — bază de date ale cărei entități pot fi unite între ele printr-un câmp comun. Tocmai de aceea datele nu se păstrează într-un singur tabel uriaș: ele se împart în mai multe și se leagă. Cum se face asta — în blocul 4."},{"k":"p","v":"În SQL Server tabelele se scriu de obicei în forma <code>schema.tabel</code>: <code>Person.Person</code>, <code>Sales.Customer</code>, <code>dbo.Employees</code>. Prima parte este <b>schema</b>, un dosar în interiorul bazei. Această scriere o veți vedea în fiecare interogare de la examen."},{"k":"h","v":"1.4. Object Explorer"},{"k":"p","v":"<b>Object Explorer</b> — fereastra din SQL Server Management Studio unde se văd toate bazele de date ale serverului și obiectele lor: tabele, views, proceduri, indexuri. Este locul de unde începe orice lucrare."},{"k":"table","head":["Termenul","Ce este","Cum țineți minte"],"rows":[["Data","Informație organizată, disponibilă pentru căutare","Materia primă"],["Database","Fișier care păstrează datele și permite rapoarte","Depozitul"],["Entity / Table","Obiect cu rânduri și coloane","O temă — un tabel"],["Row / Record","Un rând de date","Un obiect"],["Column / Field","Proprietate care descrie datele","O caracteristică"],["Relational database","Bază ale cărei tabele sunt legate printr-un câmp comun","Tabelele se împrietenesc"],["SQL","Limbaj de interogare pe cuvinte-cheie","Limbajul întrebărilor către date"],["Object Explorer","Fereastră cu lista bazelor și a obiectelor lor","Exploratorul serverului"]]}],"exam":"Entity = table, row = record, column = field — la examen aceste perechi sunt folosite ca sinonime, întrebarea poate conține oricare dintre cele două cuvinte. Rândul este o înregistrare întreagă, coloana este o singură proprietate la toate înregistrările. Relational database — bază în care tabelele sunt legate printr-un câmp comun.","qa":[["Cum se mai numește entity?","Table — tabel."],["Cum se mai numește row?","Record — înregistrare."],["Cum se mai numește column?","Field — câmp."],["Ce descrie coloana și ce descrie rândul?","Coloana este o singură proprietate a datelor; rândul este un obiect întreg."],["Ce face o bază să fie relational?","Tabelele ei pot fi unite printr-un câmp comun."],["În ce variantă de SQL sunt formulate întrebările examenului?","În ANSI SQL."]]},{"n":2,"title":"Cheia primară","plain":"Cheia primară","obj":"Domain 1 · obiectivul de examen 1.2 Given a scenario, identify the appropriate primary key","intro":"Fiecare tabel trebuie să aibă un câmp care deosebește o înregistrare de toate celelalte. Aceasta este cheia primară.","body":[{"k":"h","v":"2.1. Primary key"},{"k":"p","v":"<b>Primary key</b> — câmpul unei entități care garantează că fiecare înregistrare din ea este unică. Mai simplu: după valoarea cheii primare se poate găsi mereu exact un rând, fără să fie confundat cu altul."},{"k":"p","v":"Trei proprietăți ale cheii primare:"},{"k":"b","v":["valorile nu se repetă;","valoarea nu poate fi goală, adică nu poate fi <code>NULL</code>;","valoarea nu se schimbă în timp."]},{"k":"p","v":"Cheia primară se stabilește <b>atunci când entitatea abia se proiectează</b>, nu după ce în ea au fost deja introduse date."},{"k":"h","v":"2.2. Composite / compound key"},{"k":"p","v":"Uneori o singură coloană nu ajunge ca înregistrarea să devină unică. Atunci cheie se face combinația din două sau mai multe coloane. O astfel de cheie se numește <b>composite key</b> sau <b>compound key</b> — sunt două denumiri ale aceluiași lucru."},{"k":"lead","label":"Exemplu.","v":"În tabelul prezenței nici <code>StudentID</code>, nici <code>LessonID</code> nu sunt unice separat: un elev vine la multe lecții, la o lecție sunt mulți elevi. În schimb perechea „elev + lecție” apare exact o singură dată — ea va fi cheia compusă."},{"k":"lead","label":"Exemplu din AdventureWorks.","v":"În <code>Sales.SalesOrderDetail</code> cheia primară este compusă: <code>SalesOrderID</code> plus <code>SalesOrderDetailID</code>."},{"k":"h","v":"2.3. Cum alegeți cheia într-o sarcină"},{"k":"p","v":"La examen întrebarea sună de obicei așa: este dată descrierea unui tabel, trebuie aleasă cheia primară potrivită. Ordinea raționamentului:"},{"k":"b","v":["Găsiți câmpul ale cărui valori sigur nu se vor repeta la nimeni. De obicei este câmpul care are <code>ID</code> în denumire.","Verificați că el nu poate fi gol.","Dacă un astfel de câmp singur nu există — căutați o pereche de câmpuri care împreună dau unicitate. Aceasta va fi composite key.","Nu luați în cheie ceva ce se poate schimba: numele de familie, telefonul, adresa, email-ul."]},{"k":"table","head":["Termenul","Ce este","Cum țineți minte"],"rows":[["Primary key","Câmpul care face fiecare înregistrare unică","Pașaportul rândului"],["Composite key","Cheie din două sau mai multe câmpuri","Perechea care ajunge"],["Compound key","Același lucru, a doua denumire","Sinonim pentru composite"],["Constraint","Restricție pentru ce se poate introduce în câmp","Regulă pentru câmp"]]}],"exam":"Primary key ensures that every record in a table is unique — această formulare trebuie recunoscută cuvânt cu cuvânt. Cheia primară nu este niciodată goală. Dacă un singur câmp nu ajunge pentru unicitate, se folosește composite sau compound key — este aceeași noțiune cu două nume. Cheia se stabilește în etapa de proiectare a entității.","qa":[["Ce câmp garantează că fiecare înregistrare din tabel este unică?","Primary key."],["Cum se numește cheia atunci când cheie primară trebuie să fie două câmpuri?","Composite key, adică compound key."],["Poate cheia primară să fie goală?","Nu. Valoarea NULL în cheia primară nu este admisă."],["Când se stabilește cheia primară?","Atunci când entitatea abia se proiectează."],["De ce email-ul este o cheie primară proastă?","El se poate schimba, iar cheia trebuie să fie permanentă."],["Ce cheie va avea tabelul prezenței cu câmpurile StudentID și LessonID?","Compusă: StudentID + LessonID."]]},{"n":3,"title":"Tipurile de date","plain":"Tipurile de date","obj":"Domain 1 · obiectivul de examen 1.3 Given a scenario, choose data types to meet requirements","intro":"Tipul de date se stabilește la fiecare coloană și hotărăște ce se poate pune în ea. Alegerea tipului influențează deodată trei lucruri: ce operații vor funcționa, cât loc vor ocupa datele și cât de repede va merge căutarea.","body":[{"k":"h","v":"3.1. De ce este nevoie de tipul de date"},{"k":"p","v":"<b>Data type</b> — setarea care hotărăște ce date se pot introduce într-un câmp: un număr, o dată sau un șir de text. Majoritatea tipurilor sunt text sau numere."},{"k":"p","v":"Dacă data se păstrează ca text, sortarea și comparația se strică: șirul „02.01.2025” va ajunge înaintea șirului „10.12.2024”, pentru că textul se compară caracter cu caracter. Dacă numărul se păstrează ca text, pe el nu se poate calcula o sumă. De aceea tipul se alege după sensul datelor, nu „numai să încapă”."},{"k":"h","v":"3.2. Numerele"},{"k":"b","v":["<b>Integer</b> — numere întregi. <code>int</code> ocupă patru octeți, <code>tinyint</code> — un octet.","<code>decimal</code> și <code>numeric</code> — numere cu precizie fixă, pentru bani și măsurători.","<code>money</code> — tip special pentru bani. Intervalul este aproximativ de la −922 la 922 de trilioane.","<code>float</code> și <code>real</code> — numere aproximative. Pentru bani nu sunt potrivite."]},{"k":"h","v":"3.3. Textul și Unicode"},{"k":"b","v":["<b>Varchar</b> — tipul care păstrează un număr dat de caractere în câmp.","<b>Nvarchar</b> — același lucru, dar cu suport <b>Unicode</b>. Unicode este setul de caractere care admite cifre, litere și semne, inclusiv caracterele altor limbi.","<code>char</code> și <code>nchar</code> — aceleași perechi, dar cu lungime fixă."]},{"k":"lead","label":"Fapt-cheie.","v":"Nvarchar ocupă de două ori mai mult loc, pentru că păstrează datele în Unicode: doi octeți pe caracter în loc de unul. În schimb în el se pot păstra chirilica, hieroglifele și orice alfabet național."},{"k":"h","v":"3.4. Date calendaristice, ore și valori logice"},{"k":"b","v":["<b>Datetime</b> — tipul care păstrează data și ora. Există și <code>date</code> — doar data, <code>time</code> — doar ora.","<b>Bit</b> — tipul care păstrează fie zero, fie unu.","<b>Boolean</b> — tipul care admite valorile true sau false. În SQL Server rolul lui îl joacă <code>bit</code>: câmpul „da/nu”, „adevărat/fals”."]},{"k":"h","v":"3.5. Storage requirements"},{"k":"p","v":"<b>Byte</b> — unitatea de măsură care arată câtă memorie va ocupa o bucată de date. La un tabel de un milion de rânduri diferența dintre tipuri devine vizibilă: un octet în plus pe rând înseamnă un megaoctet în plus pe disc și în memorie."},{"k":"table","head":["Tipul","Ce păstrează","Mărimea"],"rows":[["tinyint","Întregi de la 0 la 255","1 octet"],["smallint","Numere întregi mici","2 octeți"],["int","Numere întregi","4 octeți"],["bigint","Numere întregi foarte mari","8 octeți"],["bit","0 sau 1, da/nu","1 bit"],["money","Sume de bani, ±922 tril.","8 octeți"],["decimal(p,s)","Numere cu precizie fixă","5–17 octeți"],["varchar(n)","Text fără Unicode","1 octet pe caracter"],["nvarchar(n)","Text cu Unicode","2 octeți pe caracter"],["datetime","Data și ora","8 octeți"]]}],"exam":"Int — patru octeți, tiny integer — un octet. Nvarchar folosește de două ori mai multe caractere, pentru că păstrează datele în Unicode. Bit păstrează fie zero, fie unu. Intervalul money este de la −922 la 922 de trilioane. Boolean este câmpul Yes/No, True/False. Pentru bani se ia decimal sau money, dar nu float.","qa":[["Câți octeți ocupă un câmp de tip int?","Patru octeți."],["Dar un câmp de tip tinyint?","Un octet."],["De ce nvarchar ocupă de două ori mai mult loc decât varchar?","Pentru că păstrează datele în Unicode: doi octeți pe caracter."],["Ce tip păstrează doar zero sau unu?","Bit."],["Ce tip alegeți pentru câmpul „Are înlesnire”?","Bit — este câmpul logic Yes/No."],["Care este intervalul de valori al câmpului money?","Aproximativ de la −922 la 922 de trilioane."],["De ce nu se poate păstra data într-un câmp text?","Se strică sortarea și comparația: textul se compară caracter cu caracter."]]},{"n":4,"title":"Relațiile dintre tabele și ERD","plain":"Relațiile dintre tabele și ERD","obj":"Domain 1 · obiectivul de examen 1.4 Given a scenario, design relationships between tables","intro":"Datele se împart în mai multe tabele și se leagă între ele. Relația se construiește pe o pereche de chei: cea primară într-un tabel și cea externă în celălalt.","body":[{"k":"h","v":"4.1. Foreign key"},{"k":"p","v":"<b>Foreign key</b> — câmpul unei entități care ajută la crearea relației „unu la multe” între entități. Cheia externă păstrează valoarea cheii primare a altui tabel."},{"k":"lead","label":"Regula principală:","v":"cheia externă stă întotdeauna de partea „multe”. Clientul are multe comenzi, deci <code>CustomerID</code> se află în tabelul comenzilor, nu invers."},{"k":"h","v":"4.2. Trei tipuri de relații"},{"k":"b","v":["<b>One-to-one relationship</b> — relația dintre două chei primare din două entități. Se întâlnește rar.","<b>One-to-many relationship</b> — relația dintre cheia primară dintr-o entitate și cheia externă din alta. Cazul cel mai frecvent: un client — multe comenzi.","<b>Many-to-many</b> — direct într-o bază relațională nu există. Ea se realizează printr-un tabel intermediar, care are de obicei cheie compusă."]},{"k":"lead","label":"Exemplu many-to-many.","v":"Elevul studiază multe materii, materia este studiată de mulți elevi. Între <code>Student</code> și <code>Subject</code> se pune un al treilea tabel <code>Enrollment</code> cu câmpurile <code>StudentID</code> și <code>SubjectID</code> — și se obțin două relații „unu la multe” în locul uneia „multe la multe”."},{"k":"h","v":"4.3. ERD"},{"k":"p","v":"<b>ERD</b> (Entity Relationship Diagram) — reprezentarea vizuală a bazei de date, a entităților ei și a relațiilor dintre ele. Pe diagramă dreptunghiurile sunt tabele, liniile dintre ele sunt relații, iar semnele de la capetele liniilor arată cardinalitatea: câte înregistrări dintr-o parte corespund înregistrărilor din cealaltă."},{"k":"h","v":"4.4. Referential integrity"},{"k":"p","v":"<b>Referential integrity</b> — garanția că într-o relație „unu la multe” valoarea trebuie să apară mai întâi în cheia primară a tabelului din partea „unu”, și abia apoi este permisă folosirea ei în partea „multe”."},{"k":"p","v":"<b>Orphaned record</b> — înregistrare „orfană”: rândul din partea „multe” care are în cheia externă o valoare ce nu există în cheia primară a tabelului legat. De exemplu, o comandă pe un client care nu există. Integritatea referențială este necesară tocmai pentru ca astfel de înregistrări să nu apară."},{"k":"table","head":["Termenul","Ce este","Cum țineți minte"],"rows":[["Foreign key","Câmp care trimite la cheia primară a altui tabel","Stă de partea „multe”"],["One-to-one","Relația a două chei primare","Unu la unu"],["One-to-many","Cheie primară ↔ cheie externă","Un client — multe comenzi"],["ERD","Schema entităților și a relațiilor dintre ele","Harta bazei"],["Referential integrity","Mai întâi în „unu”, apoi în „multe”","Părintele înaintea copilului"],["Orphaned record","Înregistrare cu trimitere în gol","Comandă fără client"]]}],"exam":"One-to-one — relația a două chei primare. One-to-many — relația cheii primare cu cea externă; cheia externă este mereu de partea „multe”. Relația „multe la multe” se realizează printr-un tabel intermediar. Referential integrity nu lasă să apară orphaned record — înregistrarea cu o cheie externă pentru care nu există cheia primară corespunzătoare.","qa":[["Ce chei participă la relația „unu la multe”?","Cheia primară a unui tabel și cheia externă a altuia."],["În care dintre cele două tabele se află cheia externă?","În cel din partea „multe”."],["Ce relație este între două chei primare a două tabele?","One-to-one."],["Cum se realizează relația „multe la multe”?","Printr-un tabel intermediar cu cheie compusă."],["Cum se descifrează ERD?","Entity Relationship Diagram."],["Ce este orphaned record?","Înregistrarea care are în cheia externă o valoare ce lipsește din cheia primară a tabelului legat."],["Ce împiedică apariția unor astfel de înregistrări?","Referential integrity."]]},{"n":5,"title":"Normalizarea","plain":"Normalizarea","obj":"Domain 1 · obiectivul de examen 1.5 Normalize a database","intro":"Normalizarea este procesul care pune tabelele în ordine astfel încât ele să lucreze corect unul cu altul. Examenul cere să știți să aduceți baza până la a treia formă normală.","body":[{"k":"h","v":"5.1. De ce se normalizează"},{"k":"p","v":"<b>Normalization</b> — procesul care asigură că o entitate din baza de date poate lucra cu alte entități așa cum are nevoie organizația, din punctul de vedere al structurii și al relațiilor."},{"k":"p","v":"Dacă totul se ține într-un singur tabel plat, încep trei feluri de probleme:"},{"k":"b","v":["aceleași date se repetă de sute de ori — aceasta este redundanța;","la modificarea datelor ele trebuie corectate în multe rânduri, și e ușor să scăpați ceva;","ștergând o înregistrare, se poate pierde din greșeală singura mențiune a altui lucru."]},{"k":"h","v":"5.2. First Normal Form (1NF)"},{"k":"p","v":"<b>1NF</b> — forma de normalizare în care fiecare câmp conține <b>o singură valoare</b>, ca datele să poată fi sortate în orice fel."},{"k":"p","v":"Ce încalcă 1NF: o listă într-o celulă („Matematică, Fizică, Chimie”) și grupurile de coloane care se repetă (<code>Phone1</code>, <code>Phone2</code>, <code>Phone3</code>)."},{"k":"h","v":"5.3. Second Normal Form (2NF)"},{"k":"p","v":"<b>2NF</b> — tabelul este deja în 1NF, și în plus fiecare coloană nerelevantă depinde de <b>toată</b> cheia compusă, nu de o parte a ei. A doua formă normală are sens doar acolo unde cheia este compusă: dacă cheia este formată dintr-un singur câmp, 2NF nu poate fi încălcată."},{"k":"lead","label":"Exemplu.","v":"Într-un tabel cu cheia „comandă + produs” denumirea produsului depinde doar de produs, nu de perechea întreagă. Înseamnă că denumirea produsului trebuie mutată într-un tabel separat."},{"k":"h","v":"5.4. Third Normal Form (3NF)"},{"k":"p","v":"<b>3NF</b> — forma de normalizare în care modificarea valorii dintr-o coloană nerelevantă a unui tabel nu cere modificarea altei coloane nerelevante din aceeași entitate."},{"k":"p","v":"Mai simplu: o coloană nerelevantă nu trebuie să depindă de altă coloană nerelevantă. Exemplul clasic este codul poștal și orașul: orașul se determină din codul poștal, nu din cheia primară a rândului. Înseamnă că perechea „cod poștal — oraș” se mută într-un tabel separat."},{"k":"table","head":["Forma","Regula","Cum verificați"],"rows":[["1NF","În fiecare celulă o singură valoare","Există liste în celulă? Există Phone1, Phone2?"],["2NF","Nicio dependență de o parte a cheii compuse","Cheia e compusă? Depinde totul de ea întreagă?"],["3NF","Coloana nerelevantă nu depinde de alta nerelevantă","Se poate calcula o coloană din alta?"]]}],"exam":"1NF — în fiecare câmp o singură valoare, ca datele să poată fi sortate în orice fel. 2NF există doar la cheie compusă. 3NF — modificarea unei coloane nerelevante nu trebuie să ceară modificarea altei coloane nerelevante. Normalizarea luptă cu redundanța și cu anomaliile la inserare, modificare și ștergere.","qa":[["Ce cere prima formă normală?","Ca fiecare câmp să conțină o singură valoare."],["Coloanele Phone1, Phone2, Phone3 — ce formă încalcă asta?","Prima: este un grup care se repetă."],["În ce caz a doua formă normală nu poate fi încălcată?","Când cheia primară este formată dintr-un singur câmp."],["Ce interzice a treia formă normală?","Dependența unei coloane nerelevante de alta nerelevantă."],["Până la ce formă normală trebuie să știți să aduceți baza la examen?","Până la a treia — 3NF."],["De ce se normalizează în general baza?","Ca să fie înlăturate redundanța și anomaliile la inserarea, modificarea și ștergerea datelor."]]},{"n":6,"title":"Protecția datelor","plain":"Protecția datelor","obj":"Domain 1 · obiectivul de examen 1.6 Given a scenario, identify data protection measures","intro":"Datele trebuie nu doar proiectate corect, ci și protejate: făcute copii, împărțite cu grijă drepturile, ascunse valorile sensibile și consemnat cine ce a făcut. În redacția obiectivelor din 2025 această secțiune este vizibil extinsă.","body":[{"k":"h","v":"6.1. Copiile de rezervă și restaurarea"},{"k":"b","v":["<b>Backup</b> — copia datelor păstrată în alt loc, ca să poată fi restaurată la pierderea sau deteriorarea originalului.","<b>Full backup</b> — copia de rezervă a întregii baze de date.","<b>Differential backup</b> — copia datelor care s-au schimbat de la ultima copie completă. Ocupă mai puțin loc și se face mai repede.","<b>Restore</b> — procesul de înlocuire a datelor pierdute sau stricate cu copia lor."]},{"k":"lead","label":"Cum funcționează împreună.","v":"Copia completă se face, de exemplu, o dată pe săptămână, iar cele diferențiale — în fiecare zi. La avarie se restaurează mai întâi copia completă, apoi ultima diferențială."},{"k":"h","v":"6.2. Principiul privilegiului minim și rolurile"},{"k":"p","v":"<b>Principle of least privilege</b> — principiul de acordare a drepturilor conform căruia oamenii care au acces la bază primesc drepturile necesare pentru îndeplinirea sarcinilor lor de serviciu, și <b>doar aceste</b> drepturi."},{"k":"p","v":"<b>Role</b> — un set anumit de drepturi în interiorul bazei de date. Rolurile sunt comode prin faptul că drepturile nu se dau fiecărui om separat, ci unui grup: ați atribuit rolul — ați dat deodată tot setul necesar."},{"k":"h","v":"6.3. GRANT, WITH GRANT OPTION, REVOKE"},{"k":"b","v":["<b>GRANT</b> — a acorda un drept asupra unui obiect al bazei de date unui utilizator sau unui rol.","<b>WITH GRANT OPTION</b> — completare la <code>GRANT</code>: destinatarul nu doar primește dreptul, ci îl poate și acorda mai departe altora. Trebuie folosit cu grijă — controlul asupra drepturilor se pierde.","<b>REVOKE</b> — a lua înapoi un drept acordat anterior."]},{"k":"code","v":"GRANT EXECUTE ON GetDepartment TO procTester WITH GRANT OPTION;\nREVOKE EXECUTE ON GetDepartment FROM procTester CASCADE;","raw":"GRANT EXECUTE ON GetDepartment TO procTester WITH GRANT OPTION;\nREVOKE EXECUTE ON GetDepartment FROM procTester CASCADE;"},{"k":"p","v":"<code>CASCADE</code> în <code>REVOKE</code> înseamnă: a lua dreptul nu doar de la utilizatorul însuși, ci și de la toți cărora el a reușit să îl transmită."},{"k":"h","v":"6.4. Encryption, hashing și masking"},{"k":"p","v":"Trei moduri diferite de a ascunde datele — examenul verifică dacă nu le confundați."},{"k":"b","v":["<b>Encryption</b> — criptarea. Datele se transformă într-o formă necitibilă, dar pot fi aduse înapoi dacă există cheia. Se aplică datelor de pe disc și datelor transmise prin rețea.","<b>Hashing</b> — hashing-ul. Datele se transformă într-un șir de lungime fixă, iar înapoi ele <b>nu pot</b> fi aduse. Așa se păstrează parolele: sistemul poate fi verificat pentru potrivire, dar parola inițială nu poate fi aflată din hash.","<b>Masking</b> — mascarea. Valoarea adevărată rămâne în bază, dar utilizatorului i se arată ascunsă: „**<b> </b><b> </b>** 1234”. Așa se dă acces la bază celor cărora nu li se cuvine să vadă datele întregi."]},{"k":"lead","label":"Cum țineți minte:","v":"encryption — se poate descifra înapoi; hashing — nu se poate; masking — datele sunt întregi, este ascunsă doar afișarea."},{"k":"h","v":"6.5. Auditing"},{"k":"p","v":"<b>Auditing</b> — auditul: ținerea unui jurnal despre cine, când și ce acțiuni a făcut în baza de date. Auditul nu previne încălcarea, ci o consemnează. El este necesar ca, după un incident, să se poată afla ce anume s-a întâmplat, și ca să fie îndeplinite cerințele autorităților."},{"k":"table","head":["Măsura","Ce face","Când se aplică"],"rows":[["Full backup","Copia întregii baze","Regulat, baza întreagă"],["Differential backup","Copia modificărilor de la ultima completă","Zilnic, între cele complete"],["Restore","Întoarcerea datelor din copie","După pierdere sau deteriorare"],["Least privilege","Doar drepturile necesare","Mereu, la acordarea accesului"],["Role","Set de drepturi pentru un grup","Când sunt mulți oameni"],["Encryption","Ascunde datele reversibil","Discul, transmiterea prin rețea"],["Hashing","Ascunde ireversibil","Parolele"],["Masking","Ascunde la afișare","Acces parțial la date"],["Auditing","Scrie cine ce a făcut","Investigație, raportare"]]}],"exam":"Full backup — toată baza, differential — doar modificările de la ultima copie completă. Restore — procesul de întoarcere a datelor din copie. Principle of least privilege: omul are drepturile necesare muncii lui, și niciunul în plus. GRANT acordă dreptul, WITH GRANT OPTION permite transmiterea lui mai departe, REVOKE îl ia înapoi. Encryption este reversibilă, hashing este ireversibil, masking ascunde doar afișarea. Auditing consemnează acțiunile, dar nu le interzice.","qa":[["Ce copiază differential backup?","Datele care s-au schimbat de la ultima copie de rezervă completă."],["Ce este restore?","Procesul de înlocuire a datelor pierdute sau deteriorate cu copia lor."],["Formulați principiul privilegiului minim.","Omul are exact acele drepturi care îi trebuie pentru muncă, și niciunul în plus."],["Ce adaugă WITH GRANT OPTION?","Posibilitatea de a transmite altora dreptul primit."],["Prin ce se deosebește hashing de encryption?","Hashing-ul este ireversibil: datele inițiale nu se pot reface din hash. Criptarea este reversibilă dacă există cheia."],["Ce măsură se aplică pentru a arăta doar ultimele patru cifre ale cardului?","Masking — mascarea."],["Pentru ce este nevoie de audit?","Ca să consemneze cine, când și ce a făcut în baza de date."],["Ce este role în baza de date?","Un set anumit de drepturi, care se acordă deodată în întregime."]]},{"n":7,"title":"CREATE, ALTER și DROP: lucrul cu tabelele","plain":"CREATE, ALTER și DROP: lucrul cu tabelele","obj":"Domain 2 · obiectivul de examen 2.1 Construct and analyze queries that create, alter, and drop tables","intro":"Domeniul 2 se numește Database Object Management using DDL. DDL sunt comenzile care schimbă nu datele, ci structura bazei. Începem cu tabelele.","body":[{"k":"h","v":"7.1. DDL și DML"},{"k":"p","v":"Toate comenzile SQL se împart în două grupe mari, iar examenul verifică priceperea de a le deosebi."},{"k":"b","v":["<b>DDL</b> (Data Definition Language) — lucrul cu structura: <code>CREATE</code>, <code>ALTER</code>, <code>DROP</code>, <code>TRUNCATE</code>.","<b>DML</b> (Data Manipulation Language) — lucrul cu datele: <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>."]},{"k":"p","v":"<b>CREATE</b> — cuvântul-cheie care adaugă un obiect în baza de date sau o bază întreagă într-o instanță SQL Server. <b>ALTER</b> — care schimbă definiția unui obiect al bazei de date. <b>DROP</b> — care șterge un obiect al bazei de date."},{"k":"h","v":"7.2. CREATE TABLE"},{"k":"p","v":"Ordinea este aceasta: <code>CREATE TABLE</code>, numele tabelului, paranteză rotundă, lista coloanelor despărțite prin virgulă, paranteza de închidere. Fiecare coloană se descrie ca „nume — tip — restricții”."},{"k":"code","v":"CREATE TABLE BikeRepairs (\n    BikeRepairID      int,\n    CustomerID        int,\n    StartDate         datetime,\n    EndDate           datetime,\n    EstHour           int,\n    EstRate           money,\n    RepairDescription varchar(50)\n)","raw":"CREATE TABLE BikeRepairs (\n    BikeRepairID      int,\n    CustomerID        int,\n    StartDate         datetime,\n    EndDate           datetime,\n    EstHour           int,\n    EstRate           money,\n    RepairDescription varchar(50)\n)"},{"k":"lead","label":"Greșeală frecventă:","v":"virgula după ultima coloană. Ea nu trebuie să existe."},{"k":"h","v":"7.3. NULL și NOT NULL"},{"k":"p","v":"<b>NULL</b> — cuvântul-cheie SQL care marchează o valoare goală într-un câmp. Nu este nici zero, nici un șir gol, ci anume <b>lipsa valorii</b>."},{"k":"p","v":"<code>NOT NULL</code> în descrierea coloanei înseamnă: câmpul este obligatoriu de completat, nu poate fi lăsat gol. Dacă nu se indică nimic, câmpul este considerat că admite <code>NULL</code>."},{"k":"code","v":"CREATE TABLE BikeRepairsTest2 (\n    BikeRepairID int not null primary key,\n    CustomerID   int not null,\n    StartDate    datetime,\n    EstRate      money not null,\n    RepairDescription varchar(50)\n)","raw":"CREATE TABLE BikeRepairsTest2 (\n    BikeRepairID int not null primary key,\n    CustomerID   int not null,\n    StartDate    datetime,\n    EstRate      money not null,\n    RepairDescription varchar(50)\n)"},{"k":"p","v":"Aici <code>BikeRepairID</code>, <code>CustomerID</code> și <code>EstRate</code> trebuie completate obligatoriu, iar <code>StartDate</code> și <code>RepairDescription</code> pot fi lăsate goale."},{"k":"h","v":"7.4. ALTER TABLE"},{"k":"p","v":"<code>ALTER TABLE</code> schimbă un tabel deja existent: adaugă o coloană, îi schimbă tipul sau o șterge."},{"k":"code","v":"ALTER TABLE BikeRepairs\n   ADD DueDate datetime\n\nALTER TABLE BikeRepairs\n   ALTER COLUMN RepairDescription nvarchar(100)","raw":"ALTER TABLE BikeRepairs\n   ADD DueDate datetime\n\nALTER TABLE BikeRepairs\n   ALTER COLUMN RepairDescription nvarchar(100)"},{"k":"h","v":"7.5. DROP TABLE"},{"k":"p","v":"<code>DROP TABLE</code> șterge tabelul în întregime — și datele, și structura însăși. După această comandă tabelul nu mai există în bază."},{"k":"code","v":"DROP TABLE BikeRepairs_OLD","raw":"DROP TABLE BikeRepairs_OLD"},{"k":"table","head":["Comanda","Ce face","Grupa"],"rows":[["CREATE TABLE","Creează un tabel nou","DDL"],["ALTER TABLE ... ADD","Adaugă o coloană","DDL"],["ALTER TABLE ... ALTER COLUMN","Schimbă tipul coloanei","DDL"],["DROP TABLE","Șterge tabelul împreună cu structura","DDL"],["NOT NULL","Interzice lăsarea câmpului gol","Restricție"],["Constraint","Restricție asupra valorilor din câmp","Restricție"]]}],"exam":"CREATE adaugă un obiect, ALTER schimbă definiția obiectului, DROP șterge obiectul. NULL este valoarea goală, nu zero. Coloana cu NOT NULL este obligatorie de completat; dacă nu se indică nimic, câmpul admite NULL. Virgula după ultima coloană în CREATE TABLE este o eroare de sintaxă. DROP TABLE înlătură și datele, și structura.","qa":[["Ce cuvânt-cheie schimbă definiția unui obiect al bazei de date?","ALTER."],["Ce înseamnă NULL?","Valoarea goală dintr-un câmp — lipsa valorii, nu zero."],["Ce înseamnă NOT NULL la o coloană?","Că acel câmp este obligatoriu de completat."],["Din ce grupă de comenzi face parte CREATE TABLE — DDL sau DML?","Din DDL."],["Ce va rămâne din tabel după DROP TABLE?","Nimic: se șterg și datele, și structura."],["Cum adăugați o coloană într-un tabel existent?","ALTER TABLE nume ADD coloană tip."]]},{"n":8,"title":"Views (reprezentările)","plain":"Views (reprezentările)","obj":"Domain 2 · obiectivul de examen 2.2 Construct and analyze queries that create, alter, and drop views","intro":"View-ul este o interogare salvată care se comportă ca un tabel. În redacția din 2025 în obiectiv a fost adăugat punctul „purpose of views”: trebuie să înțelegeți nu doar sintaxa, ci și pentru ce sunt necesare views.","body":[{"k":"h","v":"8.1. Ce este view"},{"k":"p","v":"<b>View</b> — obiect SQL Server care reprezintă o interogare salvată pentru obținerea datelor."},{"k":"lead","label":"Fapt-cheie.","v":"View nu păstrează datele. El păstrează doar textul interogării. De fiecare dată când se accesează view-ul, interogarea se execută din nou și întoarce datele actuale din tabelele-sursă."},{"k":"h","v":"8.2. Pentru ce sunt necesare views"},{"k":"b","v":["<b>Ascunderea complexității.</b> O interogare cu patru îmbinări și filtre se ascunde în spatele unui singur nume scurt.","<b>Limitarea accesului.</b> Utilizatorului i se acordă dreptul asupra view-ului, nu asupra tabelului. El va vedea doar acele coloane și rânduri care au intrat în interogarea view-ului — de exemplu, salariul colegilor nu îl va vedea.","<b>Refolosirea logicii.</b> Un calcul scris o singură dată este folosit de zeci de rapoarte și se corectează într-un singur loc.","<b>Nume obișnuite.</b> Denumirile tehnice ale coloanelor se înlocuiesc cu unele clare prin alias-uri."]},{"k":"h","v":"8.3. CREATE, ALTER și DROP VIEW"},{"k":"code","v":"CREATE VIEW Sales.SaleView AS\nSELECT SalesOrderID, OrderDate, ShipDate, DueDate,\n       Status, CustomerID, SalesPersonID, Subtotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2011-06-01' AND '2011-06-30'","raw":"CREATE VIEW Sales.SaleView AS\nSELECT SalesOrderID, OrderDate, ShipDate, DueDate,\n       Status, CustomerID, SalesPersonID, Subtotal\nFROM Sales.SalesOrderHeader\nWHERE OrderDate BETWEEN '2011-06-01' AND '2011-06-30'"},{"k":"p","v":"După creare, view-ul se accesează ca un tabel obișnuit:"},{"k":"code","v":"SELECT * FROM Sales.SaleView","raw":"SELECT * FROM Sales.SaleView"},{"k":"p","v":"<code>ALTER VIEW</code> schimbă interogarea din interiorul view-ului, <code>DROP VIEW</code> șterge view-ul însuși. Tabelele-sursă nu au de suferit — se șterge doar interogarea salvată."},{"k":"table","head":["Comanda","Ce face","Ce se întâmplă cu datele"],"rows":[["CREATE VIEW","Salvează interogarea sub un nume","Datele nu se copiază"],["ALTER VIEW","Schimbă interogarea din view","Datele nu se schimbă"],["DROP VIEW","Șterge view-ul","Tabelele rămân neatinse"]]}],"exam":"View este saved query for retrieving data. View-ul nu păstrează datele, el păstrează interogarea, de aceea arată mereu starea actuală a tabelelor. Scopurile principale: ascunderea complexității interogării, limitarea accesului la coloane și rânduri, refolosirea logicii. DROP VIEW șterge doar view-ul, tabelele-sursă rămân.","qa":[["Ce este view, într-o singură frază?","O interogare salvată pentru obținerea datelor."],["Păstrează view-ul datele însele?","Nu, doar textul interogării."],["Numiți două motive pentru a folosi view.","Ascunderea complexității interogării și limitarea accesului la o parte din date."],["Ce se va întâmpla cu tabelul-sursă după DROP VIEW?","Nimic: se șterge doar view-ul."],["Cum accesați view-ul după crearea lui?","La fel ca pe un tabel: SELECT * FROM numele_view-ului."]]},{"n":9,"title":"Proceduri stocate și funcții","plain":"Proceduri stocate și funcții","obj":"Domain 2 · obiectivul de examen 2.3 Construct and analyze stored procedures and functions","intro":"Procedura stocată este tot un cod salvat, dar, spre deosebire de view, ea poate primi parametri și poate modifica datele. În redacția din 2025 a fost adăugat punctul „purpose of stored procedures”.","body":[{"k":"h","v":"9.1. Ce este stored procedure"},{"k":"p","v":"<b>Stored procedure</b> — obiect SQL Server care reprezintă o interogare salvată pentru obținerea sau modificarea datelor. Se pornește cu comanda <b>EXEC</b>."},{"k":"p","v":"Pentru ce sunt necesare procedurile:"},{"k":"b","v":["codul scris o singură dată este folosit de multe ori și se corectează într-un singur loc;","procedura primește parametri, de aceea același cod lucrează pentru valori diferite;","drepturile pot fi acordate pentru executarea procedurii, fără a da acces la tabelele însele;","transmiterea valorilor prin parametri este mai sigură decât lipirea interogării din bucăți de text."]},{"k":"h","v":"9.2. Input și output parameters"},{"k":"p","v":"<b>Parameter</b> — valoarea, de obicei dată de utilizator, care se folosește pentru obținerea datelor la pornirea unei proceduri stocate."},{"k":"b","v":["<b>Input parameter</b> — valoarea pe care omul o introduce ca să o folosească drept filtru la pornirea procedurii.","<b>Output parameter</b> — valoarea care se întoarce din procedură în afară. În declarație se marchează cu cuvântul <code>output</code>."]},{"k":"code","v":"CREATE PROCEDURE GetDepartment\n  @EmployeeID   int,\n  @DepartmentID int output\nAS\nBEGIN\n  SELECT @DepartmentID = DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\nEND\n\nEXEC GetDepartment 16, 1","raw":"CREATE PROCEDURE GetDepartment\n  @EmployeeID   int,\n  @DepartmentID int output\nAS\nBEGIN\n  SELECT @DepartmentID = DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\nEND\n\nEXEC GetDepartment 16, 1"},{"k":"p","v":"Aici <code>@EmployeeID</code> este parametrul de intrare: după el caută procedura. <code>@DepartmentID</code> este cel de ieșire: în el se pune rezultatul."},{"k":"h","v":"9.3. RETURN"},{"k":"p","v":"<b>RETURN</b> — cuvântul-cheie care formează și reține valoarea ce reprezintă rezultatul lucrului procedurii stocate."},{"k":"code","v":"CREATE PROCEDURE GetDepartmentIDTest\n  @EmployeeID int\nAS\n  SELECT DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\n  RETURN","raw":"CREATE PROCEDURE GetDepartmentIDTest\n  @EmployeeID int\nAS\n  SELECT DepartmentID\n  FROM HumanResources.EmployeeDepartmentHistory\n  WHERE BusinessEntityID = @EmployeeID\n  RETURN"},{"k":"h","v":"9.4. Procedura și funcția"},{"k":"p","v":"Funcția păstrează și ea cod, dar se folosește altfel: ea se apelează chiar în interiorul interogării, în lista <code>SELECT</code> sau în condiția <code>WHERE</code>. Procedura nu poate fi folosită așa — ea se pornește separat, prin <code>EXEC</code>."},{"k":"table","head":["Criteriul","Stored procedure","Funcția"],"rows":[["Cum se apelează","EXEC nume parametri","În interiorul SELECT sau WHERE"],["Ce întoarce","Set de date, parametri output, RETURN","Întoarce obligatoriu o valoare"],["Poate modifica datele","Da","Nu"],["Parametrii","De intrare și de ieșire","Doar de intrare"]]}],"exam":"Stored procedure — a saved query for retrieving or changing data. Input parameter este valoarea pe care utilizatorul o introduce ca filtru la pornirea procedurii; output parameter este valoarea pe care procedura o întoarce în afară. RETURN formează și reține rezultatul procedurii. Procedura se pornește prin EXEC; funcția se apelează în interiorul interogării și este obligată să întoarcă o valoare.","qa":[["Ce este o procedură stocată?","O interogare salvată pentru obținerea sau modificarea datelor."],["Cu ce comandă se pornește o procedură stocată?","EXEC."],["Ce este input parameter?","Valoarea pe care omul o introduce ca filtru la pornirea procedurii."],["Ce este output parameter?","Valoarea care se întoarce din procedură în afară."],["Cu ce cuvânt se marchează parametrul de ieșire în declarație?","Cu cuvântul output."],["Prin ce se deosebește funcția de procedură după modul de apelare?","Funcția se apelează în interiorul interogării, procedura — separat, prin EXEC."],["Numiți un motiv pentru a folosi proceduri.","Drepturile pot fi acordate pentru executarea procedurii, fără a deschide accesul la tabele."]]},{"n":10,"title":"Indexurile","plain":"Indexurile","obj":"Domain 2 · obiectivul de examen 2.4 Given a scenario, choose between clustered and non-clustered indexes","intro":"Indexul accelerează căutarea datelor. Examenul întreabă în principal un lucru: care este diferența dintre indexul clustered și cel non-clustered și când se aplică fiecare.","body":[{"k":"h","v":"10.1. Ce este index"},{"k":"p","v":"<b>Index</b> — tabel virtual care ordonează informația dintr-o entitate și face obținerea acestei informații mai ușoară decât fără index."},{"k":"lead","label":"Cum țineți minte:","v":"indexul este indexul alfabetic de la sfârșitul manualului. Fără el pagina căutată se găsește răsfoind toată cartea, cu el — direct după index."},{"k":"h","v":"10.2. Clustered index"},{"k":"p","v":"<b>Clustered index</b> — index construit pe cheia primară a entității."},{"k":"p","v":"Indexul clustered stabilește <b>ordinea fizică</b> a rândurilor în tabel. De aici urmează principalul: indexul clustered poate fi într-un tabel doar <b>unul</b>. Rândurile nu pot fi așezate în două ordini diferite în același timp."},{"k":"h","v":"10.3. Nonclustered index"},{"k":"p","v":"<b>Nonclustered index</b> — index construit pe un câmp al entității care nu este cheia ei primară."},{"k":"p","v":"Indexul non-clustered nu schimbă ordinea rândurilor, ci se păstrează separat și trimite la ele. De aceea astfel de indexuri pot fi <b>multe</b> într-un tabel — câte unul pentru fiecare câmp după care se caută des."},{"k":"h","v":"10.4. Sintaxa"},{"k":"code","v":"CREATE INDEX ndx_CustomerID ON BikeRepairs (CustomerID)","raw":"CREATE INDEX ndx_CustomerID ON BikeRepairs (CustomerID)"},{"k":"h","v":"10.5. Când indexul nu este necesar"},{"k":"p","v":"Indexul accelerează extragerea, dar încetinește adăugarea, modificarea și ștergerea datelor: la fiecare astfel de operație indexul trebuie reconstruit. Pe lângă asta, el ocupă loc pe disc. De aceea indexurile nu se pun pe tabele mici și pe câmpuri după care aproape nu se caută."},{"k":"table","head":["Criteriul","Clustered index","Nonclustered index"],"rows":[["Pe ce câmp","Pe cheia primară","Pe orice alt câmp"],["Câte sunt într-un tabel","Doar unul","Pot fi multe"],["Ordinea rândurilor","Stabilește ordinea fizică","Nu schimbă ordinea rândurilor"],["Unde se păstrează","Împreună cu datele","Separat, cu trimiteri la rânduri"]]}],"exam":"Index — a virtual table used to sort information in an entity and make it easier to retrieve. Clustered index se construiește pe cheia primară și stabilește ordinea fizică a rândurilor, de aceea el este într-un tabel exact unul. Nonclustered index se construiește pe un câmp care nu este cheia primară, iar astfel de indexuri pot fi mai multe. Indexurile accelerează SELECT, dar încetinesc INSERT, UPDATE și DELETE.","qa":[["Ce este index?","Tabel virtual care ordonează datele și accelerează obținerea lor."],["Pe ce câmp se construiește indexul clustered?","Pe cheia primară."],["Câte indexuri clustered pot fi într-un singur tabel?","Doar unul."],["De ce doar unul?","El stabilește ordinea fizică a rândurilor, iar rândurile nu pot fi așezate în două ordini deodată."],["Pe ce câmp se construiește indexul non-clustered?","Pe un câmp care nu este cheia primară."],["Ce operații încetinește indexul?","INSERT, UPDATE și DELETE."]]},{"n":11,"title":"Îmbinarea tabelelor: JOIN","plain":"Îmbinarea tabelelor: JOIN","obj":"Domain 3 · obiectivul de examen 3.1 Construct and analyze queries that select data (partea 1)","intro":"Domeniul 3 este cel mai mare de la examen, iar îmbinările sunt baza lui. Aici trebuie nu doar să învățați cuvintele, ci să înțelegeți ce rânduri ajung în rezultat la fiecare tip de îmbinare.","body":[{"k":"h","v":"11.1. SELECT și Query"},{"k":"p","v":"<b>Query</b> — propoziția folosită pentru obținerea datelor necesare din bază. <b>SELECT</b> — cuvântul-cheie SQL folosit pentru obținerea datelor din bază. Cea mai simplă interogare arată așa:"},{"k":"code","v":"SELECT CustomerID, AccountNumber\nFROM Sales.Customer","raw":"SELECT CustomerID, AccountNumber\nFROM Sales.Customer"},{"k":"h","v":"11.2. Join"},{"k":"p","v":"<b>Join</b> — unirea a două entități într-o singură interogare, la care datele se leagă după un câmp comun ambelor entități."},{"k":"p","v":"Patru tipuri de îmbinări care trebuie deosebite:"},{"k":"b","v":["<b>Inner join</b> — îmbinarea care arată înregistrările legate din ambele tabele. Rândurile fără pereche nu ajung în rezultat.","<b>Left outer join</b> — îmbinarea care arată toate înregistrările din primul tabel indicat în îmbinare și înregistrările legate din al doilea.","<b>Right outer join</b> — îmbinarea care arată toate înregistrările din al doilea tabel indicat în îmbinare.","<b>Full outer join</b> — îmbinarea care arată toate înregistrările din ambele tabele."]},{"k":"p","v":"<b>Outer join</b> — denumirea generală pentru îmbinarea care arată toate înregistrările dintr-o parte și înregistrările legate din cealaltă. Acolo unde perechea lipsește, în coloanele celui de-al doilea tabel va fi <code>NULL</code>."},{"k":"code","v":"SELECT c.CustomerID, c.AccountNumber, soh.OrderDate, soh.Status\nFROM Sales.Customer AS c\nLEFT JOIN Sales.SalesOrderHeader AS soh\n       ON c.CustomerID = soh.CustomerID","raw":"SELECT c.CustomerID, c.AccountNumber, soh.OrderDate, soh.Status\nFROM Sales.Customer AS c\nLEFT JOIN Sales.SalesOrderHeader AS soh\n       ON c.CustomerID = soh.CustomerID"},{"k":"h","v":"11.3. Cross join și Cartesian product"},{"k":"p","v":"<b>Cartesian product</b> — îmbinarea a două tabele nelegate într-o interogare. Fiecare rând al primului tabel se unește cu fiecare rând al celui de-al doilea, de aceea numărul de rânduri din rezultat este egal cu produsul numărului de rânduri din tabele."},{"k":"p","v":"Un astfel de rezultat se obține în două feluri: intenționat — prin comanda <code>CROSS JOIN</code>, și din întâmplare — dacă enumerați tabelele prin virgulă și uitați condiția de legătură. În redacția din 2025 <code>CROSS JOIN</code> este numit direct în obiectiv."},{"k":"code","v":"-- produs cartezian întâmplător: nu există condiție de legătură\nSELECT * FROM Sales.Customer, Sales.SalesOrderHeader\n\n-- intenționat\nSELECT * FROM Sizes CROSS JOIN Colors","raw":"-- produs cartezian întâmplător: nu există condiție de legătură\nSELECT * FROM Sales.Customer, Sales.SalesOrderHeader\n\n-- intenționat\nSELECT * FROM Sizes CROSS JOIN Colors"},{"k":"h","v":"11.4. Self join"},{"k":"p","v":"<b>Self join</b> — îmbinarea care leagă două câmpuri ale aceleiași entități între ele. Cazul clasic este angajatul și șeful lui: amândoi se află în același tabel."},{"k":"p","v":"Fără alias-uri o astfel de interogare nu poate fi scrisă: bazei trebuie să i se explice unde este „angajatul” și unde este „șeful”."},{"k":"code","v":"SELECT e.EmployeeID,\n       e.LastName AS 'Employee
